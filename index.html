  :root{
    /* savi brand palette (per Brand Guidelines V0.1) */
    --savi-green:#224B50;
    --savi-light-green:#4DFFA8;
    --savi-blue:#00CCCC;
    --savi-grey:#F6F6EE;
    --savi-white:#FFFFFF;
    --savi-muted:#5C6B6E;
    --savi-mint:#C9FFE5;
    /* app tokens, derived from the brand palette */
    --teal-900:#224B50;
    --teal-700:#224B50;
    --teal-600:#224B50;
    --teal-100:#C9FFE5;
    --teal-50:#F6F6EE;
    --ink-900:#224B50;
    --ink-600:#5C6B6E;
    --ink-400:#5C6B6E;
    --paper:#F6F6EE;
    --line:#D5DEDB;
    --card:#ffffff;
    --kpi-bg:#E6E9E4;
    --red:#c0392b;
    --red-bg:#fdecea;
    --amber:#b9770e;
    --amber-bg:#fdf3e1;
    --green:#1f8b4c;
    --green-bg:#e9f8ee;
    --radius:10px;
    --shadow:0 1px 2px rgba(34,75,80,0.07), 0 4px 14px rgba(34,75,80,0.07);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Sharp Sans Display No1","Century Gothic","URW Gothic",Futura,"Trebuchet MS",sans-serif;
    background:var(--paper);
    color:var(--ink-900);
    -webkit-font-smoothing:antialiased;
  }
  #app{min-height:100vh;padding-bottom:60px;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  input, select, textarea{font-family:inherit;}

  /* ===== App shell: left sidebar + main area ===== */
  html, body{height:100%;}
  #app{min-height:100vh;padding-bottom:0;}
  .app-shell{display:flex;min-height:100vh;align-items:stretch;}
  .sidebar{
    width:232px;flex-shrink:0;background:var(--teal-900);color:#fff;
    display:flex;flex-direction:column;padding:22px 16px 18px;
    position:sticky;top:0;height:100vh;overflow-y:auto;
  }
  .sidebar-logo{margin-bottom:22px;padding:0 4px;}
  .sidebar-logo .logo-img{height:40px;display:block;}
  .sidebar-logo .logo-sub{font-size:10px;letter-spacing:.16em;opacity:.6;margin-top:6px;font-weight:600;}
  .sidebar-section-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;opacity:.55;margin:16px 4px 8px;font-weight:700;}
  .sidebar-nav-item{
    display:flex;align-items:center;gap:10px;width:100%;text-align:left;
    background:transparent;border:none;border-left:3px solid transparent;color:#fff;
    padding:10px 11px;border-radius:8px;font-size:13.5px;font-weight:600;margin-bottom:4px;
  }
  .sidebar-nav-item:hover{background:rgba(255,255,255,.08);}
  .sidebar-nav-item.active{background:rgba(255,255,255,.14);border-left-color:var(--savi-light-green);}
  .sidebar-icon{width:16px;text-align:center;flex-shrink:0;}
  .sidebar-campaign-list{display:flex;flex-direction:column;gap:6px;margin-top:8px;margin-bottom:10px;max-height:260px;overflow-y:auto;}
  .sidebar-campaign-item{
    position:relative;text-align:left;background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:8px 28px 8px 12px;color:#fff;
  }
  .sidebar-campaign-item:hover{background:rgba(255,255,255,.09);}
  .sidebar-campaign-item.active{background:rgba(255,255,255,.14);border-color:var(--savi-light-green);}
  .sidebar-campaign-item .sci-name{font-size:13px;font-weight:700;line-height:1.3;}
  .sidebar-campaign-item .sci-client{font-size:11px;opacity:.65;margin-top:1px;}
  .sidebar-attn-dot{width:8px;height:8px;border-radius:50%;background:#e07b39;position:absolute;top:10px;right:10px;}
  .sidebar-new-btn{
    margin-top:auto;border:1.5px dashed rgba(255,255,255,.4);background:transparent;color:#fff;
    padding:11px;border-radius:8px;font-size:13.5px;font-weight:700;
  }
  .sidebar-new-btn:hover{background:rgba(255,255,255,.08);}

  .main-area{flex:1;min-width:0;display:flex;flex-direction:column;}
  .main-topbar{background:#fff;border-bottom:1px solid var(--line);padding:18px 28px;}
  .main-topbar h1{margin:0;font-size:19px;}
  .main-content{flex:1;padding-bottom:60px;}

  .wrap{max-width:1180px;margin:0 auto;padding:28px 28px 0;}
  .wrap-narrow{max-width:880px;margin:0 auto;padding:28px 28px 0;}

  h1{font-size:22px;margin:0 0 4px;}
  h2{font-size:17px;margin:0 0 2px;}
  .subtle{color:var(--ink-600);font-size:13px;}
  .section-title{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--teal-700);font-weight:700;margin:34px 0 12px;display:flex;align-items:center;gap:10px;}
  .section-title::after{content:"";flex:1;height:1px;background:var(--line);}

  .btn{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--teal-700);color:#fff;border:none;
    padding:10px 16px;border-radius:8px;font-size:13.5px;font-weight:600;
    transition:background .12s;
  }
  .btn:hover{background:var(--teal-700);opacity:.88;}
  .btn.secondary{background:#fff;color:var(--teal-700);border:1px solid var(--teal-600);}
  .btn.secondary:hover{background:var(--teal-50);}
  .btn.ghost{background:transparent;color:var(--ink-600);border:1px solid var(--line);}
  .btn.ghost:hover{background:#fff;}
  .btn.danger{background:#fff;color:var(--red);border:1px solid var(--red);}
  .btn.danger:hover{background:var(--red-bg);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn.small{padding:6px 11px;font-size:12.5px;}
  .btn-icon{width:13px;height:13px;flex-shrink:0;margin-right:1px;}

  /* ===== Status pill ===== */
  .status-pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:4px 12px;border-radius:20px;background:var(--kpi-bg);color:var(--ink-600);}
  .status-pill.live{background:var(--green-bg);color:var(--green);}
  .status-pill.upcoming{background:var(--teal-100);color:var(--teal-700);}
  .status-pill.ended{background:var(--kpi-bg);color:var(--ink-600);}
  .status-pill.neutral{background:var(--kpi-bg);color:var(--ink-400);}

  /* ===== Labeled cap/attainment progress bar ===== */
  .cap-row{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;color:var(--ink-900);margin-bottom:8px;}
  .cap-row .cap-figure{color:var(--ink-600);font-size:12.5px;}
  .cap-track{height:10px;border-radius:6px;background:var(--kpi-bg);overflow:hidden;}
  .cap-fill{height:100%;border-radius:6px;background:var(--teal-600);}

  /* ===== Dashboard ===== */
  .dash-stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:20px;}
  .dash-stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;box-shadow:var(--shadow);}
  .dash-stat .ds-num{font-size:26px;font-weight:800;color:var(--ink-900);}
  .dash-stat .ds-label{font-size:12px;color:var(--ink-600);margin-top:2px;font-weight:600;}
  .dash-stat.live .ds-num{color:var(--green);}
  .dash-stat.upcoming .ds-num{color:var(--teal-600);}
  .dash-stat.ended .ds-num{color:var(--ink-400);}
  .dash-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
  .dash-search{padding:9px 12px;border:1px solid var(--line);border-radius:7px;font-size:13px;min-width:220px;}
  .dash-search:focus{outline:2px solid var(--savi-blue);outline-offset:1px;border-color:var(--savi-blue);}
  .dash-filter-tabs{display:flex;gap:4px;flex-wrap:wrap;}
  .dash-filter-tab{padding:7px 12px;border:1px solid var(--line);background:#fff;border-radius:20px;font-size:12.5px;font-weight:600;color:var(--ink-600);}
  .dash-filter-tab.active{background:var(--teal-600);border-color:var(--teal-600);color:#fff;}
  .dash-filter-tab:hover:not(.active){background:var(--teal-50);}
  .dash-cdowner-select{padding:8px 10px;border:1px solid var(--line);border-radius:7px;font-size:12.5px;color:var(--ink-600);background:#fff;}
  .admin-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:22px;margin-bottom:24px;box-shadow:var(--shadow);}
  .admin-danger{border-color:#f3c6c1;background:var(--red-bg);}
  .admin-storage{margin-top:16px;}

  /* ===== Board ===== */
  .board-row{display:flex;gap:14px;overflow-x:auto;padding-bottom:14px;}
  .board-col{flex:1;min-width:230px;background:var(--paper);border-radius:10px;padding:12px;}
  .board-col-header{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:700;color:var(--ink-600);margin-bottom:10px;padding:0 4px;}
  .board-col-count{background:var(--kpi-bg);color:var(--ink-600);font-size:11px;padding:1px 7px;border-radius:10px;}
  .board-col-body{display:flex;flex-direction:column;gap:8px;min-height:70px;border-radius:8px;transition:background .1s;}
  .board-col-body.drag-over{background:var(--teal-100);}
  .board-card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:grab;box-shadow:var(--shadow);}
  .board-card.dragging{opacity:.4;}
  .bc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .bc-name{font-size:13px;font-weight:700;color:var(--ink-900);}
  .bc-client{font-size:11.5px;color:var(--ink-400);margin-top:1px;}
  .bc-owner{font-size:11px;color:var(--ink-600);margin-top:4px;}
  .board-empty{font-size:12px;color:var(--ink-400);text-align:center;padding:16px 0;}
  .bc-checklist{margin-top:9px;padding-top:8px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px;}
  .bc-checklist-head{font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-400);font-weight:700;margin-bottom:2px;display:flex;justify-content:space-between;}
  .bc-checklist-count{color:var(--teal-600);}
  .bc-check-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-600);cursor:pointer;}
  .bc-check-item input{width:12px;height:12px;flex-shrink:0;cursor:pointer;}
  .bc-check-item.done{color:var(--ink-400);text-decoration:line-through;}

  /* ===== Paste handover ===== */
  .handover-textarea{width:100%;min-height:280px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;font-size:13px;line-height:1.5;font-family:inherit;resize:vertical;}
  .handover-textarea:focus{outline:2px solid var(--savi-blue);outline-offset:1px;border-color:var(--savi-blue);}
  .ho-ok{color:var(--green);font-weight:700;font-size:12px;}
  .ho-need{color:var(--amber);font-weight:700;font-size:12px;}
  .ho-none{color:var(--ink-400);font-size:12px;}
  .ho-unplaced{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:12.5px;color:var(--ink-600);display:flex;flex-direction:column;gap:4px;}
  .handover-details{margin:14px 0;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 14px;}
  .handover-details summary{cursor:pointer;font-weight:700;font-size:13px;color:var(--ink-900);}
  .handover-details pre{white-space:pre-wrap;font-family:inherit;font-size:12.5px;color:var(--ink-600);margin:10px 0 0;}

  /* ===== Campaign sub-navigation, owner icons, alert badges ===== */
  .campaign-subnav{background:#fff;border-bottom:1px solid var(--line);padding:0 28px;display:flex;align-items:center;gap:22px;overflow-x:auto;}
  .cs-name{font-size:12.5px;font-weight:700;color:var(--ink-900);max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0;}
  .cs-tabs{display:flex;gap:2px;}
  .ctab{background:transparent;border:none;border-bottom:3px solid transparent;padding:13px 14px 10px;font-size:13px;font-weight:600;color:var(--ink-600);white-space:nowrap;}
  .ctab:hover{color:var(--teal-700);}
  .ctab.active{color:var(--teal-700);border-bottom-color:var(--teal-600);}
  .owner-avatar{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;font-size:10px;font-weight:700;letter-spacing:0;background:var(--savi-green);color:#fff;flex-shrink:0;vertical-align:middle;}
  .owner-avatar.sm{width:20px;height:20px;font-size:8.5px;}
  .owner-avatar.o-JS{background:#224B50;color:#fff;}
  .owner-avatar.o-GM{background:#00CCCC;color:#224B50;}
  .owner-avatar.o-VG{background:#4DFFA8;color:#224B50;}
  .alert-badge{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:10px;white-space:nowrap;}
  .alert-badge.red{background:var(--red-bg);color:var(--red);}
  .alert-badge.amber{background:var(--amber-bg);color:var(--amber);}
  .card-alerts{margin-top:8px;}
  .rag-dot{width:10px;height:10px;border-radius:50%;display:inline-block;background:var(--line);}
  .rag-dot.red{background:var(--red);} .rag-dot.amber{background:var(--amber);} .rag-dot.green{background:var(--green);}
  .bc-date{font-size:11.5px;color:var(--ink-600);margin-top:3px;}
  .bc-alerts{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;}
  .bc-footer{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:8px;border-top:1px solid var(--line);}
  .bc-key{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-600);font-weight:600;}
  .bc-key.missing{color:var(--ink-400);font-weight:400;}
  .bc-type-icon{width:14px;height:14px;color:var(--teal-600);flex-shrink:0;}
  .bc-tick{color:var(--green);font-weight:800;font-size:13px;}
  .bc-footer-spacer{flex:1;}

  /* ===== Report key page ===== */
  .key-page-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-400);font-weight:700;margin:26px 0 8px;}
  .key-header-tag{margin-left:auto;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--teal-700);font-weight:700;}
  .key-body{padding:26px 30px;display:grid;grid-template-columns:1.7fr 1fr;gap:28px;align-items:start;}
  .key-body.single{grid-template-columns:1fr;}
  .key-title{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--teal-700);font-weight:700;margin-bottom:10px;}
  .key-table{width:100%;border-collapse:collapse;font-size:12.5px;}
  .key-table td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.4;}
  .key-table td:first-child{font-weight:700;width:34%;color:var(--ink-900);}
  .key-table tr:last-child td{border-bottom:none;}
  .key-read dl{margin:0;display:flex;flex-direction:column;gap:10px;}
  .key-read dt{font-weight:700;font-size:12.5px;color:var(--ink-900);}
  .key-read dd{margin:2px 0 0;font-size:12.5px;color:var(--ink-600);line-height:1.45;}
  .key-swatch{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:baseline;}
  .key-swatch.green{background:var(--green-bg);border:1px solid var(--green);}
  .key-swatch.amber{background:var(--amber-bg);border:1px solid var(--amber);}
  .key-swatch.red{background:var(--red-bg);border:1px solid var(--red);}
  .cm-desc{display:block;width:100%;margin-top:5px;padding:6px 9px;border:1px solid var(--line);border-radius:6px;font-size:11.5px;}
  @media (max-width:720px){ .key-body{grid-template-columns:1fr;} }

  /* ===== Quick edit + client list ===== */
  .qe-field{margin-bottom:14px;}
  .qe-field label{display:block;font-size:12px;font-weight:600;color:var(--ink-600);margin-bottom:5px;}
  .qe-field select,.qe-field input{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:7px;font-size:13px;background:#fff;font-family:inherit;}
  .qe-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .qe-hint{font-size:11.5px;color:var(--ink-400);margin-top:5px;line-height:1.4;}
  .qe-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}
  .client-hint{font-size:11.5px;color:var(--teal-700);margin-top:4px;}
  .client-hint:empty{display:none;}

  /* ===== Report: journey groups, sidebars and faint column gridlines ===== */
  .report-perf-table th + th, .report-perf-table td + td{border-left:1px solid #E6E9E4;}
  .report-perf-table thead th.grp-side-th{width:26px;min-width:26px;padding:0;}
  .report-perf-table td.grp-side{position:relative;width:26px;min-width:26px;padding:0;overflow:hidden;}
  .report-perf-table tr.grp-start > td{border-top:2px solid #fff;}
  .grp-label{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-90deg);white-space:nowrap;font-size:8.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;}
  .key-p{margin:0;font-size:12.5px;color:var(--ink-600);line-height:1.45;}

  /* ===== Report: Overview + Weekly Performance ===== */
  .rp-shell{--rp-deep:#224B50;--rp-mint:#4DFFA8;--rp-aqua:#F6F6EE;--rp-aqua2:#F6F6EE;--rp-line:#D5DEDB;--rp-ink:#224B50;
    background:#fff;border:1px solid var(--rp-line);border-radius:16px;overflow:hidden;margin-bottom:22px;box-shadow:0 1px 3px rgba(11,74,71,.06);color:var(--rp-ink);}
  .rp-header{position:relative;background:var(--rp-deep);color:#fff;display:flex;align-items:center;gap:16px;padding:14px 24px;overflow:hidden;min-height:62px;}
  .rp-logo{height:30px;flex-shrink:0;position:relative;z-index:1;}
  .rp-header-div{width:1px;align-self:stretch;background:rgba(255,255,255,.35);margin:4px 0;position:relative;z-index:1;}
  .rp-header-title{font-size:19px;font-weight:700;position:relative;z-index:1;}
  .rp-header-sub{font-size:11.5px;opacity:.85;position:relative;z-index:1;margin-top:2px;}
  .rp-body{padding:18px 22px 22px;}
  .rp-icon{flex-shrink:0;}
  .rp-lab{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:#5C6B6E;font-weight:700;}
  .rp-info{border:1px solid var(--rp-line);border-radius:16px;padding:16px 20px;display:flex;gap:20px;align-items:center;justify-content:space-between;background:#fff;}
  .rp-info-main{flex:1;min-width:0;}
  .rp-info-top{display:flex;gap:22px;align-items:flex-end;flex-wrap:wrap;}
  .rp-info-divider{width:1px;align-self:stretch;background:var(--rp-line);}
  .rp-client{font-size:16px;font-weight:600;margin-top:3px;}
  .rp-cname{font-size:24px;font-weight:800;color:var(--rp-deep);margin-top:1px;line-height:1.15;}
  .rp-facts{display:flex;gap:22px;flex-wrap:wrap;margin-top:12px;font-size:13.5px;}
  .rp-fact{display:inline-flex;align-items:center;gap:8px;color:var(--rp-ink);}
  .rp-fact .rp-icon{color:#224B50;}
  .rp-objective{margin-top:10px;font-size:12.5px;color:#5C6B6E;line-height:1.4;}
  .rp-info-img{flex-shrink:0;max-width:320px;}
  .rp-info-img img{border-radius:10px;}
  .rp-tabs{display:inline-flex;border-radius:12px;overflow:hidden;background:var(--rp-aqua);margin:14px 0;}
  .rp-tab{display:inline-flex;align-items:center;gap:8px;padding:11px 24px;font-size:14px;font-weight:700;color:var(--rp-deep);background:transparent;border:none;}
  .rp-tab.active{background:var(--rp-deep);color:#fff;}
  .rp-tab:not(.active):hover{background:#C9FFE5;}
  .rp-caption{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:#5C6B6E;font-weight:700;margin:2px 0 8px;}
  .rp-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  .rp-kpi{background:#F6F6EE;border:1px solid var(--rp-line);border-radius:16px;padding:14px 16px;}
  .rp-kpi-top{display:flex;align-items:center;gap:8px;}
  .rp-kpi-ico{color:#224B50;display:inline-flex;}
  .rp-kpi-name{font-size:13px;font-weight:700;flex:1;min-width:0;}
  .rp-kpi-val{font-size:32px;font-weight:800;color:var(--rp-deep);margin-top:8px;line-height:1.1;}
  .rp-kpi-sub{font-size:12px;color:#5C6B6E;margin-top:3px;}
  .rp-bar{height:8px;border-radius:6px;background:#E6E9E4;overflow:hidden;margin-top:10px;}
  .rp-bar-fill{height:100%;border-radius:6px;background:#2FBF84;}
  .rp-bar-fill.amber{background:#EFB04A;} .rp-bar-fill.red{background:#E5736B;} .rp-bar-fill.neutral{background:#224B50;}
  .rp-pill{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:10px;white-space:nowrap;}
  .rp-pill.red{background:#FDE3E0;color:#C0392B;} .rp-pill.amber{background:#FDF0D5;color:#A86A00;}
  .rp-pill.green{background:#C9FFE5;color:#127A52;} .rp-pill.neutral{background:#F6F6EE;color:#5C6B6E;}
  .rp-two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px;align-items:start;}
  .rp-two.single{grid-template-columns:1fr;}
  .rp-panel{border:1px solid var(--rp-line);border-radius:16px;padding:16px 18px;background:#fff;}
  .rp-panel-title{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800;color:var(--rp-deep);}
  .rp-panel-title .rp-icon{color:#224B50;}
  .rp-panel-sub{font-size:11.5px;color:#5C6B6E;margin:3px 0 10px;}
  .rp-fn-row{display:grid;grid-template-columns:20px 138px 1fr 76px;gap:10px;align-items:center;padding:3px 0;}
  .rp-fn-ico{color:#224B50;display:inline-flex;}
  .rp-fn-name{font-size:12.5px;font-weight:600;}
  .rp-fn-track{height:16px;background:#E6E9E4;border-radius:8px;overflow:hidden;}
  .rp-fn-fill{height:100%;border-radius:8px;background:#00CCCC;}
  .rp-fn-fill.cat-engagement, .rp-fn-sw.cat-engagement{background:#00CCCC;}
  .rp-fn-fill.cat-activation, .rp-fn-sw.cat-activation{background:#4DFFA8;}
  .rp-fn-fill.cat-redemption, .rp-fn-sw.cat-redemption{background:#224B50;}
  .rp-fn-fill.cat-other, .rp-fn-sw.cat-other{background:#5C6B6E;}
  .rp-fn-legend{display:flex;gap:16px;font-size:11px;color:#5C6B6E;margin-top:10px;}
  .rp-fn-sw{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px;}
  .rp-empty-big{padding:34px 20px;text-align:center;font-size:14px;color:#5C6B6E;border:1px dashed var(--rp-line);border-radius:12px;margin-top:18px;background:var(--rp-aqua2);}

  .rp-tip{display:none;position:fixed;z-index:200;max-width:300px;background:#224B50;color:#fff;font-size:12.5px;line-height:1.45;padding:10px 13px;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.28);pointer-events:none;}
  .rp-fn-val{font-size:13px;font-weight:800;text-align:right;color:var(--rp-deep);}
  .rp-fn-step{margin-left:168px;font-size:10.5px;font-weight:700;color:#5C6B6E;padding:0 0 1px;}
  .rp-fn-total{margin-top:10px;padding-top:9px;border-top:1px solid var(--rp-line);font-size:12.5px;display:flex;align-items:center;gap:7px;color:#5C6B6E;}
  .rp-fc-row{display:grid;grid-template-columns:112px 1fr auto;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--rp-line);}
  .rp-fc-row:first-of-type{border-top:none;}
  .rp-fc-name{font-size:13px;font-weight:700;}
  .rp-fc-text{font-size:12px;color:#5C6B6E;}
  .rp-fc-text strong{color:var(--rp-ink);}
  .rp-legend{display:flex;gap:16px;font-size:11px;color:#5C6B6E;margin-top:8px;padding-top:8px;border-top:1px solid var(--rp-line);}
  .rp-legend .key-swatch{margin-right:5px;}
  .rp-empty{font-size:12.5px;color:#5C6B6E;padding:8px 0;}
  .rp-insights{display:flex;gap:14px;align-items:flex-start;background:#C9FFE5;border:1px solid var(--rp-line);border-radius:16px;padding:16px 20px;margin-top:16px;}
  .rp-ins-ico{width:42px;height:42px;border-radius:12px;background:var(--rp-deep);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .rp-ins-title{font-size:15px;font-weight:800;color:var(--rp-deep);}
  .rp-ins-text{font-size:13px;color:#224B50;margin-top:3px;line-height:1.5;white-space:pre-wrap;}
  .rp-strip{background:var(--rp-aqua2);border:1px solid var(--rp-line);border-radius:14px;padding:12px 18px;display:flex;gap:18px;align-items:center;justify-content:space-between;}
  .rp-strip-facts{display:flex;gap:0;flex:1;flex-wrap:wrap;}
  .rp-strip-item{display:flex;align-items:center;gap:10px;padding:0 20px;border-left:1px solid var(--rp-line);}
  .rp-strip-item:first-child{padding-left:0;border-left:none;}
  .rp-strip-item .rp-icon{color:#224B50;}
  .rp-strip-val{font-size:13.5px;font-weight:700;margin-top:2px;}
  .rp-strip-sub{font-size:11px;font-weight:400;color:#5C6B6E;}
  .rp-strip-img{flex-shrink:0;} .rp-strip-img img{border-radius:8px;}
  .rp-wk-head{display:flex;justify-content:space-between;align-items:center;margin:18px 0 0;gap:12px;flex-wrap:wrap;background:var(--rp-deep);color:#fff;padding:11px 18px;border-radius:12px 12px 0 0;}
  .rp-wk-title{display:flex;align-items:center;gap:9px;font-size:17px;font-weight:800;color:#fff;}
  .rp-wk-title .rp-icon{color:#4DFFA8;}
  .rp-wk-head .rp-period-lab{color:#DBFFEE;}
  .rp-period{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .rp-period-lab{font-size:12px;color:#5C6B6E;}
  .rp-select{padding:8px 12px;border:1px solid var(--rp-line);border-radius:8px;font-size:13px;background:#fff;color:var(--rp-ink);}
  .rp-scroll{overflow-x:auto;border:1px solid var(--rp-line);border-top:none;border-radius:0 0 12px 12px;}
  .rp-note{font-size:11.5px;color:#5C6B6E;margin-top:10px;}
  .rp-table{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px;}
  .rp-table thead th{background:#F6F6EE;color:#224B50;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:10px 12px;text-align:center;white-space:nowrap;border-bottom:2px solid var(--rp-line);border-left:1px solid #E6E9E4;}
  .rp-table thead th.rp-metric-th{text-align:left;min-width:210px;}
  .rp-table thead th.rp-side-th{width:150px;min-width:150px;padding:0;border-left:none;}
  .rp-table thead th.rp-total-th{background:#C9FFE5;color:#224B50;}
  .rp-wk-date{font-size:10px;font-weight:400;opacity:.85;margin-top:2px;letter-spacing:.02em;text-transform:none;}
  .rp-wk{min-width:98px;}
  .rp-table td{padding:9px 12px;text-align:center;border-bottom:1px solid var(--rp-line);vertical-align:middle;white-space:nowrap;}
  .rp-table td + td{border-left:1px solid #E6E9E4;}
  .rp-table td.rp-metric-cell{text-align:left;font-weight:600;}
  .rp-mname{display:inline-flex;align-items:center;gap:8px;}
  .rp-mname .rp-icon{color:#224B50;}
  .rp-table td.total-col{background:#C9FFE5;font-weight:800;}
  .rp-table td.grp-side{position:relative;width:150px;min-width:150px;padding:0 4px;background:#C9FFE5;border:4px solid #fff;border-radius:16px;text-align:left;vertical-align:middle;color:var(--rp-deep);font-weight:700;}
  .rp-table td.grp-side + td{border-left:none;}
  .rp-grp-label{display:inline-flex;align-items:center;gap:10px;padding:0 8px;font-size:13.5px;}
  .rp-grp-label .rp-icon{color:#224B50;}
  .rp-of{font-size:11px;font-weight:400;color:#5C6B6E;margin-left:4px;}
  .rp-stick thead th.rp-side-th, .rp-stick td.grp-side{position:sticky;left:0;z-index:3;}
  .rp-stick thead th.rp-metric-th, .rp-stick td.rp-metric-cell{position:sticky;left:150px;z-index:3;}
  .rp-stick thead th.rp-total-th, .rp-stick td.total-col{position:sticky;right:0;z-index:3;}
  .rp-root[data-tab="overview"] #report-weekly-shell{display:none;}
  .rp-root[data-tab="weekly"] #report-overview-shell{display:none;}
  .rp-export-pages{display:none;}
  .rp-root.rp-export #report-overview-shell, .rp-root.rp-export .rp-export-pages{display:block !important;}
  .rp-root.rp-export #report-weekly-shell{display:none !important;}
  .rp-root.rp-export .rp-tabs{display:none !important;}
  .rp-root.rp-export .rp-scroll{overflow:visible;}
  @media (max-width:900px){
    .rp-kpis{grid-template-columns:repeat(2,1fr);} .rp-two{grid-template-columns:1fr;}
    .rp-info{flex-direction:column;align-items:flex-start;} .rp-strip{flex-direction:column;align-items:flex-start;}
    .rp-strip-item{padding:6px 0;border-left:none;}
  }

  /* ===== Report: full width + full screen ===== */
  .wrap.rp-wide{max-width:none;padding-left:24px;padding-right:24px;}
  .rp-exit-fs{display:none;}
  .rp-presenting .sidebar, .rp-presenting .main-topbar, .rp-presenting .campaign-subnav, .rp-presenting .wrap.rp-wide > .top-meta, .rp-presenting .wrap.rp-wide > .toolbar, .rp-presenting .key-page-label{display:none !important;}
  .rp-presenting .wrap.rp-wide{padding-top:16px;}
  .rp-presenting .rp-exit-fs{display:block;position:fixed;top:10px;right:14px;z-index:60;background:rgba(11,74,71,.92);color:#fff;border:none;border-radius:20px;padding:8px 16px;font-size:12.5px;font-weight:700;cursor:pointer;}

  /* ===== PDF capture: every page is drawn at one fixed width, so the PDF looks the same on any screen ===== */
  .rp-root.rp-export .rp-shell{width:960px !important;max-width:960px !important;margin-left:0;margin-right:0;}
  .rp-root.rp-export .rp-wkpage{width:1000px !important;max-width:1000px !important;}
  .rp-root.rp-export .rp-wk{min-width:84px;}
  /* larger type for the PDF, so it reads comfortably when the page is shown on screen */
  .rp-root.rp-export .rp-lab, .rp-root.rp-export .rp-caption{font-size:11.5px;}
  .rp-root.rp-export .rp-facts, .rp-root.rp-export .rp-client{font-size:14.5px;}
  .rp-root.rp-export .rp-objective{font-size:13.5px;}
  .rp-root.rp-export .rp-kpi-name, .rp-root.rp-export .rp-fc-name{font-size:14px;}
  .rp-root.rp-export .rp-kpi-sub{font-size:13px;}
  .rp-root.rp-export .rp-kpi-val{font-size:35px;}
  .rp-root.rp-export .rp-pill{font-size:12.5px;}
  .rp-root.rp-export .rp-panel-sub, .rp-root.rp-export .rp-fc-text{font-size:12.5px;}
  .rp-root.rp-export .rp-fn-row{grid-template-columns:20px 164px 1fr 84px;}
  .rp-root.rp-export .rp-fn-name{font-size:13.5px;}
  .rp-root.rp-export .rp-fn-val{font-size:14px;}
  .rp-root.rp-export .rp-fn-step{font-size:11.5px;margin-left:194px;}
  .rp-root.rp-export .rp-legend, .rp-root.rp-export .rp-fn-legend, .rp-root.rp-export .rp-fn-total{font-size:12.5px;}
  .rp-root.rp-export .rp-ins-text{font-size:14px;}
  .rp-root.rp-export .rp-table{font-size:14px;}
  .rp-root.rp-export .rp-table thead th{font-size:12.5px;}
  .rp-root.rp-export .rp-wk-date{font-size:11px;}
  .rp-root.rp-export .rp-strip-val{font-size:14.5px;}
  .rp-root.rp-export .key-table, .rp-root.rp-export .key-table td{font-size:13.5px;}
  .rp-root.rp-export .key-read dt, .rp-root.rp-export .key-read dd, .rp-root.rp-export .key-p{font-size:13.5px;}
  .rp-root.rp-export .rp-pdfnav-item{font-size:13.5px;}
  .rp-root.rp-export .rp-pdfnav-tip{font-size:12px;}

  /* ===== PDF-only jump strip and ? buttons (hidden on screen) ===== */
  .rp-pdfnav{display:none;}
  .rp-pdfnav{align-items:center;gap:8px;margin:0 0 14px;flex-wrap:wrap;}
  .rp-pdfnav-key{margin:16px 30px 0;}
  .rp-pdfnav-lab{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:#5C6B6E;font-weight:700;margin-right:2px;}
  .rp-pdfnav-item{padding:7px 16px;border-radius:10px;background:var(--rp-aqua);color:var(--rp-deep);font-size:12.5px;font-weight:700;}
  .rp-pdfnav-item.active{background:var(--rp-deep);color:#fff;}
  .rp-pdfnav-tip{font-size:11px;color:#5C6B6E;margin-left:8px;}
  .rp-pdfnav-tip b{display:inline-block;width:13px;height:13px;line-height:13px;text-align:center;border-radius:50%;background:#224B50;color:#fff;font-size:9px;}
  .rp-help{width:15px;height:15px;border-radius:50%;background:#224B50;color:#fff;font-size:10px;font-weight:800;align-items:center;justify-content:center;margin-left:6px;flex-shrink:0;vertical-align:middle;display:inline-flex;cursor:help;}
  .rp-exporting .rp-pdfnav{display:flex;}
  .rp-exporting .rp-help{display:inline-flex;}
  .rp-exporting .rp-help:not([data-pdf-link]){display:none;}

  /* ===== Reminders ===== */
  .sidebar-count{background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;margin-left:auto;}
  .reminder-list{display:flex;flex-direction:column;gap:8px;margin-bottom:22px;}
  .reminder-item{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer;}
  .reminder-item:hover{border-color:var(--teal-600);}
  .reminder-dot{width:9px;height:9px;border-radius:50%;margin-top:4px;flex-shrink:0;}
  .reminder-dot.red{background:var(--red);}
  .reminder-dot.amber{background:var(--amber);}
  .reminder-name{font-size:13px;font-weight:700;color:var(--ink-900);}
  .reminder-msg{font-size:12px;color:var(--ink-600);margin-top:2px;}
  .cc-top-actions{display:flex;gap:6px;align-items:center;}
  .campaign-card.is-archived{opacity:.7;}
  .card-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(300px, 1fr));gap:18px;align-items:start;}
  .campaign-card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);border-top:3px solid var(--line);
    padding:18px;box-shadow:var(--shadow);cursor:pointer;transition:transform .1s, box-shadow .1s;
    display:flex;flex-direction:column;gap:2px;
  }
  .campaign-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(10,61,59,.12);}
  .campaign-card.current{border-top-color:var(--teal-600);}
  .cc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .cc-client{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--teal-700);font-weight:700;}
  .cc-name-row{display:flex;gap:12px;align-items:flex-start;}
  .cc-name{font-size:16px;font-weight:700;color:var(--ink-900);}
  .cc-sub{font-size:12.5px;color:var(--ink-600);margin-top:2px;}
  .card-img-wrap{width:76px;height:76px;flex-shrink:0;border-radius:8px;overflow:hidden;background:var(--teal-100);display:flex;align-items:center;justify-content:center;}
  .card-img{width:100%;height:100%;object-fit:contain;display:block;}
  .card-img.placeholder{display:flex;align-items:center;justify-content:center;color:var(--teal-600);font-size:28px;font-weight:700;}
  .dyn-ref{font-size:11.5px;color:var(--ink-400);letter-spacing:.02em;margin-top:3px;}
  .solution-badge{display:inline-block;font-size:11px;font-weight:700;color:#fff;background:var(--teal-600);padding:3px 10px;border-radius:5px;margin-top:6px;letter-spacing:.02em;}
  .chip-row{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{background:var(--teal-100);color:var(--teal-700);font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;}
  .chip.region{background:var(--ink-900);color:#fff;}
  .opt-chip.overdue{background:#fbe3cf;color:#a1560f;}
  .opt-chip.upcoming{background:var(--teal-100);color:var(--teal-700);}
  .opt-chip.done{background:var(--green-bg);color:var(--green);}
  .progress-track{height:6px;border-radius:4px;background:var(--line);position:relative;overflow:visible;}
  .progress-fill{height:100%;border-radius:4px;background:var(--teal-600);}
  .progress-marker{position:absolute;top:-3px;width:2px;height:12px;background:var(--ink-900);}
  .progress-label{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-400);margin-top:4px;}
  .overall-rag-pill{display:inline-block;font-size:12.5px;font-weight:700;padding:6px 12px;border-radius:8px;margin-top:4px;}
  .overall-rag-pill.green{background:var(--green-bg);color:var(--green);}
  .overall-rag-pill.amber{background:var(--amber-bg);color:var(--amber);}
  .overall-rag-pill.red{background:var(--red-bg);color:var(--red);}
  .overall-rag-pill.neutral{background:var(--kpi-bg);color:var(--ink-400);}
  .cc-divider{height:1px;background:var(--line);margin:12px 0 10px;}
  .cc-lastsaved{font-size:12px;color:var(--ink-600);margin-bottom:10px;}
  .cc-progress-label{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-900);margin-bottom:6px;}
  .new-campaign-tile{
    border:2px dashed var(--teal-100);border-radius:var(--radius);min-height:220px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
    color:var(--ink-600);cursor:pointer;background:transparent;
  }
  .new-campaign-tile:hover{background:var(--teal-50);border-color:var(--teal-600);}
  .new-campaign-tile .nct-plus{font-size:26px;color:var(--teal-700);font-weight:700;}
  .new-campaign-tile .nct-label{font-size:14px;font-weight:700;color:var(--ink-900);}
  .empty-state{text-align:center;padding:70px 20px;color:var(--ink-400);}
  .empty-state .big{font-size:40px;margin-bottom:10px;}

  /* ===== Forms ===== */
  .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-600);margin-bottom:6px;}
  .field .req{color:var(--red);}
  .field input[type=text], .field input[type=number], .field input[type=date], .field select, .field textarea{
    width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:7px;font-size:13.5px;background:#fff;color:var(--ink-900);
  }
  .field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--savi-blue);outline-offset:1px;border-color:var(--savi-blue);}
  .field textarea{min-height:70px;resize:vertical;}
  .field .readonly-box{padding:9px 11px;background:var(--teal-50);border:1px solid var(--teal-100);border-radius:7px;font-size:13.5px;color:var(--teal-700);font-weight:600;}
  .date-range-field{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:7px;background:#fff;padding:0 8px;}
  .date-range-field input[type=date]{border:none;padding:9px 4px;flex:1;min-width:0;}
  .date-range-field input[type=date]:focus{outline:none;}
  .date-range-field:focus-within{outline:2px solid var(--savi-blue);outline-offset:1px;border-color:var(--savi-blue);}
  .date-range-sep{color:var(--ink-400);flex-shrink:0;font-size:13px;}
  .cm-tag{font-size:9.5px;color:var(--ink-400);text-transform:uppercase;margin-left:6px;letter-spacing:.04em;}
  .cm-delete{width:24px;height:24px;border:1px solid var(--red);background:#fff;color:var(--red);border-radius:5px;font-size:12px;}
  .cm-delete:hover{background:var(--red-bg);}
  .drag-handle-cell{width:24px;text-align:center;cursor:grab;color:var(--ink-400);font-size:14px;user-select:none;}
  .metric-drag-row.dragging{opacity:.35;}
  .metric-drag-row.drag-over{box-shadow:inset 0 2px 0 var(--teal-600);}
  .add-metric-row td{padding-top:12px;border-top:2px dashed var(--line);}
  .add-metric-row input[type=text]{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;font-size:13px;}
  .date-range-picker{position:relative;}
  .drp-trigger{width:100%;text-align:left;padding:9px 11px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:13.5px;color:var(--ink-900);display:flex;justify-content:space-between;align-items:center;}
  .drp-trigger:hover{border-color:var(--teal-600);}
  .drp-caret{color:var(--ink-400);font-size:11px;}
  .drp-panel{position:absolute;top:calc(100% + 6px);left:0;z-index:50;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(10,61,59,.18);padding:14px;width:280px;}
  .drp-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .drp-nav-btn{background:transparent;border:1px solid var(--line);border-radius:6px;width:26px;height:26px;font-size:14px;color:var(--ink-600);}
  .drp-nav-btn:hover{background:var(--teal-50);}
  .drp-month-label{font-size:13px;font-weight:700;color:var(--ink-900);}
  .drp-weekdays{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:10.5px;color:var(--ink-400);font-weight:700;margin-bottom:2px;}
  .drp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
  .drp-cell{aspect-ratio:1;border:none;background:transparent;font-size:12.5px;color:var(--ink-900);border-radius:6px;}
  .drp-cell:hover:not(.empty){background:var(--teal-100);}
  .drp-cell.empty{visibility:hidden;}
  .drp-cell.drp-in-range{background:var(--teal-100);border-radius:0;}
  .drp-cell.drp-start, .drp-cell.drp-end{background:var(--teal-600);color:#fff;font-weight:700;}
  .drp-cell.drp-start:not(.drp-solo){border-radius:6px 0 0 6px;}
  .drp-cell.drp-end{border-radius:0 6px 6px 0;}
  .drp-hint{font-size:11px;color:var(--ink-400);margin-top:8px;text-align:center;}
  .drp-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:10px;}
  .checkbox-row{display:flex;flex-wrap:wrap;gap:10px;}
  .check-pill{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px;background:#fff;}
  .check-pill input{width:15px;height:15px;}
  .file-drop{border:1.5px dashed var(--line);border-radius:8px;padding:14px;text-align:center;font-size:12.5px;color:var(--ink-400);background:#fff;transition:background .12s, border-color .12s;}
  .file-drop.drag-active{background:var(--teal-50);border-color:var(--teal-600);color:var(--teal-700);}
  .form-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);}
  .form-actions{display:flex;justify-content:space-between;margin-top:26px;padding-top:18px;border-top:1px solid var(--line);}
  .form-actions .right{display:flex;gap:10px;}

  table.data-table{width:100%;border-collapse:collapse;font-size:13.5px;}
  table.data-table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-400);padding:8px 10px;border-bottom:2px solid var(--line);font-weight:700;}
  table.data-table td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle;}
  table.data-table tr:last-child td{border-bottom:none;}
  table.data-table input[type=number]{width:110px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;}
  table.data-table .auto-field{background:var(--teal-50);border:1px solid var(--teal-100);border-radius:6px;padding:6px 8px;color:var(--teal-700);font-weight:600;display:inline-block;min-width:80px;}
  table.data-table .muted{color:var(--ink-400);}
  .metric-name{font-weight:600;}
  .metric-id{color:var(--ink-400);letter-spacing:.02em;font-size:11px;margin-left:6px;}

  .banner{border-radius:8px;padding:12px 16px;font-size:13.5px;margin-bottom:18px;display:flex;gap:10px;align-items:flex-start;}
  .banner.teal{background:var(--teal-50);border:1px solid var(--teal-100);color:var(--teal-700);}
  .banner.amber{background:var(--amber-bg);border:1px solid #f0d9a6;color:var(--amber);}
  .banner.red{background:var(--red-bg);border:1px solid #f3c6c1;color:var(--red);}

  .top-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px;}
  .top-meta .titleblock .client{font-size:12px;text-transform:uppercase;color:var(--ink-400);font-weight:700;letter-spacing:.05em;}
  .week-controls{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:20px;box-shadow:var(--shadow);}
  .week-controls .field{margin-bottom:0;min-width:170px;}
  .week-num-badge{background:var(--ink-900);color:#fff;font-weight:700;font-size:13px;padding:9px 14px;border-radius:7px;}

  .rag-card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-top:14px;}
  .rag-card{border-radius:8px;padding:12px 14px;border:1px solid var(--line);}
  .rag-card.red{background:var(--red-bg);border-color:#f3c6c1;}
  .rag-card.amber{background:var(--amber-bg);border-color:#f0d9a6;}
  .rag-card.green{background:var(--green-bg);border-color:#c3ecd2;}
  .rag-card.neutral{background:var(--paper);}
  .rag-card .m-name{font-size:12px;font-weight:700;margin-bottom:4px;}
  .rag-card .m-val{font-size:18px;font-weight:800;}
  .rag-card .m-sub{font-size:11px;color:var(--ink-600);}
  .rag-badge{display:inline-block;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:20px;margin-left:6px;}
  .rag-badge.red{background:var(--red);color:#fff;}
  .rag-badge.amber{background:var(--amber);color:#fff;}
  .rag-badge.green{background:var(--green);color:#fff;}
  .rag-pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:6px 14px;border-radius:20px;}
  .rag-pill.red{background:var(--red);color:#fff;}
  .rag-pill.amber{background:var(--amber);color:#fff;}
  .rag-pill.green{background:var(--green);color:#fff;}

  .analysis-item{border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:12px;background:#fff;}
  .analysis-item h3{margin:0 0 6px;font-size:14px;}
  .analysis-item p{margin:0;font-size:13px;color:var(--ink-600);line-height:1.5;}

  .report-shell{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);}
  .report-header{
    background:var(--savi-grey);border-bottom:4px solid var(--savi-light-green);
    padding:14px 26px;display:flex;align-items:center;
  }
  .report-header .rh-left{display:flex;align-items:center;gap:16px;min-width:0;}
  .report-header .savi-mark{height:22px;flex-shrink:0;}
  .report-header h1{color:var(--savi-green);font-size:19px;margin:0;}
  .report-body{padding:26px 30px;}
  .report-info-row{display:flex;gap:16px;align-items:stretch;margin-bottom:20px;}
  .report-info-condensed{flex:1;min-width:0;background:var(--teal-50);border-radius:8px;padding:16px 20px;display:flex;flex-direction:column;gap:7px;}
  .ric-item{display:flex;align-items:baseline;gap:10px;font-size:13px;line-height:1.5;}
  .ric-k{flex-shrink:0;width:80px;font-weight:700;color:var(--ink-400);text-transform:uppercase;font-size:10.5px;letter-spacing:.04em;}
  .ric-v{color:var(--ink-900);font-weight:600;}
  .report-logo-side{width:100%;max-width:220px;flex-shrink:0;background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:8px;}
  .report-logo-img{display:block;border-radius:4px;}
  .report-logo-img-fallback{width:100%;height:auto;max-height:150px;object-fit:contain;}
  .report-chart-bottom{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px 16px;}
  .report-section-banner{background:var(--teal-900);color:#fff;font-weight:700;font-size:13.5px;padding:10px 16px;border-radius:8px 8px 0 0;}
  .report-perf-table{border:1px solid var(--line);border-top:none;border-radius:0 0 8px 8px;overflow:hidden;}
  .report-perf-table thead th{background:var(--teal-50);}
  .total-col{background:var(--teal-100);font-weight:700;}
  .forecast-val{font-weight:700;color:var(--ink-900);}
  .forecast-sub{font-size:10.5px;color:var(--ink-600);margin-top:2px;}
  .forecast-rag-cell{padding:8px 10px;}
  .forecast-na{background:var(--kpi-bg);}
  .forecast-rag-cell.green{background:var(--green-bg);}
  .forecast-rag-cell.green .forecast-sub{color:var(--green);}
  .forecast-rag-cell.amber{background:var(--amber-bg);}
  .forecast-rag-cell.amber .forecast-sub{color:var(--amber);}
  .forecast-rag-cell.red{background:var(--red-bg);}
  .forecast-rag-cell.red .forecast-sub{color:var(--red);}
  .week-chart{}
  .wc-legend{display:flex;gap:16px;margin-bottom:8px;flex-wrap:wrap;}
  .wc-legend-item{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-600);font-weight:600;}
  .wc-swatch{width:9px;height:9px;border-radius:2px;display:inline-block;}
  .week-chart-svg{width:100%;height:260px;display:block;}
  .hist-card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;}
  .hist-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 18px;box-shadow:var(--shadow);}
  .hist-card-top{display:flex;justify-content:space-between;align-items:baseline;}
  .hist-name{font-size:14px;font-weight:700;color:var(--ink-900);}
  .hist-pct{font-size:22px;font-weight:800;color:var(--ink-900);}
  .hist-sub{font-size:11.5px;color:var(--ink-400);margin-top:2px;margin-bottom:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .hist-delta{font-weight:700;font-size:11px;}
  .hist-delta.up{color:var(--green);}
  .hist-delta.down{color:var(--red);}
  .hist-bar{display:flex;align-items:flex-end;gap:3px;height:52px;border-radius:6px;overflow:hidden;background:var(--paper);}
  .hist-segment{flex:1;min-height:4px;border-radius:2px;}
  .hist-segment.green{background:var(--green);}
  .hist-segment.amber{background:var(--amber);}
  .hist-segment.red{background:var(--red);}
  .hist-segment.neutral{background:var(--kpi-bg);}
  .hist-segment.brand{background:var(--teal-600);}
  .hist-week-labels{display:flex;gap:3px;margin-top:6px;}
  .hist-week-label{flex:1;font-size:9.5px;color:var(--ink-400);text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  .toolbar{display:flex;gap:10px;justify-content:flex-end;margin-bottom:16px;}

  ::-webkit-scrollbar{height:8px;width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}

  .stack{display:flex;flex-direction:column;gap:4px;}
  .modal-overlay{position:fixed;inset:0;background:rgba(10,20,20,.45);display:flex;align-items:center;justify-content:center;z-index:100;}
  .modal{background:#fff;border-radius:10px;padding:22px;max-width:380px;width:90%;box-shadow:0 10px 40px rgba(0,0,0,.2);}
  .modal h3{margin-top:0;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink-900);color:#fff;padding:11px 20px;border-radius:8px;font-size:13.5px;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:200;}

  @media (max-width:720px){
    .field-grid{grid-template-columns:1fr;}
    .report-meta-grid{grid-template-columns:1fr 1fr;}
    .wrap, .wrap-narrow{padding:20px 16px 0;}
    .app-shell{flex-direction:column;}
    .sidebar{width:100%;height:auto;position:relative;flex-direction:row;flex-wrap:wrap;align-items:center;padding:14px 16px;gap:8px;}
    .sidebar-logo{margin-bottom:0;margin-right:auto;}
    .sidebar-section-label{display:none;}
    .sidebar-campaign-list{display:none;}
    .sidebar-new-btn{margin-top:0;width:auto;padding:8px 14px;}
    .sidebar-nav-item{width:auto;margin-bottom:0;}
    .report-info-row{flex-direction:column;}
    .report-chart-bottom{width:100%;}
  }

  /* ===== savi brand finishing ===== */
  body{font-weight:500;}
  h1, h2, .rp-header-title, .rp-cname, .rp-panel-title, .rp-wk-title, .rp-ins-title, .section-title{font-style:italic;font-weight:700;}
  .rp-fn-fill.cat-activation, .rp-fn-sw.cat-activation{box-shadow:inset 0 0 0 1px #224B50;}
  .rp-help:hover, .rp-help:focus{background:#4DFFA8;color:#224B50;outline:none;}
  .sidebar-version{font-size:10.5px;opacity:.55;margin:10px 4px 0;}
  .rp-pdfstyle{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-600);}
</style>

// ---------- Utilities ----------
function uuid(){ return 'c_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function fmtDate(d){ if(!d) return ''; const dt = new Date(d+'T00:00:00'); return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
// Formats a Date using its LOCAL year/month/day — never use .toISOString() for date-only
// values, since that converts to UTC and silently shifts the date by a day for anyone in a
// timezone ahead of UTC (e.g. UK British Summer Time), which was causing the date picker's
// month navigation to appear stuck.
function ymd(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function todayISO(){ return ymd(new Date()); }
function toMonday(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const day = d.getDay();
  const diff = day===0 ? -6 : 1-day;
  d.setDate(d.getDate()+diff);
  return ymd(d);
}
function addDays(dateStr, days){
  const d = new Date(dateStr+'T00:00:00');
  d.setDate(d.getDate()+days);
  return ymd(d);
}
function isMonday(dateStr){
  if(!dateStr) return false;
  return new Date(dateStr+'T00:00:00').getDay() === 1;
}
function calcTotalWeeks(start,end){
  if(!start||!end) return 0;
  const ms = new Date(end+'T00:00:00') - new Date(start+'T00:00:00');
  return Math.max(1, Math.round(ms/(7*86400000)));
}
function calcWeekNum(start, weekDate){
  // count Mondays from campaign start (inclusive) to weekDate
  const s = new Date(toMonday(start)+'T00:00:00');
  const w = new Date(weekDate+'T00:00:00');
  const diffWeeks = Math.round((w-s)/(7*86400000));
  return diffWeeks+1;
}
function fmtNum(n){
  if(n===null||n===undefined||isNaN(n)) return '—';
  return Number(n).toLocaleString('en-GB',{maximumFractionDigits:1});
}
// Formats a metric value with its unit: % for ratio metrics, £ for currency metrics (redval), plain otherwise.
function fmtMetricValue(m, n){
  if(n===null||n===undefined||n===''||isNaN(n)) return '—';
  if(m && m.isRatio) return fmtNum(n)+'%';
  if(m && m.isCurrency) return '£'+fmtNum(n);
  return fmtNum(n);
}
const CD_OWNERS = {
  JS: 'Jessica Sargeant',
  GM: 'Gemma Macmillan',
  VG: 'Vikki Godlington',
};
function escapeHtml(s){ return (s||'').toString().replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function showToast(msg){
  clearTimeout(toastTimer);
  let el = document.getElementById('toast');
  if(!el){ el = document.createElement('div'); el.id='toast'; el.className='toast'; document.body.appendChild(el); }
  el.textContent = msg;

}

// ---------- Calculation engine (mirrors getAutoValue / recalcAutoFields) ----------
function getRagMetricIds(pkg){
  const rm = PACKAGES[pkg].ragMetrics;
  return [rm.activated, rm.redeemed];
}

// Runs all auto calculations for a package given current manual `inputs` (metricId -> number)
// Returns a full map metricId -> number for every metric in the package.
function recalcAutoFields(pkg, inputs, offerType, offerValue, customMetrics){
  const num = (v)=> (v===''||v===null||v===undefined||isNaN(v)) ? 0 : Number(v);
  const vals = {};
  const pdef = PACKAGES[pkg];
  pdef.metrics.forEach(m=>{ if(m.entry==='manual') vals[m.id] = num(inputs[m.id]); });
  (customMetrics||[]).forEach(cm=>{ vals[cm.id] = num(inputs[cm.id]); }); // custom metrics are always manual

  if(pkg==='basic'){
    // redval
    vals.redval = calcRedVal(vals.red, offerType, offerValue, inputs.redval, num);
    vals.atr = ratio(vals.red, vals.act);
  } else if(pkg==='intermediate' || pkg==='bluelight'){
    vals.pending = Math.max(0, num(vals.issued) - num(vals.act));
    vals.redval = calcRedVal(vals.red, offerType, offerValue, inputs.redval, num);
    vals.itr = ratio(vals.red, vals.issued);
    vals.atr = ratio(vals.red, vals.act);
  } else if(pkg==='advanced'){
    vals.rew_pend = Math.max(0, num(vals.rew_iss) - num(vals.rew_act));
    vals.redval = calcRedVal(vals.rew_red, offerType, offerValue, inputs.redval, num);
    vals.itr = ratio(vals.rew_red, vals.rew_iss);
    vals.atr = ratio(vals.rew_red, vals.rew_act);
  }
  return vals;
}
function calcRedVal(redeemedCount, offerType, offerValue, manualEntry, num){
  const ov = num(offerValue);
  // Only a fixed £ offer auto-calculates reliably (same discount every redemption). A % -off
  // offer can convert to a different £ amount per retailer/week, so that's entered manually
  // each week rather than assumed constant across the whole campaign.
  if(offerType==='fixed' && ov) return num(redeemedCount) * ov;
  return num(manualEntry);
}
function ratio(numerator, denominator){
  const n = Number(numerator)||0, d = Number(denominator)||0;
  if(!d) return 0;
  return Math.round((n/d*100)*10)/10; // 1 decimal place
}
function isAutoMetric(pkg, metricId){
  const m = PACKAGES[pkg].metrics.find(x=>x.id===metricId);
  return m && m.entry==='auto';
}
function isAutoOrManual(pkg, metricId){
  const m = PACKAGES[pkg].metrics.find(x=>x.id===metricId);
  return m && m.entry==='auto-or-manual';
}

// Cumulative: sum of actuals for metricId across all saved weeks up to & including weekDate
function calcCumulativeFromHistory(campaign, metricId, uptoWeekDate, liveValue){
  let sum = 0;
  Object.keys(campaign.weeklyData||{}).forEach(wd=>{
    if(wd < uptoWeekDate){
      const entry = campaign.weeklyData[wd];
      const m = (entry.metrics||[]).find(x=>x.id===metricId);
      if(m) sum += Number(m.actual)||0;
    }
  });
  sum += Number(liveValue)||0; // include the week currently being edited
  return sum;
}

function ragStatus(actual, weeklyTarget){
  if(!weeklyTarget || weeklyTarget<=0) return null;
  const pct = (Number(actual)||0) / weeklyTarget * 100;
  if(pct <= 50) return 'red';
  if(pct <= 75) return 'amber';
  if(pct <= 115) return 'green';
  return 'amber';
}
function ragLabel(status){ return status==='red'?'Red':status==='amber'?'Amber':status==='green'?'Green':'—'; }

function weeksRecorded(campaign){
  return Object.keys(campaign.weeklyData||{}).length;
}
function midpointWeek(totalWeeks){ return Math.ceil(totalWeeks/2); }
function campaignStatus(c){
  const today = todayISO();
  if(today < c.startDate) return {key:'upcoming', label:'Upcoming'};
  if(today > c.endDate) return {key:'ended', label:'Ended'};
  return {key:'live', label:'Live'};
}
// Approximates whether the mid-campaign review has been logged, using the
// midpoint week's saved notes as the signal (there's no dedicated "reviewed" field yet).
function optimisationStatus(c){
  const totalWeeks = calcTotalWeeks(c.startDate, c.endDate);
  if(!totalWeeks) return {key:'none', label:''};
  const mid = midpointWeek(totalWeeks);
  const midDate = addDays(toMonday(c.startDate), (mid-1)*7);
  const midEntry = c.weeklyData ? c.weeklyData[midDate] : null;
  const savedWeekNums = Object.values(c.weeklyData||{}).map(w=>w.weekNum);
  const latestWeekNum = savedWeekNums.length ? Math.max(...savedWeekNums) : 0;
  if(midEntry && midEntry.notes && midEntry.notes.trim()) return {key:'done', label:'Mid-campaign review done'};
  if(latestWeekNum >= mid) return {key:'overdue', label:'Mid-campaign review overdue'};
  if(latestWeekNum === mid-1) return {key:'upcoming', label:'Mid-campaign review next week'};
  return {key:'none', label:''};
}
function campaignNeedsAttention(c){
  const ragIds = getRagMetricIds(c.package);
  if(ragIds.some(id=>{ const st=forecastRagForMetric(c,id); return st==='red'||st==='amber'; })) return true;
  return optimisationStatus(c).key === 'overdue';
}
// Single overall status for the whole campaign, based on the forecast-to-end of every
// tracked (non-ratio, targeted) metric — worst status wins.
function campaignOverallForecast(c){
  const trackedIds = effectiveMetrics(c).filter(m=>!m.isRatio && c.targets && c.targets[m.id]).map(m=>m.id);
  if(!trackedIds.length) return null;
  const statuses = trackedIds.map(id=>forecastRagForMetric(c,id)).filter(Boolean);
  if(!statuses.length) return null;
  if(statuses.includes('red')) return 'red';
  if(statuses.includes('amber')) return 'amber';
  return 'green';
}
// How many weeks have already fully passed (their Monday is before this week's Monday) with no
// saved data. Distinct from defaultWeekDateFor, which is about where to open the editor.
function overdueWeekCount(c){
  if(!c.startDate || !c.endDate) return 0;
  const firstMon = toMonday(c.startDate);
  const totalWeeks = calcTotalWeeks(c.startDate, c.endDate);
  const todayMon = toMonday(todayISO());
  let n = 0;
  for(let i=0;i<totalWeeks;i++){
    const wd = addDays(firstMon, i*7);
    if(wd >= todayMon) break;
    if(!c.weeklyData || !c.weeklyData[wd]) n++;
  }
  return n;
}
function hasOverdueWeek(c){ return overdueWeekCount(c) > 0; }

// Everything that needs attention on ONE campaign. The cards on the Dashboard and Board and the
// Reminders page all read from this, so they always agree. Archived campaigns and ones moved to
// Complete are treated as done and raise nothing.
function campaignAlerts(c){
  const out = [];
  if(c.archived || stageOf(c)==='complete') return out;
  if(campaignStatus(c).key==='live' && c.endDate){
    const daysLeft = Math.round((new Date(c.endDate+'T00:00:00') - new Date(todayISO()+'T00:00:00'))/86400000);
    if(daysLeft>=0 && daysLeft<=7){
      out.push({type:'ending', severity: daysLeft<=2?'red':'amber',
        short: daysLeft===0 ? 'Ends today' : `Ends in ${daysLeft} day${daysLeft===1?'':'s'}`,
        message:`Ends in ${daysLeft} day${daysLeft===1?'':'s'} (${fmtDate(c.endDate)})`});
    }
  }
  const missing = overdueWeekCount(c);
  if(missing>0) out.push({type:'missed-week', severity:'red', short:`${missing} week${missing===1?'':'s'} missing`, message:`A past week hasn't been entered yet`});
  if(optimisationStatus(c).key==='overdue') out.push({type:'optimisation', severity:'amber', short:'Mid review required', message:'Mid-campaign review is overdue — add notes for the midpoint week'});
  const forecast = campaignOverallForecast(c);
  if(forecast==='red' || forecast==='amber') out.push({type:'forecast', severity:forecast, short: forecast==='red' ? 'Off track' : 'Needs attention', message:`Forecasting ${forecast==='red'?'behind estimate':'needs attention'}`});
  return out;
}
function alertBadge(a){
  return `<span class="alert-badge ${a.severity}" title="${escapeHtml(a.message)}">⚠ ${escapeHtml(a.short)}</span>`;
}
// Computed "what needs attention" list — read fresh every time the tool is opened, not a push
// notification (this is a local file with no server, so it can't notify you while it's closed).
function getReminders(){
  const items = [];
  campaigns.forEach(c=>{
    campaignAlerts(c).forEach(a=>items.push({campaignId:c.id, campaignName:c.name||'Untitled campaign', type:a.type, severity:a.severity, message:a.message}));
  });
  items.sort((a,b)=> (a.severity==='red'?0:1) - (b.severity==='red'?0:1));
  return items;
}
function reminderCount(){ return getReminders().length; }

function fmtDateRangeShort(a, b){

}
