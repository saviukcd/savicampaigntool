function renderDashboard(){
  const nonArchived = campaigns.filter(c=>!c.archived);
  const statCounts = { live:0, upcoming:0, ended:0 };
  nonArchived.forEach(c=>{ statCounts[campaignStatus(c).key]++; });
  const archivedCount = campaigns.length - nonArchived.length;

  // Apply the status filter, then the search box, then sort.
  let filtered = campaigns.filter(c=>{
    if(dashboardStatusFilter==='archived') return !!c.archived;
    if(c.archived) return false;
    if(dashboardStatusFilter==='active') return true;
    return campaignStatus(c).key === dashboardStatusFilter;
  });
  if(dashboardSearch.trim()){
    const q = dashboardSearch.trim().toLowerCase();
    filtered = filtered.filter(c => (c.name||'').toLowerCase().includes(q) || (c.client||'').toLowerCase().includes(q));
  }
  if(dashboardCdOwnerFilter){
    filtered = filtered.filter(c => c.cdOwner === dashboardCdOwnerFilter);
  }
  const statusOrder = {live:0, upcoming:1, ended:2};
  const sortedCampaigns = filtered.sort((a,b)=>{
    const sa = statusOrder[campaignStatus(a).key], sb = statusOrder[campaignStatus(b).key];
    if(sa !== sb) return sa-sb;
    return (b.createdAt||0) - (a.createdAt||0);
  });

  const cards = sortedCampaigns.map(c=>{
    const pkg = PACKAGES[c.package];
    const total = calcTotalWeeks(c.startDate,c.endDate);
    const today = new Date();
    const start = new Date(c.startDate+'T00:00:00'), end = new Date(c.endDate+'T00:00:00');
    let pct = 0;
    if(!c.startDate || !c.endDate) pct = 0;
    else if(today<=start) pct=0; else if(today>=end) pct=100; else pct = Math.round((today-start)/(end-start)*100);
    const status = campaignStatus(c);
    const recorded = weeksRecorded(c);
    const opt = optimisationStatus(c);
    const isCurrent = c.id === currentCampaignId;
    let lastSavedLine = 'No weeks saved yet';
    if(recorded>0){
      const savedDates = Object.keys(c.weeklyData).sort();
      const latest = c.weeklyData[savedDates[savedDates.length-1]];
      lastSavedLine = `Last saved: Week ${latest.weekNum} · ${fmtDate(latest.weekDate)}`;
    }
    return `<div class="campaign-card ${isCurrent?'current':''} ${c.archived?'is-archived':''}" data-open="${c.id}">
      <div class="cc-top">
        <span class="cc-client">${escapeHtml(c.client)||'No client'}</span>
        <span class="cc-top-actions">
          <button class="btn ghost small" data-quick-edit="${c.id}" title="Quick edit — owner, status, dates"><svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
          <button class="btn ghost small" data-quick-clone="${c.id}" title="Clone"><svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>Clone</button>
        </span>
      </div>
      <div class="cc-name-row">
        <div class="card-img-wrap">${c.logo ? `<img class="card-img" src="${c.logo}">` : `<div class="card-img placeholder">${escapeHtml((c.client||'?')[0].toUpperCase())}</div>`}</div>
        <div>
          <div class="cc-name">${escapeHtml(c.name)||'Untitled campaign'}</div>
          <div class="dyn-ref">${escapeHtml(c.dynamics||'No Dynamics ref')}</div>
          <div class="solution-badge">${pkg.label}</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0;">
        <span class="status-pill ${status.key}">${status.label}</span>
        ${c.archived ? `<span class="status-pill neutral">Archived</span>` : ''}
        ${c.cdOwner ? ownerAvatar(c.cdOwner) : ''}
      </div>
      <div class="chip-row">
        <span class="chip">${total ? total+' weeks' : '? weeks'}</span>
        <span class="chip">${(c.retailers||[]).length ? c.retailers.map(r=>RETAILERS.find(x=>x.id===r)?.label||r).join(', ') : 'No retailer'}</span>
        <span class="chip region">${regionLabel(c.region)}</span>
      </div>
      <div class="chip-row" style="margin-top:6px;">
        <span class="chip">${recorded} week${recorded===1?'':'s'} saved</span>
        ${opt.key==='upcoming' ? `<span class="chip opt-chip upcoming">${opt.label}</span>` : ''}
        ${opt.key==='done' ? `<span class="chip opt-chip done">✓ ${opt.label}</span>` : ''}
      </div>
      ${(()=>{ const al = campaignAlerts(c).filter(a=>a.type!=='forecast'); return al.length ? `<div class="chip-row card-alerts">${al.map(alertBadge).join('')}</div>` : ''; })()}
      ${(() => { const ov = campaignOverallForecast(c); const ovLabel = ov==='red'?'Behind Estimate':ov==='amber'?'Needs Attention':ov==='green'?'On Track':'No forecast yet';
        return `<div class="overall-rag-pill ${ov||'neutral'}">${ovLabel} <span class="subtle" style="font-weight:400;">· forecast to end</span></div>`; })()}
      <div class="cc-divider"></div>
      <div class="cc-lastsaved">${lastSavedLine}</div>
      <div class="cc-progress">
        <div class="cc-progress-label"><span>Campaign progress</span><span>${pct}%</span></div>
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      </div>
    </div>`;
  }).join('');
  const newTile = `<div class="new-campaign-tile" data-action="new-campaign">
    <div class="nct-plus">+</div>
    <div class="nct-label">Add Campaign Manually</div>
  </div>`;
  const noResults = sortedCampaigns.length===0 ? `<div class="banner teal" style="grid-column:1/-1;">No campaigns match this view.</div>` : '';

  return `<div class="wrap">
    <div class="dash-stats-row">
      <div class="dash-stat live"><div class="ds-num">${statCounts.live}</div><div class="ds-label">Live</div></div>
      <div class="dash-stat upcoming"><div class="ds-num">${statCounts.upcoming}</div><div class="ds-label">Upcoming</div></div>
      <div class="dash-stat ended"><div class="ds-num">${statCounts.ended}</div><div class="ds-label">Ended</div></div>
      <div class="dash-stat total"><div class="ds-num">${nonArchived.length}</div><div class="ds-label">Total active</div></div>
    </div>

    <div class="dash-toolbar">
      <input type="text" id="dash-search" class="dash-search" placeholder="Search by campaign or client…" value="${escapeHtml(dashboardSearch)}">
      <div class="dash-filter-tabs">
        <button class="dash-filter-tab ${dashboardStatusFilter==='active'?'active':''}" data-dash-filter="active">All active</button>
        <button class="dash-filter-tab ${dashboardStatusFilter==='live'?'active':''}" data-dash-filter="live">Live</button>
        <button class="dash-filter-tab ${dashboardStatusFilter==='upcoming'?'active':''}" data-dash-filter="upcoming">Upcoming</button>
        <button class="dash-filter-tab ${dashboardStatusFilter==='ended'?'active':''}" data-dash-filter="ended">Ended</button>
        <button class="dash-filter-tab ${dashboardStatusFilter==='archived'?'active':''}" data-dash-filter="archived">Archived (${archivedCount})</button>
      </div>
      <select id="dash-cdowner-filter" class="dash-cdowner-select">
        <option value="" ${!dashboardCdOwnerFilter?'selected':''}>All CD Owners</option>
        ${Object.keys(CD_OWNERS).map(k=>`<option value="${k}" ${dashboardCdOwnerFilter===k?'selected':''}>${CD_OWNERS[k]}</option>`).join('')}
      </select>
    </div>

    <div class="card-grid">${cards}${dashboardStatusFilter==='active'&&!dashboardSearch.trim()&&!dashboardCdOwnerFilter ? newTile : ''}${noResults}</div>
  </div>`;
}
// A quick, read-only summary for a campaign — no data entry, just the metrics table plus
// links onward. This is what a Board card opens to now, rather than jumping straight into
// Weekly Entry's editable fields.
function renderCampaignOverview(){
  const c = campaigns.find(x=>x.id===currentCampaignId);
  if(!c){ currentView='dashboard'; return renderDashboard(); }
  const pkg = PACKAGES[c.package];
  const status = campaignStatus(c);
  const totalWeeks = calcTotalWeeks(c.startDate, c.endDate);
  const hasAnySaved = weeksRecorded(c) > 0;
  const stageLabel = (WORKFLOW_STAGES.find(s=>s.id===stageOf(c))||{}).label;
  return `<div class="wrap">
    <div class="top-meta">
      <div class="titleblock">
        <div class="client">${escapeHtml(c.client)||'No client'} · ${pkg.label}${c.cdOwner?' · '+ownerAvatar(c.cdOwner,true)+' '+escapeHtml(CD_OWNERS[c.cdOwner]||c.cdOwner):''}</div>
        <h1>${escapeHtml(c.name)||'Untitled campaign'} <span class="status-pill ${status.key}" style="vertical-align:middle;margin-left:8px;">${status.label}</span></h1>
        <div class="subtle">${fmtDate(c.startDate)} – ${fmtDate(c.endDate)} · ${totalWeeks} weeks${stageLabel?' · Board stage: '+stageLabel:''}</div>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <button class="btn ghost" data-nav="dashboard">← Dashboard</button>
        <button class="btn secondary" data-action="edit-campaign">Edit Campaign</button>
        <button class="btn" data-shortcut="weekly">Enter Week</button>
      </div>
    </div>

    ${c.objective ? `<div class="obj-box"><strong>Objective:</strong> ${escapeHtml(c.objective)}</div>` : ''}

    ${c.handoverText ? `<details class="handover-details"><summary>Handover details (as pasted)</summary><pre>${escapeHtml(c.handoverText)}</pre></details>` : ''}
    <div class="section-title">Metrics overview</div>
    ${renderOverallStatsTable(c, totalWeeks)}

    <div class="form-actions">
      <div>
        <button class="btn ghost" data-action="overview-archive">${c.archived?'↩ Unarchive Campaign':'🗄 Archive Campaign'}</button>
        <button class="btn danger" data-action="overview-delete" style="margin-left:8px;">Delete Campaign</button>
      </div>
      <div class="right">
        <button class="btn secondary" data-shortcut="history">History</button>
        ${hasAnySaved ? `<button class="btn secondary" data-nav="report">View Report</button>` : ''}
      </div>
    </div>
  </div>`;
}

// ---------- Paste handover: read a pasted handover ticket into campaign fields ----------
// Label matching is deliberately forgiving (case, spacing and punctuation are ignored). These
// aliases are a best guess — once the real handover template is known, tune them here.
const HANDOVER_LABELS = {
  heading:   ['smartrewards','smartrewardshandover','handover'],
  name:      ['campaignname','campaign','name','campaigntitle','projectname','title','summary'],
  client:    ['client','clientname','brand','clientbrand','clientorbrand','advertiser','customer'],
  dynamics:  ['dynamics','dynamicsref','dynamicsreference','dynamicsnumber','dynamicsno','dynamicsid'],
  cdOwner:   ['cdowner','campaigndeliveryowner','deliveryowner','owner','assignedto','assignee'],
  package:   ['package','packagetype','campaignpackage','productpackage','smartrewardpackage','smartrewardspackage','rewardpackage'],
  gamification: ['gamification','gamificationadded'],
  startDate: ['startdate','start','golive','golivedate','livedate','launchdate','campaignstart','campaignstartdate','desiredlivedate','desiredlive','desiredgolive','desiredstartdate','desiredstart'],
  endDate:   ['enddate','end','campaignend','campaignenddate','finishdate'],
  dates:     ['dates','campaigndates','livedates','campaignperiod','period'],
  objective: ['objective','objectives','campaignobjective','goal','aim','clientsobjective','clientobjective'],
  offer:     ['offer','campaignoffer','offervalue','offerdetails','incentive','discount','reward'],
  retailers: ['retailers','retailer','campaignretailers','participatingretailers'],
  region:    ['region','territory','market','geography','country'],
  // In the handover but with no matching field in setup — kept as text on the campaign.
  clientEmail: ['clientemail','clientemailaddress','email','emailaddress'],
  addOns:    ['addons','addon'],
  vouchers:  ['couponsitemvouchers','couponsoritemvouchers','couponsvouchers','itemvouchers'],
  volumes:   ['volumes','volume','agreedvolumes'],
  po:        ['potocoverredemptions','po','ponumber','purchaseorder'],
  fees:      ['feediscounts','feediscount','discounts'],
  other:     ['otherrelevantinformation','otherinformation','otherinfo','notes','additionalinformation'],
};
const HANDOVER_KEPT = {
  clientEmail:'Client email', addOns:'Add-ons', vouchers:'Coupons / item vouchers', volumes:'Volumes',
  po:'PO to cover redemptions', fees:'Fee discounts', other:'Other relevant information',
};
const RETAILER_ALIASES = {
  aldi:['aldi'], amazon:['amazon'], argos:['argos'], asda:['asda'],
  bm:['b&m','b & m','b and m'], bq:['b&q','b & q','b and q'],
  caffenero:['caffè nero','caffe nero','cafe nero','café nero'],
  coop:['co-op','co op','coop'], costa:['costa'], johnlewis:['john lewis'],
  morrisons:['morrisons'], sainsburys:["sainsbury's",'sainsburys','sainsbury’s','sainsbury'],
  tesco:['tesco'], waitrose:['waitrose'],
};
// Finds every date in a string (UK day-first numeric, ISO, or "7th June 2026"), in reading order.
function parseHandoverDates(str){
  const MONTHS = {jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
  const found = [];
  const push = (idx,y,m,d)=>{
    const dt = new Date(y, m-1, d);
    if(dt.getFullYear()!==y || dt.getMonth()!==m-1 || dt.getDate()!==d) return;
    found.push({idx, iso:`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`});
  };
  let m;
  const isoRe = /\b(\d{4})-(\d{2})-(\d{2})\b/g;
  while((m = isoRe.exec(str))) push(m.index, +m[1], +m[2], +m[3]);
  const ukRe = /\b(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2}|\d{4})\b/g;
  while((m = ukRe.exec(str))){ let y = +m[3]; if(m[3].length===2) y += 2000; push(m.index, y, +m[2], +m[1]); }
  const txtRe = /\b(\d{1,2})(?:st|nd|rd|th)?\s+(?:of\s+)?(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?,?\s+(\d{4})\b/gi;
  while((m = txtRe.exec(str))) push(m.index, +m[3], MONTHS[m[2].toLowerCase()], +m[1]);
  found.sort((a,b)=>a.idx-b.idx);
  return found.map(f=>f.iso);
}
function parseHandover(text){
  const rawLines = String(text||'').split(/\r?\n/);
  const strip = l => String(l).replace(/\u00a0/g,' ').replace(/\*/g,'').replace(/^[\-\u2022|\s]+/,'');
  const lines = rawLines.map(l=>strip(l).trim());
  const keyFor = (label)=>{
    const norm = String(label).toLowerCase().replace(/[^a-z0-9]/g,'');
    if(!norm) return null;
    for(const k in HANDOVER_LABELS){ if(HANDOVER_LABELS[k].includes(norm)) return k; }
    return null;
  };
  // "Smart reward Package - Basic, Intermediate, Advanced, BLC" -> "Smart reward Package"
  const coreLabel = s2 => String(s2).replace(/\s+[-–—]\s+.*$/,'').replace(/\(.*$/,'').replace(/\be\.?g\.?\b.*$/i,'').trim();
  const splitLabel = (i)=>{
    const line = lines[i];
    const tabbed = strip(rawLines[i]);
    if(tabbed.includes('\t')){ // table paste: label <tab> value — the label may carry a long description
      const idx = tabbed.indexOf('\t');
      const left = tabbed.slice(0, idx), right = tabbed.slice(idx+1);
      const k = keyFor(coreLabel(left)) || keyFor(left);
      if(k) return {key:k, value:right.replace(/\t+/g,' ').replace(/\|\s*$/,'').trim(), viaTab:true};
    }
    let m = line.match(/^([^:\t|]{1,45}?)\s*(?::|\t|\|)\s*(.*)$/);
    if(m && keyFor(m[1])) return {key:keyFor(m[1]), value:m[2].replace(/\|\s*$/,'').trim()};
    m = line.match(/^(.{1,45}?)\s+[-–—]\s+(.*)$/);
    if(m && keyFor(m[1])){
      const k = keyFor(m[1]);
      let value = m[2].trim();
      if(HANDOVER_KEPT[k] && !/[\d£%]/.test(value)) value = ''; // probably the label's own description, not a value
      return {key:k, value};
    }
    const core = coreLabel(line.replace(/[:\s]+$/,''));
    if(core && core.length<=60 && keyFor(core)) return {key:keyFor(core), value:''};
    return null;
  };

  const raw = {};
  const unplaced = [];
  let lastKey = null;
  for(let i=0;i<lines.length;i++){
    const line = lines[i];
    if(!line){ lastKey = null; continue; }
    const hit = splitLabel(i);
    if(hit){
      if(hit.key==='heading'){ lastKey = null; continue; }
      let value = hit.value;
      if(!value && !hit.viaTab){ // label on its own line — the value is the next non-empty line
        let j = i+1; while(j<lines.length && !lines[j]) j++;
        if(j<lines.length && !splitLabel(j)){ value = lines[j]; i = j; }
      }
      if(raw[hit.key] !== undefined){ unplaced.push(line); lastKey = null; continue; }
      raw[hit.key] = value; lastKey = hit.key;
      continue;
    }
    if(lastKey==='objective' && !String(rawLines[i]).includes('\t')){ raw.objective += ' ' + line; continue; } // objectives often wrap
    unplaced.push(line);
  }

  const fields = {name:'',client:'',dynamics:'',cdOwner:'',package:'',startDate:'',endDate:'',objective:'',offerType:'',offerValue:'',retailers:[],region:'',gamification:false};
  const notes = [];
  if(raw.name) fields.name = raw.name;
  if(raw.client) fields.client = raw.client;
  if(raw.dynamics) fields.dynamics = raw.dynamics;
  if(raw.objective) fields.objective = raw.objective;
  if(raw.gamification) fields.gamification = /^(y|yes|true|added|included)\b/i.test(raw.gamification.trim());

  if(raw.cdOwner){
    const v = raw.cdOwner.toLowerCase();
    const key = Object.keys(CD_OWNERS).find(k=>{
      const full = CD_OWNERS[k].toLowerCase(), parts = full.split(' ');
      return v.includes(full) || parts.some(p=>v.includes(p)) || new RegExp('\\b'+k.toLowerCase()+'\\b').test(v);
    });
    if(key) fields.cdOwner = key; else notes.push(`Couldn't match the CD owner "${raw.cdOwner}" — pick them in setup.`);
  }
  if(raw.package){
    const v = raw.package.toLowerCase();
    const hits = [/blue\s*light|\bblc\b/.test(v)?'bluelight':null, v.includes('advanced')?'advanced':null, v.includes('intermediate')?'intermediate':null, v.includes('basic')?'basic':null].filter(Boolean);
    if(hits.length===1) fields.package = hits[0];
    else if(hits.length>1) notes.push('The package line lists every option rather than a choice — pick the package in setup.');
    else notes.push(`Couldn't match the package "${raw.package}" — choose it in setup.`);
  }

  const sd = raw.startDate ? parseHandoverDates(raw.startDate) : [];
  const ed = raw.endDate ? parseHandoverDates(raw.endDate) : [];
  const rd = raw.dates ? parseHandoverDates(raw.dates) : [];
  if(sd.length) fields.startDate = sd[0];
  if(ed.length) fields.endDate = ed[0];
  if(sd.length>1 && !fields.endDate) fields.endDate = sd[sd.length-1];
  if(rd.length>=2){ if(!fields.startDate) fields.startDate = rd[0]; if(!fields.endDate) fields.endDate = rd[rd.length-1]; }
  else if(rd.length===1){ if(!fields.startDate) fields.startDate = rd[0]; if(!fields.endDate) notes.push('Only one date was found in the campaign dates — add the end date in setup.'); }
  if(raw.startDate && !sd.length) notes.push(`Couldn't read a date from the start date "${raw.startDate}".`);
  if(raw.endDate && !ed.length) notes.push(`Couldn't read a date from the end date "${raw.endDate}".`);
  if(fields.startDate && !fields.endDate && !notes.some(n=>n.startsWith('Only one date'))) notes.push('The handover gives a live date but no end date — add the end date in setup.');

  if(raw.offer){
    const pound = raw.offer.match(/£\s*(\d+(?:\.\d+)?)/);
    const pct = raw.offer.match(/(\d+(?:\.\d+)?)\s*%/);
    if(pound){ fields.offerType = 'fixed'; fields.offerValue = pound[1]; }
    else if(pct){ fields.offerType = 'pct'; fields.offerValue = pct[1]; }
    else notes.push(`The offer "${raw.offer}" has no £ or % value I can read — set the offer type in setup if it needs one.`);
  }
  if(raw.region){
    const v = raw.region.toLowerCase();
    const roi = /\broi\b|ireland/.test(v), uk = /\buk\b|united kingdom|\bgb\b|britain/.test(v);
    fields.region = roi && uk ? 'uk_roi' : roi ? 'roi' : uk ? 'uk' : '';
    if(!fields.region) notes.push(`Couldn't match the region "${raw.region}" — set it in setup.`);
  }
  if(raw.retailers){
    const v = raw.retailers.toLowerCase();
    const allowed = retailersForPackage(fields.package || 'basic').map(r=>r.id);
    const matched = Object.keys(RETAILER_ALIASES).filter(id=>RETAILER_ALIASES[id].some(a=>v.includes(a)));
    fields.retailers = matched.filter(id=>allowed.includes(id));
    const dropped = matched.filter(id=>!allowed.includes(id)).map(id=>RETAILERS.find(r=>r.id===id).label);
    if(dropped.length) notes.push(`${dropped.join(', ')} ${dropped.length===1?'isn’t':'aren’t'} an option for the ${PACKAGES[fields.package||'basic'].label} package, so ${dropped.length===1?'it was':'they were'} left out.`);
    if(!matched.length) notes.push(`Couldn't match any retailers in "${raw.retailers}".`);
  }

  const rows = [
    {label:'Campaign name', value:fields.name, required:true},
    {label:'Client', value:fields.client, required:true},
    {label:'Dynamics ref', value:fields.dynamics},
    {label:'CD owner', value:fields.cdOwner ? CD_OWNERS[fields.cdOwner] : ''},
    {label:'Package', value:fields.package ? PACKAGES[fields.package].label : ''},
    {label:'Start date', value:fields.startDate ? fmtDate(fields.startDate) : '', required:true},
    {label:'End date', value:fields.endDate ? fmtDate(fields.endDate) : '', required:true},
    {label:'Objective', value:fields.objective, required:true},
    {label:'Offer value', value:fields.offerType==='fixed' ? '£'+fields.offerValue : fields.offerType==='pct' ? fields.offerValue+'% off' : ''},
    {label:'Retailers', value:fields.retailers.map(id=>RETAILERS.find(r=>r.id===id).label).join(', ')},
    {label:'Region', value:fields.region ? regionLabel(fields.region) : ''},
    {label:'Gamification', value:raw.gamification ? (fields.gamification ? 'Yes' : 'No') : ''},
  ];
  const kept = Object.keys(HANDOVER_KEPT).filter(k=>raw[k]!==undefined).map(k=>({label:HANDOVER_KEPT[k], value:raw[k]}));
  return {fields, rows, notes, unplaced, kept, foundCount: rows.filter(r=>r.value).length};
}

function renderHandover(){
  const p = handoverParsed;
  let preview = '';
  if(p){
    const rowsHtml = p.rows.map(r=>{
      const status = r.value ? '<span class="ho-ok">✓ Found</span>'
        : r.required ? '<span class="ho-need">Add in setup</span>' : '<span class="ho-none">Not found</span>';

// ---------- Client list: built from the campaigns already in the system ----------
// A client "falls into the list" as soon as a campaign using it is saved. Spelling is matched
// ignoring case and extra spaces, so "tesco" never creates a second "Tesco".
function getClientList(){
  const seen = new Map();
  campaigns.forEach(c=>{
    const name = String(c.client||'').replace(/\s+/g,' ').trim();
    if(name && !seen.has(name.toLowerCase())) seen.set(name.toLowerCase(), name);
  });
  return [...seen.values()].sort((a,b)=>a.localeCompare(b, undefined, {sensitivity:'base'}));
}
function canonicalClient(name){
  const clean = String(name||'').replace(/\s+/g,' ').trim();
  if(!clean) return '';
  return getClientList().find(cl=>cl.toLowerCase()===clean.toLowerCase()) || clean;
}
function clientHintText(value){
  const v = String(value||'').replace(/\s+/g,' ').trim();
  if(!v) return '';
  const match = getClientList().find(cl=>cl.toLowerCase()===v.toLowerCase());
  if(!match) return 'New client — it will be added to the list when you save.';
  return match===v ? '' : `Will be saved as “${match}”.`;
}

function forecastRagForMetric(campaign, metricId){
  const mdef = effectiveMetrics(campaign).find(m=>m.id===metricId);
  if(!mdef) return null;
  const target = campaign.targets ? campaign.targets[metricId] : null;
  const totalWeeks = calcTotalWeeks(campaign.startDate,campaign.endDate);
  const recorded = weeksRecorded(campaign);
  if(!target || recorded===0) return null;
  const cumul = calcCumulativeFromHistory(campaign, metricId, '9999-99-99', 0);
  const weeklyTarget = target/totalWeeks;
  const avgPerWeek = cumul/recorded;
  const forecast = cumul + avgPerWeek*(totalWeeks-recorded);
  const pctOfTarget = (forecast/target)*100;
  if(pctOfTarget<=50) return 'red';
  if(pctOfTarget<=75) return 'amber';
  if(pctOfTarget<=115) return 'green';
  return 'amber';
}

// Workflow stages for the Board view — this is the team's delivery process, deliberately
// separate from the automatic Live/Upcoming/Ended status (which is just a read of the dates).
const WORKFLOW_STAGES = [
  { id:'briefed',    label:'Briefed' },
  { id:'todo',       label:'To Do' },
  { id:'waiting',    label:'Waiting Client Requirements' },
  { id:'inprogress', label:'In Progress' },

  { id:'review',     label:'Campaign Review' },
  { id:'complete',   label:'Complete' },
];

const LEGACY_STAGE_MAP = { planning:'briefed', setup:'inprogress', reporting:'review' };
function stageOf(c){
  const id = c.workflowStage || 'briefed';
  if(WORKFLOW_STAGES.some(st=>st.id===id)) return id;
  return LEGACY_STAGE_MAP[id] || 'briefed';
}
// Combines a package's fixed metrics with any campaign-specific custom metrics, in the
// campaign's saved display order (custom metrics default to the bottom; both custom and
// fixed metrics can be reordered via the up/down arrows in Setup).
function effectiveMetrics(c){
  const pkgMetrics = PACKAGES[c.package].metrics;
  const customDefs = (c.customMetrics||[]).map(cm=>({id:cm.id, name:cm.name, entry:'manual', target:'optional', isCurrency:!!cm.isCurrency, custom:true, description:cm.description||''}));
  const all = [...pkgMetrics, ...customDefs];
  const order = (c.metricOrder && c.metricOrder.length) ? c.metricOrder : all.map(m=>m.id);
  const byId = {}; all.forEach(m=>{ byId[m.id]=m; });
  const seen = new Set();
  const ordered = [];
  order.forEach(id=>{ if(byId[id] && !seen.has(id)){ ordered.push(byId[id]); seen.add(id); } });
  all.forEach(m=>{ if(!seen.has(m.id)){ ordered.push(m); seen.add(m.id); } }); // safety net, e.g. after a package change
  return ordered;
}

function renderCalendarPanel(viewMonth, start, end){
  const d = new Date(viewMonth+'T00:00:00');
  const year = d.getFullYear(), month = d.getMonth();
  const monthLabel = d.toLocaleDateString('en-GB',{month:'long', year:'numeric'});
  const firstOfMonth = new Date(year, month, 1);
  const startDow = (firstOfMonth.getDay()+6)%7; // Monday-first
  const daysInMonth = new Date(year, month+1, 0).getDate();
  let cells = '';
  for(let i=0;i<startDow;i++) cells += `<span class="drp-cell empty"></span>`;
  for(let day=1;day<=daysInMonth;day++){
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    let cls='drp-cell';
    if(start && end && dateStr>start && dateStr<end) cls+=' drp-in-range';
    if(start && dateStr===start) cls+=' drp-start'+(!end||start===end?' drp-solo':'');
    if(end && dateStr===end && end!==start) cls+=' drp-end';
    cells += `<button type="button" class="${cls}" data-pick-date="${dateStr}">${day}</button>`;
  }
  return `<div class="drp-panel">
    <div class="drp-nav">
      <button type="button" class="drp-nav-btn" data-cal-nav="-1">‹</button>
      <div class="drp-month-label">${monthLabel}</div>

    <div class="drp-grid">${cells}</div>
    <div class="drp-hint">${!start ? 'Click a date to set the start' : !end ? 'Click another date to set the end' : 'Click a date to move the nearest edge of the range'}</div>
    <div class="drp-footer">
      <button type="button" class="btn ghost small" data-action="clear-date-picker">Clear</button>
      <div style="flex:1;"></div>
      <button type="button" class="btn ghost small" data-action="close-date-picker">Cancel</button>
      <button type="button" class="btn small" data-action="apply-date-picker" ${!(start&&end)?'disabled':''}>Done</button>
    </div>
  </div>`;
}

function renderWeeklyEntry(){
  const c = campaigns.find(x=>x.id===currentCampaignId);
  if(!c){ currentView='dashboard'; return renderDashboard(); }

  const totalWeeks = calcTotalWeeks(c.startDate,c.endDate);

  const weekNum = calcWeekNum(c.startDate, currentWeekDate);
  const mid = midpointWeek(totalWeeks);
  const savedEntry = c.weeklyData[currentWeekDate];
  const hasAnySaved = weeksRecorded(c) > 0;
  const firstWeekMon = toMonday(c.startDate);
  const lastWeekMon = addDays(firstWeekMon, (totalWeeks-1)*7);

  // recompute auto fields live from weekInputs

    const target = c.targets ? c.targets[m.id] : null;
    const weeklyTarget = target ? target/totalWeeks : null;
    const cumul = calcCumulativeFromHistory(c, m.id, currentWeekDate, willAuto ? auto[m.id] : (weekInputs[m.id]||0));

function renderOverallStatsTable(c, totalWeeks){
  const pkg = PACKAGES[c.package];
  const recorded = weeksRecorded(c);
  const rows = effectiveMetrics(c).filter(m=>c.optionalMetrics[m.id]!==false).map(m=>{
    const target = c.targets ? c.targets[m.id] : null;
    const weeklyTarget = target ? target/totalWeeks : null;
    const cumul = calcCumulativeFromHistory(c, m.id, '9999-99-99', 0);
    let forecastCell = '<span class="muted">—</span>';
    if(recorded>0){
      if(m.isRatio){
        forecastCell = '<span class="muted">See weekly RAG</span>';
      } else if(target){
        const avg = cumul/recorded;
        const forecast = cumul + avg*(totalWeeks-recorded);
        const pctOfTarget = Math.round((forecast/target)*1000)/10;
        const variance = forecast-target;
        const varSign = variance>=0?'+':'-';
        forecastCell = `${fmtMetricValue(m, forecast)} <span class="muted">(${pctOfTarget}% · ${varSign}${fmtMetricValue(m, Math.abs(variance))})</span>`;
      } else {
        forecastCell = '<span class="muted">No estimate set</span>';
      }
    }
    return `<tr>
      <td><span class="metric-name">${m.name}</span></td>
      <td>${target ? fmtMetricValue(m, target) : '<span class="muted">—</span>'}</td>
      <td>${target ? fmtMetricValue(m, target/totalWeeks)+'/wk' : '<span class="muted">—</span>'}</td>
      <td class="${(m.isRatio || !target) ? 'forecast-na' : ''}">${forecastCell}</td>
      <td>${m.isRatio ? '<span class="muted">n/a</span>' : fmtMetricValue(m, cumul)}</td>
    </tr>`;
  }).join('');
  const table = `<table class="data-table"><thead><tr><th>Metric</th><th>Overall Estimate</th><th>Weekly Estimate</th><th>Forecast to Completion</th><th>Cumulative</th></tr></thead><tbody>${rows}</tbody></table>`;

  // Attainment bar for the primary RAG-tracked metric that has a target set — mirrors a
  // "cap vs actual" style progress indicator for the campaign's headline redemption metric.
  const ragIds = getRagMetricIds(c.package);
  const primaryId = ragIds.slice().reverse().find(id => c.targets && c.targets[id]); // prefer redeemed over activated
  let capBar = '';
  if(primaryId){
    const mdef = pkg.metrics.find(x=>x.id===primaryId);
    const target = c.targets[primaryId];
    const cumul = calcCumulativeFromHistory(c, primaryId, '9999-99-99', 0);
    const pct = Math.max(0, Math.min(100, Math.round((cumul/target)*100)));
    capBar = `<div style="margin-bottom:16px;">
      <div class="cap-row"><span>${mdef.name} vs estimate</span><span class="cap-figure">${fmtMetricValue(mdef,cumul)} of ${fmtMetricValue(mdef,target)} (${pct}%)</span></div>
      <div class="cap-track"><div class="cap-fill" style="width:${pct}%;"></div></div>
    </div>`;
  }

  return `${capBar}${table}`;
}

const ACTION_SUGGESTIONS = {
  red: (name)=> `${name} is significantly behind weekly estimate (0–50%). Consider a targeted push: refresh creative, extend visibility on high-traffic placements, and check for redemption friction (barcode/app issues, expiry confusion).`,
  amber_low: (name)=> `${name} is below pace (51–75%). Recommend a check-in with the retailer/media partner and a light-touch reminder push to shoppers who activated but haven't redeemed.`,
  amber_high: (name)=> `${name} is running well ahead of weekly estimate (116%+). Worth investigating — confirm data is accurate, offer value isn't being misapplied, and stock/fulfilment can support the pace.`,
};
function renderAnalysis(){
  const c = campaigns.find(x=>x.id===currentCampaignId);
  if(!c || !lastSavedRag){ currentView='weekly'; return renderWeeklyEntry(); }
  const tableRows = lastSavedRag.map(r=>{
    const st = r.status || 'green';
    return `<tr>
      <td class="metric-name">${r.name}</td>
      <td>${fmtNum(r.actual)}</td>
      <td>${r.weeklyTarget ? fmtNum(r.weeklyTarget)+'/wk' : '<span class="muted">—</span>'}</td>
      <td>${r.pct!==null ? r.pct+'%' : '<span class="muted">—</span>'}</td>
      <td><span class="rag-badge ${st}">${ragLabel(st)}</span></td>
    </tr>`;
  }).join('');
  const items = lastSavedRag.filter(r=>r.status && r.status!=='green').map(r=>{
    let text;
    if(r.status==='red') text = ACTION_SUGGESTIONS.red(r.name);
    else if(r.pct>=116) text = ACTION_SUGGESTIONS.amber_high(r.name);
    else text = ACTION_SUGGESTIONS.amber_low(r.name);
    return `<div class="analysis-item"><h3>${r.name} <span class="rag-badge ${r.status}">${ragLabel(r.status)}</span></h3><p>${text}</p></div>`;
  }).join('');
  return `<div class="wrap-narrow">
    <div class="top-meta"><div><h1>Analysis</h1><div class="subtle">${escapeHtml(c.name)} · Week ${calcWeekNum(c.startDate,currentWeekDate)}</div></div>

    <div class="section-title">Suggested actions</div>
    ${items || '<div class="banner teal">All tracked metrics are green this week — nothing needs action.</div>'}
    <div class="form-actions"><div></div><div class="right"><button class="btn secondary" data-nav="report">View Report</button></div></div>

}

function fmtShortDay(d){ return new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short'}); }

// A saved week only counts as "entered" once it holds at least one figure above zero. A week saved with nothing
// in it is left out of the report's weekly tables, period selector and PDF pages.
function weekHasData(entry){ return !!entry && (entry.metrics||[]).some(m=>Number(m.actual) > 0); }
function cumFor(c, id){ return calcCumulativeFromHistory(c, id, '9999-99-99', 0); }
// Campaign-to-date conversion uses the same ratio() rule as the weekly figures, applied to the campaign
// totals — never an average of the weekly percentages.
const CONVERSION_PARTS = {
  basic:        { atr:['red','act'] },
  intermediate: { itr:['red','issued'], atr:['red','act'] },
  bluelight:    { itr:['red','issued'], atr:['red','act'] },
  advanced:     { itr:['rew_red','rew_iss'], atr:['rew_red','rew_act'] },
};
function cumulativeConversion(c, id){
  const parts = (CONVERSION_PARTS[c.package]||{})[id];
  if(!parts) return null;
  const den = cumFor(c, parts[1]);
  if(!den) return null;
  return ratio(cumFor(c, parts[0]), den);
}
// Same forecast rule as before: total so far + average week x weeks still to run.
function forecastFor(c, m, recorded, totalWeeks){
  const target = c.targets && c.targets[m.id];
  if(!target || m.isRatio || recorded===0) return null;
  const cumul = cumFor(c, m.id);
  return cumul + (cumul/recorded)*(totalWeeks-recorded);
}

// a clickable area over it (see exportPDF), so the downloaded PDF can jump between pages.
// A "?" that explains itself: hover (or click / tap) on screen shows the text; in the PDF it jumps to the key page
// (only when that page is included, which is what data-pdf-link marks).
function rpHelp(text){
  if(!text) return '';
  return `<span class="rp-help" tabindex="0" role="button" aria-label="What does this mean?" data-help="${escapeHtml(text)}"${rpKeyOn ? ' data-pdf-link="key"' : ''}>?</span>`;
}
const FORECAST_NOTE = 'Based on the estimates set for this campaign, this shows where each measure would finish if it keeps performing at its current average weekly pace. It is an indication, not a guarantee, and updates as each new week is added.';
const FORECAST_HELP = FORECAST_NOTE + ' Green: On Track (over 75% of the estimate, up to 115%). Amber: Needs Attention (over 50% and up to 75%, or above 115%). Red: Behind Estimate (50% or less).';
const FUNNEL_HELP = 'Totals to date at each step of the journey. The arrow under a step shows the share that moved on from the step above.';
function rpPdfNav(active, extraClass){
  const item = (id, label)=>`<span class="rp-pdfnav-item ${active===id?'active':''}" data-pdf-link="${id}">${label}</span>`;
  return `<div class="rp-pdfnav ${extraClass||''}"><span class="rp-pdfnav-lab">Jump to</span>${item('overview','Overview')}${rpHasWeekly ? item('weekly','Weekly Performance') : ''}${rpKeyOn ? item('key','Key') : ''}${rpKeyOn ? '<span class="rp-pdfnav-tip">Click a <b>?</b> to see what a measure means</span>' : ''}</div>`;
}
function rpInfoCard(c, totalWeeks, limitLabel){
  const fact = (icon, text)=>`<span class="rp-fact">${rpIcon(icon,18)}<span>${text}</span></span>`;
  const retailers = (c.package==='basic' && (c.retailers||[]).length) ? fact('store', escapeHtml(c.retailers.map(r=>RETAILERS.find(x=>x.id===r)?.label||r).join(', '))) : '';
  return `<div class="rp-info">
    <div class="rp-info-main">
      <div class="rp-info-top">
        <div><div class="rp-lab">Client</div><div class="rp-client">${escapeHtml(c.client)||'—'}</div></div>
        <div class="rp-info-divider"></div>
        <div><div class="rp-lab">Campaign</div><div class="rp-cname">${escapeHtml(c.name)}</div></div>
      </div>
      <div class="rp-facts">${fact('calendar', `${fmtDateRangeShort(c.startDate, c.endDate)} (${totalWeeks} wks)`)}${fact('tag', escapeHtml(formatOfferValue(c)))}${limitLabel ? fact('layers', `Limit: ${limitLabel}`) : ''}${retailers}</div>
      ${c.objective ? `<div class="rp-objective"><span class="rp-lab">Objective</span> ${escapeHtml(c.objective)}</div>` : ''}
    </div>
    ${c.logo ? `<div class="rp-info-img">${renderReportLogoImg(c, 300, 130)}</div>` : ''}
  </div>`;
}
function rpInfoStrip(c, totalWeeks, limitLabel){
  const item = (icon, label, val)=>`<div class="rp-strip-item">${rpIcon(icon,22)}<div><div class="rp-lab">${label}</div><div class="rp-strip-val">${val}</div></div></div>`;
  return `<div class="rp-strip"><div class="rp-strip-facts">
    ${item('user','Client', escapeHtml(c.client)||'—')}
    ${item('calendar','Dates', `${fmtDateRangeShort(c.startDate, c.endDate)}<div class="rp-strip-sub">(${totalWeeks} weeks)</div>`)}
    ${limitLabel ? item('layers','Limits', limitLabel) : ''}
    ${item('tag','Offer value', escapeHtml(formatOfferValue(c)))}
  </div>${c.logo ? `<div class="rp-strip-img">${renderReportLogoImg(c, 190, 84)}</div>` : ''}</div>`;
}

function rpKpiCard(c, m, ctx){
  if(m.isRatio){
    const v = cumulativeConversion(c, m.id);
    return `<div class="rp-kpi"><div class="rp-kpi-top"><span class="rp-kpi-ico">${metricIcon(m)}</span><span class="rp-kpi-name">${escapeHtml(m.name)}${rpHelp(metricDescription(m))}</span></div>
      <div class="rp-kpi-val">${v===null ? '—' : v+'%'}</div><div class="rp-kpi-sub">Current conversion</div></div>`;
  }
  const cum = cumFor(c, m.id);
  const target = c.targets && c.targets[m.id];
  let pill = '', sub = 'Total to date', bar = '';
  if(target){
    const pct = Math.round(cum/target*1000)/10;
    const st = ctx.recorded>0 ? (forecastRagForMetric(c, m.id) || 'neutral') : 'neutral';
    pill = `<span class="rp-pill ${st}" title="Share of the estimate reached so far">${pct}%</span>`;
    sub = `${fmtMetricValue(m, target)} estimate`;
    bar = `<div class="rp-bar"><div class="rp-bar-fill ${st}" style="width:${Math.min(100, Math.max(0, pct))}%;"></div></div>`;
  }
  return `<div class="rp-kpi"><div class="rp-kpi-top"><span class="rp-kpi-ico">${metricIcon(m)}</span><span class="rp-kpi-name">${escapeHtml(m.name)}${rpHelp(metricDescription(m))}</span>${pill}</div>
    <div class="rp-kpi-val">${fmtMetricValue(m, cum)}</div><div class="rp-kpi-sub">${sub}</div>${bar}</div>`;
}

function rpFunnelLegend(stages){
  const cats = [...new Set(stages.map(s=>metricGroup(s.m)))];
  return `<div class="rp-fn-legend">${cats.map(g=>`<span><i class="rp-fn-sw cat-${g}"></i>${GROUP_DEFS[g].label}</span>`).join('')}</div>`;
}
// Whole-journey view: every step of the funnel that is on the report, with the share that moved on.
function rpFunnel(c, visibleMetrics){
  const stages = visibleMetrics.filter(m=>FUNNEL_IDS.includes(m.id)).map(m=>({m, v:cumFor(c, m.id)}));
  if(stages.length < 2) return '';
  const max = Math.max(...stages.map(s=>s.v), 1);
  const rows = stages.map((s,i)=>{
    const w = s.v>0 ? Math.max(2, Math.round(s.v/max*100)) : 0;
    const prev = i>0 ? stages[i-1].v : 0;
    const step = (i>0 && prev>0 && s.v<=prev) ? `<div class="rp-fn-step">↓ ${ratio(s.v, prev)}%</div>` : '';
    return `${step}<div class="rp-fn-row"><span class="rp-fn-ico">${metricIcon(s.m)}</span><span class="rp-fn-name">${escapeHtml(s.m.name)}${rpHelp(metricDescription(s.m))}</span><div class="rp-fn-track"><div class="rp-fn-fill cat-${metricGroup(s.m)}" style="width:${w}%;"></div></div><span class="rp-fn-val">${fmtMetricValue(s.m, s.v)}</span></div>`;
  }).join('');
  const redval = visibleMetrics.find(m=>m.id==='redval');
  const valueLine = redval ? `<div class="rp-fn-total">${rpIcon('pound',16)} Value redeemed to date: <strong>${fmtMetricValue(redval, cumFor(c,'redval'))}</strong></div>` : '';
  return `<div class="rp-panel"><div class="rp-panel-title">${rpIcon('filter',20)} Campaign Funnel${rpHelp(FUNNEL_HELP)}</div>
    <div class="rp-panel-sub">Totals to date at each step. Arrows show the share that moved on from the step above.</div>${rows}${rpFunnelLegend(stages)}${valueLine}</div>`;
}

function rpForecast(c, visibleMetrics, ctx){
  const items = visibleMetrics.filter(m=>!m.isRatio && c.targets && c.targets[m.id]);
  let body;
  if(!items.length){
    body = `<div class="rp-empty">No estimates have been set, so there is no forecast to show.</div>`;
  } else {
    body = items.map(m=>{
      const target = c.targets[m.id];
      const f = forecastFor(c, m, ctx.recorded, ctx.totalWeeks);
      if(f===null){
        return `<div class="rp-fc-row"><div class="rp-fc-name">${escapeHtml(m.name)}${rpHelp(metricDescription(m))}</div><div class="rp-fc-mid"><div class="rp-fc-text">Forecast — / Estimate ${fmtMetricValue(m, target)}</div><div class="rp-bar"><div class="rp-bar-fill neutral" style="width:0%;"></div></div></div><span class="rp-pill neutral">—</span></div>`;
      }
      const pct = Math.round(f/target*1000)/10;
      const st = forecastRagForMetric(c, m.id) || 'neutral';
      return `<div class="rp-fc-row"><div class="rp-fc-name">${escapeHtml(m.name)}${rpHelp(metricDescription(m))}</div><div class="rp-fc-mid"><div class="rp-fc-text">Forecast <strong>${fmtMetricValue(m, Math.round(f))}</strong> / Estimate ${fmtMetricValue(m, target)}</div><div class="rp-bar"><div class="rp-bar-fill ${st}" style="width:${Math.min(100, Math.max(0, pct))}%;"></div></div></div><span class="rp-pill ${st}">${pct}% of estimate</span></div>`;
    }).join('') + `<div class="rp-legend"><span><i class="key-swatch green"></i>On Track</span><span><i class="key-swatch amber"></i>Needs Attention</span><span><i class="key-swatch red"></i>Behind Estimate</span></div>`;
  }
  return `<div class="rp-panel"><div class="rp-panel-title">${rpIcon('target',20)} Forecast to End vs Estimate${rpHelp(FORECAST_HELP)}</div>
    <div class="rp-panel-sub">${FORECAST_NOTE}</div>${body}</div>`;
}
function rpInsights(notes){
  return `<div class="rp-insights"><div class="rp-ins-ico">${rpIcon('bulb',22)}</div><div><div class="rp-ins-title">Campaign Insights &amp; Next Steps</div><div class="rp-ins-text">${notes ? escapeHtml(notes) : 'No notes added for the latest week.'}</div></div></div>`;
}

// ---- Weekly Performance ----
function rpSelectWeeks(weekDates){
  const n = weekDates.length;
  if(weeklyPeriod==='latest4') return weekDates.slice(-4);
  if(weeklyPeriod==='prev4') return n>4 ? weekDates.slice(Math.max(0, n-8), n-4) : weekDates;
  if(weeklyPeriod==='custom' && n>0){
    const from = Math.min(Math.max(1, weeklyFrom), n);
    const to = Math.min(Math.max(weeklyTo>0 ? weeklyTo : n, from), n);
    return weekDates.slice(from-1, to);
  }
  return weekDates;
}
function rpPeriodControls(c, weekDates){
  const n = weekDates.length;
  const opt = (v,l)=>`<option value="${v}" ${weeklyPeriod===v?'selected':''}>${l}</option>`;
  let custom = '';
  if(weeklyPeriod==='custom' && n>0){
    const from = Math.min(Math.max(1, weeklyFrom), n), to = Math.min(Math.max(weeklyTo>0 ? weeklyTo : n, from), n);
    const wopts = (sel)=>weekDates.map((wd,i)=>`<option value="${i+1}" ${sel===i+1?'selected':''}>W${calcWeekNum(c.startDate, wd)} · ${fmtShortDay(wd)}</option>`).join('');
    custom = `<span class="rp-period-lab">From</span><select id="rp-from" class="rp-select">${wopts(from)}</select><span class="rp-period-lab">to</span><select id="rp-to" class="rp-select">${wopts(to)}</select>`;
  }
  return `<div class="rp-period"><span class="rp-period-lab">Reporting period</span>
    <select id="rp-period" class="rp-select">${opt('all','All weeks')}${opt('latest4','Latest 4 weeks')}${opt('prev4','Previous 4 weeks')}${opt('custom','Custom period…')}</select>${custom}</div>`;
}
function rpWeeklyTable(c, visibleMetrics, weeks, sticky){
  const runMeta = [];
  for(let i=0; i<visibleMetrics.length;){
    const g = metricGroup(visibleMetrics[i]);
    let j = i; while(j<visibleMetrics.length && metricGroup(visibleMetrics[j])===g) j++;
    for(let k=i; k<j; k++) runMeta[k] = {group:g, first:k===i, count:j-i};
    i = j;
  }
  const head = weeks.map(wd=>`<th class="rp-wk"><div>Week ${calcWeekNum(c.startDate, wd)}</div><div class="rp-wk-date">${fmtDate(wd)}</div></th>`).join('');
  const rows = visibleMetrics.map((m, idx)=>{
    const gm = runMeta[idx];
    const cells = weeks.map(wd=>{
      const me = (c.weeklyData[wd].metrics||[]).find(x=>x.id===m.id);
      return `<td>${me ? fmtMetricValue(m, me.actual) : '—'}</td>`;
    }).join('');
    let total;
    if(m.isRatio){ const v = cumulativeConversion(c, m.id); total = v===null ? '—' : v+'%'; }
    else { const est = c.targets && c.targets[m.id]; total = fmtMetricValue(m, cumFor(c, m.id)) + (est ? ` <span class="rp-of">of ${fmtMetricValue(m, est)}</span>` : ''); }
    const side = gm.first ? `<td class="grp-side grp-side-${gm.group}" rowspan="${gm.count}"><span class="rp-grp-label">${rpIcon(GROUP_DEFS[gm.group].icon, 20)}<span>${GROUP_DEFS[gm.group].label}</span></span></td>` : '';
    return `<tr class="grp-${gm.group}${gm.first?' grp-start':''}">${side}<td class="metric-name rp-metric-cell"><span class="rp-mname">${escapeHtml(m.name)}${rpHelp(metricDescription(m))}</span></td>${cells}<td class="total-col rp-total-cell">${total}</td></tr>`;
  }).join('');
  return `<table class="rp-table ${sticky?'rp-stick':''}"><thead><tr><th class="rp-side-th"></th><th class="rp-metric-th">Metric</th>${head}<th class="rp-total-th">Total</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function renderReport(){
  const c = campaigns.find(x=>x.id===currentCampaignId);
  if(!c){ currentView='dashboard'; return renderDashboard(); }
  const pkg = PACKAGES[c.package];
  const weekDates = Object.keys(c.weeklyData).sort().filter(wd=>weekHasData(c.weeklyData[wd]));
  const visibleMetrics = effectiveMetrics(c).filter(m=>c.optionalMetrics[m.id]!==false);
  const totalWeeks = calcTotalWeeks(c.startDate, c.endDate);
  const recorded = weekDates.length;
  const ctx = {recorded, totalWeeks};
  rpKeyOn = c.reportShowKey!==false;
  rpHasWeekly = recorded > 0;

  const ragIds = getRagMetricIds(c.package);
  const primaryTargetId = ragIds.slice().reverse().find(id => c.targets && c.targets[id]);
  const limitLabel = primaryTargetId ? fmtMetricValue(pkg.metrics.find(x=>x.id===primaryTargetId), c.targets[primaryTargetId]) : '';
  const latestNotes = recorded ? String(c.weeklyData[weekDates[recorded-1]].notes||'').trim() : '';

  // ---- Overview tab
  const panels = [rpFunnel(c, visibleMetrics), rpForecast(c, visibleMetrics, ctx)].filter(Boolean);
  const overview = `<div class="rp-shell" id="report-overview-shell">
    ${rpHeader('Campaign Performance')}
    <div class="rp-body">
      ${rpPdfNav('overview')}
      ${rpInfoCard(c, totalWeeks, limitLabel)}
      ${rpTabs('overview')}
      <div class="rp-caption">Performance to date</div>
      <div class="rp-kpis">${pickKpis(c, visibleMetrics).map(m=>rpKpiCard(c, m, ctx)).join('')}</div>
      <div class="rp-two ${panels.length<2?'single':''}">${panels.join('')}</div>
      ${rpInsights(latestNotes)}
    </div>
  </div>`;

  // ---- Weekly Performance tab (every recorded week; scrolls sideways, Metric and Total stay put)
  const shown = rpSelectWeeks(weekDates);
  const weekly = `<div class="rp-shell" id="report-weekly-shell">
    ${rpHeader(c.name, `Weekly breakdown · ${recorded} week${recorded===1?'':'s'} recorded`)}
    <div class="rp-body">
      ${rpTabs('weekly')}
      ${rpInfoStrip(c, totalWeeks, limitLabel)}
      ${recorded ? `<div class="rp-wk-head"><div class="rp-wk-title">${rpIcon('table',20)} Weekly Performance</div>${rpPeriodControls(c, weekDates)}</div>
      <div class="rp-scroll">${rpWeeklyTable(c, visibleMetrics, shown, true)}</div>
      <div class="rp-note">Totals always cover the whole campaign, whichever weeks are shown. Percentage totals are worked out from the campaign totals.</div>`
      : `<div class="rp-empty-big">No weekly figures have been entered yet. Each week appears here once its figures are saved.</div>`}
    </div>
  </div>`;

  // ---- PDF-only pages: every week, split across as many pages as needed so nothing is cut off
  const pages = recorded ? Math.ceil(recorded/5) : 0;
  const baseSize = pages ? Math.floor(recorded/pages) : 0, extraWeeks = pages ? recorded % pages : 0;
  let cut = 0;
  const chunks = Array.from({length:pages}, (_,i)=>{ const size = baseSize + (i<extraWeeks ? 1 : 0); const part = weekDates.slice(cut, cut+size); cut += size; return part; });
  const exportPages = chunks.map((wks, i)=>{
    const sub = pages>1 && wks.length ? `Weekly breakdown · weeks ${calcWeekNum(c.startDate, wks[0])}–${calcWeekNum(c.startDate, wks[wks.length-1])} (page ${i+1} of ${pages})` : `Weekly breakdown · ${recorded} week${recorded===1?'':'s'} recorded`;
    return `<div class="rp-shell rp-wkpage" id="rp-wkpage-${i}">${rpHeader(c.name, sub)}<div class="rp-body">${rpPdfNav('weekly')}${rpInfoStrip(c, totalWeeks, limitLabel)}<div class="rp-wk-head"><div class="rp-wk-title">${rpIcon('table',20)} Weekly Performance</div></div><div class="rp-scroll">${rpWeeklyTable(c, visibleMetrics, wks, false)}</div></div></div>`;
  }).join('');

  return `<div class="wrap rp-wide">
    <button class="rp-exit-fs" data-action="report-exit-fullscreen">✕ Exit full screen</button>
    <div class="top-meta"><div><h1>Report / Export</h1><div class="subtle">${escapeHtml(c.name)}</div></div>
      <button class="btn ghost" data-nav="weekly">← Back to Weekly Entry</button></div>
    <div class="toolbar">
      <label class="check-pill" style="margin-right:auto;"><input type="checkbox" data-action="toggle-report-key" ${c.reportShowKey!==false?'checked':''}> Include key page in the PDF</label>
      <label class="rp-pdfstyle">PDF pages <select id="pdf-style" class="rp-select"><option value="fit" ${c.pdfPageStyle!=='a4'?'selected':''}>Fit to content</option><option value="a4" ${c.pdfPageStyle==='a4'?'selected':''}>A4 landscape</option></select></label>
      <button class="btn secondary" data-action="report-fullscreen">⛶ Full screen</button>
      <button class="btn secondary" data-action="export-pdf">⬇ Download PDF</button>
      <button class="btn secondary" data-action="export-excel">⬇ Download Excel</button>
    </div>
    <div class="rp-root" id="report-root" data-tab="${reportTab}">
      ${overview}
      ${weekly}
      <div class="rp-export-pages" id="rp-export-pages">${exportPages}${c.reportShowKey!==false ? renderReportKey(c, visibleMetrics, recorded) : ''}</div>
    </div>
  </div>`;
}

// One-line, client-facing definition for each standard metric, shown on the report's key page.
// Metrics you add yourself use the description box in setup instead.
const METRIC_DEFS = {
  visits:    'The number of different people who visited the campaign page. Each person is counted once, however many times they return.',
  issued:    'Rewards given out to shoppers.',
  act:       'Rewards shoppers have activated, which makes them ready to use in store.',
  pending:   'Rewards issued but not yet activated (Issued minus Activated).',
  red:       'Rewards used at the till.',
  redval:    'The total £ value of the rewards redeemed.',
  itr:       'Of the rewards issued, the percentage that were redeemed.',
  atr:       'Of the rewards activated, the percentage that were redeemed.',
  rew_iss:   'Rewards given out to shoppers.',
  rew_act:   'Rewards shoppers have activated, which makes them ready to use in store.',
  rew_pend:  'Rewards issued but not yet activated (Issued minus Activated).',
  rew_red:   'Rewards used at the till.',
  app_views: 'The number of times the offer was viewed in the Blue Light Card app.',
  app_codes: 'The number of offer codes given to members through the app.',
};
function metricDescription(m){ return m.custom ? (m.description||'').trim() : (METRIC_DEFS[m.id]||''); }

// Which stage of the journey each standard metric belongs to. Neighbouring rows in the same stage sit
// under one group card on the Weekly Performance table. Metrics you add yourself go under "Other".
const METRIC_GROUPS = {
  app_views:'engagement', app_codes:'engagement', visits:'engagement', issued:'engagement', rew_iss:'engagement',
  act:'activation', rew_act:'activation', pending:'activation', rew_pend:'activation',
  red:'redemption', rew_red:'redemption', redval:'redemption', itr:'redemption', atr:'redemption',
};
const GROUP_DEFS = { engagement:{label:'Engagement', icon:'eye'}, activation:{label:'Activation', icon:'zap'}, redemption:{label:'Redemption', icon:'basket'}, other:{label:'Other', icon:'chart'} };
function metricGroup(m){ return m.custom ? 'other' : (METRIC_GROUPS[m.id] || 'other'); }

// Page 2 of the report. It is built from the same list, in the same order, as the table on page 1
// (visibleMetrics), so it only ever explains what is actually on the report.
function renderReportKey(c, visibleMetrics, recorded){
  const defRows = visibleMetrics.map(m=>{
    const d = metricDescription(m);
    return d ? `<tr><td>${escapeHtml(m.name)}</td><td>${escapeHtml(d)}</td></tr>` : '';
  }).join('');
  const hasTarget = m => !!(c.targets && c.targets[m.id]);
  const anyForecast = recorded>0 && visibleMetrics.some(m=>!m.isRatio && hasTarget(m));
  const statusHtml = anyForecast ? `<div class="key-title" style="margin-top:18px;">Forecast colours</div><dl>
      <dt><span class="key-swatch green"></span>On Track</dt><dd>The forecast is over 75% of estimate, up to 115%.</dd>
      <dt><span class="key-swatch amber"></span>Needs Attention</dt><dd>The forecast is over 50% and up to 75% of estimate, or more than 115% (well ahead of plan, so worth a check).</dd>
      <dt><span class="key-swatch red"></span>Behind Estimate</dt><dd>The forecast is 50% of estimate or less.</dd>
    </dl>` : '';
  return `<div class="rp-shell" id="report-key-page">
    ${rpHeader(c.name, 'Key to the report')}
    ${rpPdfNav('key','rp-pdfnav-key')}
    <div class="key-body ${defRows?'':'single'}">
      ${defRows ? `<div><div class="key-title">What each measure means</div><table class="key-table"><tbody>${defRows}</tbody></table></div>` : ''}
      <div class="key-read"><div class="key-title">Forecast to End</div><p class="key-p">${FORECAST_NOTE}</p>${statusHtml}</div>
    </div>
  </div>`;
}
function formatOfferValue(c){
  if(c.offerType==='fixed' && c.offerValue) return `£${c.offerValue}`;
  if(c.offerType==='pct' && c.offerValue) return `${c.offerValue}% off`;
  return 'No fixed value';
}
// Renders the campaign logo with EXPLICIT width/height (not just CSS) so it keeps its true
// aspect ratio when html2canvas snapshots the page for PDF export — percentage/object-fit
// sizing alone can get stretched by html2canvas.
function renderReportLogoImg(c, maxW, maxH){
  const MAX_W = maxW || 204, MAX_H = maxH || 134;
  if(c.logoW && c.logoH){
    const scale = Math.min(MAX_W/c.logoW, MAX_H/c.logoH, 1);
    const w = Math.round(c.logoW*scale), h = Math.round(c.logoH*scale);
    return `<img class="report-logo-img" src="${c.logo}" width="${w}" height="${h}">`;
  }
  // Dimensions not captured yet (e.g. a campaign saved before this fix) — fall back to
  // CSS sizing for now, and quietly measure + persist so it's exact from here on.
  ensureLogoDimensions(c);
  return `<img class="report-logo-img report-logo-img-fallback" src="${c.logo}">`;
}
function ensureLogoDimensions(c){
  if(c.logoW && c.logoH || !c.logo || c._measuringLogo) return;
  c._measuringLogo = true;
  const img = new Image();
  img.onload = () => {
    c.logoW = img.naturalWidth; c.logoH = img.naturalHeight; c._measuringLogo = false;
    persistCampaigns();
    if(currentView==='report') render();
  };
  img.src = c.logo;
}

// ================= HISTORY (chart-only trend view) =================
function renderHistory(){
  const c = campaigns.find(x=>x.id===currentCampaignId);
  if(!c){ currentView='dashboard'; return renderDashboard(); }
  const weekDates = Object.keys(c.weeklyData).sort();
  return `<div class="wrap">
    <div class="top-meta"><div><h1>History</h1><div class="subtle">${escapeHtml(c.name)} · week-by-week performance vs estimate</div></div>
      <button class="btn ghost" data-nav="weekly">← Back to Weekly Entry</button></div>
    ${weekDates.length
      ? `<div class="hist-card-grid">${buildHistoryCards(c, weekDates)}</div>`
      : `<div class="banner teal">No weeks saved yet — save a week to start building this view.</div>`}
  </div>`;
}
// Per-metric weekly-RAG history cards: latest % of weekly estimate, a wk-on-wk delta, and a
// segmented bar coloured by each week's RAG status against its weekly estimate.
function buildHistoryCards(c, weekDates){
  const pkg = PACKAGES[c.package];
  const totalWeeks = calcTotalWeeks(c.startDate, c.endDate);
  const metrics = effectiveMetrics(c).filter(m=>c.optionalMetrics[m.id]!==false);
  if(!metrics.length) return `<div class="banner teal" style="grid-column:1/-1;">No metrics to show yet.</div>`;

  return metrics.map(m=>{
    const hasTarget = !m.isRatio && c.targets && c.targets[m.id];

    // Raw actuals for every week, used either way (as the %-basis or as the headline value itself).
    const actuals = weekDates.map(wd=>{
      const me = (c.weeklyData[wd].metrics||[]).find(x=>x.id===m.id);
      return me ? Number(me.actual)||0 : 0;
    });

    let headline, subLabel, delta, segments;

    if(hasTarget){
      // Tracked metric: % of weekly estimate, coloured by RAG status per week.
      const weeklyTarget = c.targets[m.id]/totalWeeks;
      const weekPcts = actuals.map(a => weeklyTarget ? Math.round((a/weeklyTarget)*100) : 0);
      headline = `${weekPcts[weekPcts.length-1]}%`;
      subLabel = '% of weekly estimate';
      const prevPct = weekPcts.length>1 ? weekPcts[weekPcts.length-2] : null;
      delta = prevPct!==null ? {value: weekPcts[weekPcts.length-1]-prevPct, unit:'pp'} : null;
      segments = actuals.map(a => `<div class="hist-segment ${ragStatus(a, weeklyTarget) || 'neutral'}" style="height:100%;"></div>`).join('');
    } else if(m.isRatio){
      // Ratio metric: the actual value already is a %, so use it directly — no target to colour against.
      headline = `${fmtNum(actuals[actuals.length-1])}%`;
      subLabel = 'weekly value';
      const prev = actuals.length>1 ? actuals[actuals.length-2] : null;
      delta = prev!==null ? {value: Math.round((actuals[actuals.length-1]-prev)*10)/10, unit:'pp'} : null;
      const maxVal = Math.max(1, ...actuals);
      segments = actuals.map(a => `<div class="hist-segment brand" style="height:${Math.max(10, Math.round((a/maxVal)*100))}%;"></div>`).join('');
    } else {
      // No estimate set: show the raw weekly actuals as a simple magnitude sparkline.
      headline = fmtMetricValue(m, actuals[actuals.length-1]);
      subLabel = 'weekly actual (no estimate set)';
      const prev = actuals.length>1 ? actuals[actuals.length-2] : null;
      delta = prev!==null ? {value: actuals[actuals.length-1]-prev, unit:''} : null;
      const maxVal = Math.max(1, ...actuals);
      segments = actuals.map(a => `<div class="hist-segment brand" style="height:${Math.max(10, Math.round((a/maxVal)*100))}%;"></div>`).join('');
    }

    const weekLabels = weekDates.map(wd=>`<div class="hist-week-label">${wd}</div>`).join('');
    const deltaHtml = delta ? ` <span class="hist-delta ${delta.value>=0?'up':'down'}">${delta.value>=0?'▲':'▼'} ${fmtNum(Math.abs(delta.value))}${delta.unit}</span>` : '';

    return `<div class="hist-card">
      <div class="hist-card-top">
        <div class="hist-name">${m.name}</div>
        <div class="hist-pct">${headline}</div>
      </div>
      <div class="hist-sub">${subLabel}${deltaHtml}</div>
      <div class="hist-bar">${segments}</div>
      <div class="hist-week-labels">${weekLabels}</div>
    </div>`;
  }).join('');
}

// Core pipeline stages per package, used for the week-by-week chart on the report.
function pipelineStagesFor(pkgKey){
  if(pkgKey==='basic') return [{id:'act',label:'Activated',color:SAVI_BLUE},{id:'red',label:'Redeemed',color:SAVI_LIGHT_GREEN}];
  if(pkgKey==='intermediate') return [{id:'issued',label:'Issued',color:SAVI_GREEN},{id:'act',label:'Activated',color:SAVI_BLUE},{id:'red',label:'Redeemed',color:SAVI_LIGHT_GREEN}];
  return [{id:'rew_iss',label:'Rewards Issued',color:SAVI_GREEN},{id:'rew_act',label:'Rewards Activated',color:SAVI_BLUE},{id:'rew_red',label:'Rewards Redeemed',color:SAVI_LIGHT_GREEN}];
}
function buildWeeklyChartSVG(c, weekDates){
  const pkg = PACKAGES[c.package];
  const stages = pipelineStagesFor(c.package).filter(s=>c.optionalMetrics[s.id]!==false);
  if(!stages.length || !weekDates.length) return '';
  const series = stages.map(s=>({
    ...s,
    values: weekDates.map(wd=>{
      const me = (c.weeklyData[wd].metrics||[]).find(x=>x.id===s.id);
      return me ? Number(me.actual)||0 : 0;
    })
  }));

  const W=640, H=260, padL=8, padR=8, padT=10, padB=28;
  const plotW = W-padL-padR, plotH = H-padT-padB;
  const maxVal = Math.max(1, ...series.flatMap(s=>s.values));
  // Single points sit centred; with 2+ weeks they're evenly spaced across the plot width.
  const xFor = wi => weekDates.length>1 ? padL + (wi/(weekDates.length-1))*plotW : padL + plotW/2;
  const yFor = val => padT + plotH - (val/maxVal)*plotH;

  let lines = '', dots = '';
  series.forEach(s=>{
    const pts = s.values.map((v,wi)=>`${xFor(wi).toFixed(1)},${yFor(v).toFixed(1)}`).join(' ');
    lines += `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"></polyline>`;
    s.values.forEach((v,wi)=>{
      dots += `<circle cx="${xFor(wi).toFixed(1)}" cy="${yFor(v).toFixed(1)}" r="3.4" fill="${s.color}"></circle>`;
    });
  });
  let labels = '';
  weekDates.forEach((wd,wi)=>{
    labels += `<text x="${xFor(wi).toFixed(1)}" y="${H-8}" font-size="11" fill="#8b9997" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">Wk ${c.weeklyData[wd].weekNum}</text>`;
  });
  const baseline = `<line x1="${padL}" y1="${padT+plotH}" x2="${W-padR}" y2="${padT+plotH}" stroke="#dde2df" stroke-width="1"></line>`;

  const legend = series.map(s=>`<span class="wc-legend-item"><span class="wc-swatch" style="background:${s.color};"></span>${s.label}</span>`).join('');

  return `<div class="week-chart">
    <div class="wc-legend">${legend}</div>
    <svg viewBox="0 0 ${W} ${H}" class="week-chart-svg" preserveAspectRatio="xMidYMid meet">${baseline}${lines}${dots}${labels}</svg>
  </div>`;
}

async function exportPDF(){
  const c = campaigns.find(x=>x.id===currentCampaignId);
  if(!c) return;
  const overviewEl = document.getElementById('report-overview-shell');
  if(!overviewEl || !window.html2canvas || !window.jspdf){ showToast('PDF library not available'); return; }
  showToast('Preparing PDF…');
  // Pages, in order: Overview, then every week (split across as many pages as needed), then the key.
  const elements = [overviewEl, ...document.querySelectorAll('#rp-export-pages .rp-wkpage')];
  const keyEl = document.getElementById('report-key-page');
  if(keyEl) elements.push(keyEl);
  // Where each tab / "?" button sits inside the page it is drawn on (measured in the capture copy, which is
  // exactly what gets photographed), so a clickable area can be laid over it in the PDF. The capture copy also
  // shows every page (the tab you are looking at hides the others) at one fixed width.
  const linkMap = {}, baseW = {};
  const snap = (el)=> window.html2canvas(el, {scale:2.5, backgroundColor:'#ffffff', useCORS:true, windowWidth:1700,
    onclone:(cloned)=>{
      const r = cloned.getElementById('report-root'); if(r) r.classList.add('rp-export');
      if(cloned.body) cloned.body.classList.add('rp-exporting');
      const t = cloned.getElementById(el.id);
      if(t){
        const b = t.getBoundingClientRect();
        baseW[el.id] = b.width;
        linkMap[el.id] = [...t.querySelectorAll('[data-pdf-link]')].map(n=>{ const q = n.getBoundingClientRect();
          return {x:q.left-b.left, y:q.top-b.top, w:q.width, h:q.height, to:n.getAttribute('data-pdf-link')}; });
      }
    }});
  const nWeekly = document.querySelectorAll('#rp-export-pages .rp-wkpage').length;
  const pageFor = { overview:1, weekly: nWeekly ? 2 : null, key: keyEl ? 2 + nWeekly : null };

  const { jsPDF } = window.jspdf;
  const A4W = 841.89, A4H = 595.28;
  const fitToContent = c.pdfPageStyle !== 'a4';   // default: every page is exactly as tall as its content
  let doc = null;
  try{
    for(const el of elements){
      const canvas = await snap(el);
      let ph, x0, y0, w, h;
      const pw = A4W;
      if(fitToContent){
        // A4-landscape width, height to suit the content: no empty band at the bottom of any page.
        const m = 14;
        w = pw - m*2; h = (canvas.height * w) / canvas.width;
        ph = h + m*2; x0 = m; y0 = m;
      } else {
        // Standard A4 landscape pages (for printing): scaled to fit and centred.
        const m = 18, usableW = pw - m*2, usableH = A4H - m*2;
        ph = A4H; w = usableW; h = (canvas.height * w) / canvas.width;
        if(h > usableH){ h = usableH; w = (canvas.width * h) / canvas.height; }
        x0 = m + (usableW - w)/2; y0 = m + (usableH - h)/2;
      }
      const orient = pw >= ph ? 'l' : 'p';
      if(!doc) doc = new jsPDF({orientation:orient, unit:'pt', format:[pw, ph]});
      else doc.addPage([pw, ph], orient);
      doc.addImage(canvas.toDataURL('image/png'), 'PNG', x0, y0, w, h);
      // Clickable areas over the tabs and ? buttons (a little larger than the button itself, so they are easy to hit).
      const f = baseW[el.id] ? w / baseW[el.id] : 0, pad = 4;
      if(f) (linkMap[el.id]||[]).forEach(L=>{
        const pg = pageFor[L.to];
        if(pg) doc.link(x0 + (L.x - pad)*f, y0 + (L.y - pad)*f, (L.w + pad*2)*f, (L.h + pad*2)*f, {pageNumber: pg});
      });
    }
  }catch(e){ showToast('Could not generate PDF'); return; }
  doc.save(`${c.name.replace(/[^a-z0-9]+/gi,'_')}_Campaign_Performance_Report.pdf`);
  showToast('PDF downloaded');
}

// ---------- Excel styling helpers ----------
// Column widths and number formats are core, well-supported XLSX features. Bold/coloured
// header cells are a nice-to-have on top — most spreadsheet apps render them fine, but it
// depends on exactly which build of the export library is available at runtime, so treat
// them as a bonus rather than something to rely on.
const XLSX_HEADER_STYLE = { font:{bold:true, color:{rgb:'FFFFFF'}}, fill:{fgColor:{rgb:'224B50'}} };
const XLSX_LABEL_STYLE = { font:{bold:true} };
const XLSX_CURRENCY_FMT = '"£"#,##0.00';
const XLSX_PCT_FMT = '0.0"%"';
function xlsxSetCols(ws, widths){ ws['!cols'] = widths.map(w=>({wch:w})); }
function xlsxStyleCell(ws, r, c, style){
  const addr = XLSX.utils.encode_cell({r,c});
  if(!ws[addr]) return;
  ws[addr].s = Object.assign({}, ws[addr].s, style);
}
function xlsxStyleRow(ws, r, numCols, style){
  for(let c=0;c<numCols;c++) xlsxStyleCell(ws, r, c, style);
}
function xlsxSetFormat(ws, r, c, fmt){
  const addr = XLSX.utils.encode_cell({r,c});
  if(ws[addr] && typeof ws[addr].v === 'number') ws[addr].z = fmt;
}

function exportExcel(){
  const c = campaigns.find(x=>x.id===currentCampaignId);
  if(!c || !window.XLSX){ showToast('Excel library not available'); return; }
  const pkg = PACKAGES[c.package];
  const wb = XLSX.utils.book_new();
  const metricsList = effectiveMetrics(c);

  // Sheet 1: Campaign summary and all metrics
  const summary = [
    ['Campaign', c.name],['Client', c.client],['Dynamics Ref', c.dynamics],
    ['Package', pkg.label],['Region', regionLabel(c.region)],
    ['Start Date', c.startDate],['End Date', c.endDate],
    ['Total Weeks', calcTotalWeeks(c.startDate,c.endDate)],
    ['Objective', c.objective],[],
    ['Metric Name','Entry Type','Overall Estimate']
  ];
  const metricHeaderRow = summary.length - 1;
  metricsList.forEach(m=> summary.push([m.name, m.entry==='auto'?'Calculated':m.entry==='auto-or-manual'?'Auto or manual':'Manual', c.targets[m.id] ?? '']));
  const wsSummary = XLSX.utils.aoa_to_sheet(summary);
  xlsxSetCols(wsSummary, [24, 20, 16]);
  for(let r=0;r<metricHeaderRow-1;r++) xlsxStyleCell(wsSummary, r, 0, XLSX_LABEL_STYLE);
  xlsxStyleRow(wsSummary, metricHeaderRow, 3, XLSX_HEADER_STYLE);
  metricsList.forEach((m,i)=>{ if(m.isCurrency) xlsxSetFormat(wsSummary, metricHeaderRow+1+i, 2, XLSX_CURRENCY_FMT); });
  XLSX.utils.book_append_sheet(wb, wsSummary, 'Summary');

  // Sheet 2: Weekly data by week
  const weekDates = Object.keys(c.weeklyData).sort();
  const weekHeader = ['Metric', ...weekDates.map(wd=>'Wk '+c.weeklyData[wd].weekNum+' ('+wd+')')];
  const weekRows = [weekHeader];
  metricsList.forEach(m=>{
    const row = [m.name];
    weekDates.forEach(wd=>{
      const me = (c.weeklyData[wd].metrics||[]).find(x=>x.id===m.id);
      row.push(me ? me.actual : '');
    });
    weekRows.push(row);
  });
  const wsWeekly = XLSX.utils.aoa_to_sheet(weekRows);
  xlsxSetCols(wsWeekly, [26, ...weekDates.map(()=>14)]);
  xlsxStyleRow(wsWeekly, 0, weekHeader.length, XLSX_HEADER_STYLE);
  metricsList.forEach((m,i)=>{
    weekDates.forEach((wd,wi)=>{
      if(m.isCurrency) xlsxSetFormat(wsWeekly, i+1, wi+1, XLSX_CURRENCY_FMT);
      else if(m.isRatio) xlsxSetFormat(wsWeekly, i+1, wi+1, XLSX_PCT_FMT);
    });
  });
  XLSX.utils.book_append_sheet(wb, wsWeekly, 'Weekly Data');

  // Sheet 3: Overall targets vs actuals
  const totalWeeks = calcTotalWeeks(c.startDate,c.endDate);
  const tHeader = ['Metric','Overall Estimate','Weekly Estimate','Cumulative Actual','Forecast to Completion'];
  const tRows = [tHeader];
  const recorded = weeksRecorded(c);
  metricsList.forEach(m=>{
    const target = c.targets[m.id]||'';
    const weekly = target ? target/totalWeeks : '';
    const cumul = calcCumulativeFromHistory(c, m.id, '9999-99-99', 0);
    let forecast = '';
    if(recorded>0 && target && !m.isRatio){
      const avg = cumul/recorded;
      forecast = cumul + avg*(totalWeeks-recorded);
    }
    tRows.push([m.name, target, weekly, m.isRatio?'n/a':cumul, forecast]);
  });
  const wsTargets = XLSX.utils.aoa_to_sheet(tRows);
  xlsxSetCols(wsTargets, [26, 16, 16, 18, 20]);
  xlsxStyleRow(wsTargets, 0, tHeader.length, XLSX_HEADER_STYLE);
  metricsList.forEach((m,i)=>{
    if(!m.isCurrency) return;
    const r = i+1;
    [1,2,3,4].forEach(col=>xlsxSetFormat(wsTargets, r, col, XLSX_CURRENCY_FMT));
  });
  XLSX.utils.book_append_sheet(wb, wsTargets, 'Estimates vs Actuals');

  XLSX.writeFile(wb, `${c.name.replace(/[^a-z0-9]+/gi,'_')}_Campaign_Performance_Report.xlsx`);
  showToast('Excel file downloaded');
}

function attachHandlers(){
  const app = document.getElementById('app');

  app.querySelectorAll('[data-nav]').forEach(el=>el.addEventListener('click', ()=>{
    currentView = el.getAttribute('data-nav');
    render();
  }));

  app.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click', async ()=>{
    currentCampaignId = el.getAttribute('data-open');
    currentWeekDate = null;
    await enterWeeklyView(currentCampaignId);
  }));

  // Campaign tabs (Overview / Enter Week / History / Report) on every campaign screen
  app.querySelectorAll('[data-ctab]').forEach(el=>el.addEventListener('click', async ()=>{
    const t = el.getAttribute('data-ctab');
    if(t==='weekly'){
      if(currentView==='weekly') return;
      await enterWeeklyView(currentCampaignId);
      return;
    }
    if(currentView==='weekly'){
      // keep anything typed but not yet saved, so it's still there when you come back
      await saveDraft(currentCampaignId, {weekDate:currentWeekDate, values:weekInputs, retailerValues:retailerInputs, notes:weekNotes});
    }

  }));

    currentCampaignId = el.getAttribute('data-view-overview');
    currentView = 'overview';
    render();
  }));

  app.querySelectorAll('[data-select-campaign]').forEach(el=>el.addEventListener('click', async ()=>{
    currentCampaignId = el.getAttribute('data-select-campaign');
    currentWeekDate = null;
    await enterWeeklyView(currentCampaignId);
  }));

  app.querySelectorAll('[data-shortcut]').forEach(el=>el.addEventListener('click', async ()=>{
    const which = el.getAttribute('data-shortcut');
    if(!currentCampaignId && campaigns.length) currentCampaignId = campaigns[0].id;
    if(!currentCampaignId) return; // nothing to show yet
    if(which==='weekly'){ await enterWeeklyView(currentCampaignId); }
    else if(which==='history'){ currentView = 'history'; render(); }
    else { currentView = 'report'; render(); }
  }));

  app.querySelectorAll('[data-action="new-campaign"]').forEach(el=>el.addEventListener('click', ()=>{
    setupDraft = blankCampaign();

  }));

  // Campaign Overview: archive / delete

  if(ovArchive) ovArchive.addEventListener('click', async ()=>{
    const target = campaigns.find(x=>x.id===currentCampaignId);
    if(!target) return;
    target.archived = !target.archived;
    await persistCampaigns();
    render();
    showToast(target.archived ? 'Campaign archived' : 'Campaign unarchived');
  });
  const ovDelete = app.querySelector('[data-action="overview-delete"]');
  if(ovDelete) ovDelete.addEventListener('click', ()=>{
    const target = campaigns.find(x=>x.id===currentCampaignId);
    if(!target) return;
    const id = target.id;
    confirmModal = {
      title:'Delete this campaign?',
      body:`"${escapeHtml(target.name||'This campaign')}" and all of its weekly data will be permanently removed. This can't be undone.`,
      confirmLabel:'Delete',
      onConfirm: async ()=>{
        campaigns = campaigns.filter(x=>x.id!==id);
        currentCampaignId = null;
        await persistCampaigns();
        confirmModal = null; currentView = 'dashboard'; render();
        showToast('Campaign deleted');
      }
    };
    render();
  });

  // Dashboard quick edit
  app.querySelectorAll('[data-quick-edit]').forEach(el=>el.addEventListener('click', (ev)=>{
    ev.stopPropagation();
    const c = campaigns.find(x=>x.id===el.getAttribute('data-quick-edit'));
    if(!c) return;
    quickEdit = {id:c.id, cdOwner:c.cdOwner||'', stage:stageOf(c), startDate:c.startDate||'', endDate:c.endDate||''};

  }));

    [['qe-owner','cdOwner'],['qe-stage','stage'],['qe-start','startDate'],['qe-end','endDate']].forEach(([id,key])=>{
      const el = app.querySelector('#'+id);
      if(!el) return;
      const sync = ()=>{ quickEdit[key] = el.value; };
      el.addEventListener('input', sync); el.addEventListener('change', sync);
    });

  const qeSave = app.querySelector('[data-action="qe-save"]');
  if(qeSave) qeSave.addEventListener('click', async ()=>{

    if(!c){ quickEdit = null; render(); return; }

    if(new Date(quickEdit.endDate) <= new Date(quickEdit.startDate)){ showToast('End date must be after start date'); return; }

    c.cdOwner = quickEdit.cdOwner;
    c.workflowStage = quickEdit.stage;
    c.startDate = quickEdit.startDate; c.endDate = quickEdit.endDate;
    if(datesChanged) Object.keys(c.weeklyData||{}).forEach(wd=>{ c.weeklyData[wd].weekNum = calcWeekNum(c.startDate, wd); });

    quickEdit = null; render();

  const cdOwnerFilterEl = app.querySelector('#dash-cdowner-filter');
  if(cdOwnerFilterEl) cdOwnerFilterEl.addEventListener('change', ()=>{
    dashboardCdOwnerFilter = cdOwnerFilterEl.value;
    render();
  });

  const exportBtn = app.querySelector('[data-action="export-data"]');
  if(exportBtn) exportBtn.addEventListener('click', ()=>{
    const blob = new Blob([JSON.stringify(campaigns, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `savi-campaign-performance-backup-${todayISO()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    showToast('Backup downloaded');
  });
  const importBtn = app.querySelector('[data-action="import-data"]');
  const importInput = app.querySelector('#import-data-input');
  if(importBtn && importInput) importBtn.addEventListener('click', ()=> importInput.click());
  if(importInput) importInput.addEventListener('change', ()=>{
    const file = importInput.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = async ()=>{
      let incoming;
      try{ incoming = JSON.parse(reader.result); }

        onConfirm: async ()=>{
          campaigns = campaigns.concat(toAdd);
          await persistCampaigns();
          confirmModal=null; render();
          showToast(`Restored ${toAdd.length} campaign${toAdd.length===1?'':'s'}`);
