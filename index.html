    roiBlock = `<div class="section-title">ROI</div>
    <div class="banner teal"><span>ℹ</span><div>UK &amp; ROI is enabled for this campaign. Separate ROI-only figures are a planned future enhancement (Section 11) — for now, ROI activity is included in the UK totals above.</div></div>`;
  }

  const overallStats = renderOverallStatsTable(c, totalWeeks);

  return `<div class="wrap">
    <div class="top-meta">
      <div class="titleblock">
        <div class="client">${escapeHtml(c.client)} · ${pkg.label}${c.cdOwner?' · '+ownerAvatar(c.cdOwner,true)+' '+escapeHtml(CD_OWNERS[c.cdOwner]||c.cdOwner):''}</div>
        <h1>${escapeHtml(c.name)} <span class="status-pill ${campaignStatus(c).key}" style="vertical-align:middle;margin-left:8px;">${campaignStatus(c).label}</span></h1>
        <div class="subtle">${fmtDate(c.startDate)} – ${fmtDate(c.endDate)}</div>

    <div class="week-controls">
      <div class="field"><label>Week Commencing (Monday)</label><input type="date" id="f-weekdate" value="${currentWeekDate}" min="${c.startDate}" max="${c.endDate}"></div>

function renderOverallStatsTable(c, totalWeeks){
  const pkg = PACKAGES[c.package];
  const recorded = weeksRecorded(c);
  const rows = effectiveMetrics(c).filter(m=>c.optionalMetrics[m.id]!==false).map(m=>{
    const target = c.targets ? c.targets[m.id] : null;
    const weeklyTarget = target ? target/totalWeeks : null;
    const cumul = calcCumulativeFromHistory(c, m.id, '9999-99-99', 0);
    let forecastCell = '<span class="muted">—</span>';
    if(recorded>0){
      if(m.isRatio){
        forecastCell = '<span class="muted">See weekly RAG</span>';
      } else if(target){
        const avg = cumul/recorded;
        const forecast = cumul + avg*(totalWeeks-recorded);
        const pctOfTarget = Math.round((forecast/target)*1000)/10;
        const variance = forecast-target;
        const varSign = variance>=0?'+':'-';
        forecastCell = `${fmtMetricValue(m, forecast)} <span class="muted">(${pctOfTarget}% · ${varSign}${fmtMetricValue(m, Math.abs(variance))})</span>`;
      } else {
        forecastCell = '<span class="muted">No estimate set</span>';
      }
    }
    return `<tr>
      <td><span class="metric-name">${m.name}</span></td>
      <td>${target ? fmtMetricValue(m, target) : '<span class="muted">—</span>'}</td>
      <td>${target ? fmtMetricValue(m, target/totalWeeks)+'/wk' : '<span class="muted">—</span>'}</td>
      <td class="${(m.isRatio || !target) ? 'forecast-na' : ''}">${forecastCell}</td>
      <td>${m.isRatio ? '<span class="muted">n/a</span>' : fmtMetricValue(m, cumul)}</td>
    </tr>`;
  }).join('');
  const table = `<table class="data-table"><thead><tr><th>Metric</th><th>Overall Estimate</th><th>Weekly Estimate</th><th>Forecast to Completion</th><th>Cumulative</th></tr></thead><tbody>${rows}</tbody></table>`;

  // Attainment bar for the primary RAG-tracked metric that has a target set — mirrors a
  // "cap vs actual" style progress indicator for the campaign's headline redemption metric.
  const ragIds = getRagMetricIds(c.package);
  const primaryId = ragIds.slice().reverse().find(id => c.targets && c.targets[id]); // prefer redeemed over activated
  let capBar = '';
  if(primaryId){
    const mdef = pkg.metrics.find(x=>x.id===primaryId);
    const target = c.targets[primaryId];
    const cumul = calcCumulativeFromHistory(c, primaryId, '9999-99-99', 0);
    const pct = Math.max(0, Math.min(100, Math.round((cumul/target)*100)));
    capBar = `<div style="margin-bottom:16px;">
      <div class="cap-row"><span>${mdef.name} vs estimate</span><span class="cap-figure">${fmtMetricValue(mdef,cumul)} of ${fmtMetricValue(mdef,target)} (${pct}%)</span></div>
      <div class="cap-track"><div class="cap-fill" style="width:${pct}%;"></div></div>
    </div>`;
  }

  return `${capBar}${table}`;
}

// ================= ANALYSIS (post-save RAG) =================
const ACTION_SUGGESTIONS = {
  red: (name)=> `${name} is significantly behind weekly estimate (0–50%). Consider a targeted push: refresh creative, extend visibility on high-traffic placements, and check for redemption friction (barcode/app issues, expiry confusion).`,
  amber_low: (name)=> `${name} is below pace (51–75%). Recommend a check-in with the retailer/media partner and a light-touch reminder push to shoppers who activated but haven't redeemed.`,
  amber_high: (name)=> `${name} is running well ahead of weekly estimate (116%+). Worth investigating — confirm data is accurate, offer value isn't being misapplied, and stock/fulfilment can support the pace.`,
};
function renderAnalysis(){
  const c = campaigns.find(x=>x.id===currentCampaignId);
  if(!c || !lastSavedRag){ currentView='weekly'; return renderWeeklyEntry(); }
  const tableRows = lastSavedRag.map(r=>{
    const st = r.status || 'green';
    return `<tr>
      <td class="metric-name">${r.name}</td>
      <td>${fmtNum(r.actual)}</td>
      <td>${r.weeklyTarget ? fmtNum(r.weeklyTarget)+'/wk' : '<span class="muted">—</span>'}</td>
      <td>${r.pct!==null ? r.pct+'%' : '<span class="muted">—</span>'}</td>
      <td><span class="rag-badge ${st}">${ragLabel(st)}</span></td>
    </tr>`;
  }).join('');
  const items = lastSavedRag.filter(r=>r.status && r.status!=='green').map(r=>{
    let text;
    if(r.status==='red') text = ACTION_SUGGESTIONS.red(r.name);
    else if(r.pct>=116) text = ACTION_SUGGESTIONS.amber_high(r.name);
    else text = ACTION_SUGGESTIONS.amber_low(r.name);
    return `<div class="analysis-item"><h3>${r.name} <span class="rag-badge ${r.status}">${ragLabel(r.status)}</span></h3><p>${text}</p></div>`;
  }).join('');
  return `<div class="wrap-narrow">
    <div class="top-meta"><div><h1>Analysis</h1><div class="subtle">${escapeHtml(c.name)} · Week ${calcWeekNum(c.startDate,currentWeekDate)}</div></div>

    <div class="section-title">This week's RAG status</div>
    <table class="data-table"><thead><tr><th>Metric</th><th>Actual</th><th>Wk Estimate</th><th>% of Estimate</th><th>RAG</th></tr></thead><tbody>${tableRows}</tbody></table>

    <div class="section-title">Suggested actions</div>
    ${items || '<div class="banner teal">All tracked metrics are green this week — nothing needs action.</div>'}
    <div class="form-actions"><div></div><div class="right"><button class="btn secondary" data-nav="report">View Report</button></div></div>
  </div>`;
}

const METRIC_ICONS = { app_views:'eye', app_codes:'ticket', visits:'users', issued:'gift', rew_iss:'gift', act:'zap', rew_act:'zap', pending:'clock', rew_pend:'clock', red:'basket', rew_red:'basket', redval:'pound', itr:'swap', atr:'swap' };
function metricIcon(m){ return rpIcon(m.custom ? 'chart' : (METRIC_ICONS[m.id]||'chart'), 16); }
function fmtShortDay(d){ return new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short'}); }

function cumFor(c, id){ return calcCumulativeFromHistory(c, id, '9999-99-99', 0); }
// Campaign-to-date conversion uses the same ratio() rule as the weekly figures, applied to the campaign
// totals — never an average of the weekly percentages.
const CONVERSION_PARTS = {
  basic:        { atr:['red','act'] },
  intermediate: { itr:['red','issued'], atr:['red','act'] },
  bluelight:    { itr:['red','issued'], atr:['red','act'] },
  advanced:     { itr:['rew_red','rew_iss'], atr:['rew_red','rew_act'] },
};
function cumulativeConversion(c, id){
  const parts = (CONVERSION_PARTS[c.package]||{})[id];
  if(!parts) return null;
  const den = cumFor(c, parts[1]);
  if(!den) return null;
  return ratio(cumFor(c, parts[0]), den);
}
// Same forecast rule as before: total so far + average week x weeks still to run.
function forecastFor(c, m, recorded, totalWeeks){
  const target = c.targets && c.targets[m.id];
  if(!target || m.isRatio || recorded===0) return null;
  const cumul = cumFor(c, m.id);
  return cumul + (cumul/recorded)*(totalWeeks-recorded);
}

  return `<div class="rp-strip"><div class="rp-strip-facts">

    ${item('calendar','Dates', `${fmtDateRangeShort(c.startDate, c.endDate)}<div class="rp-strip-sub">(${totalWeeks} weeks)</div>`)}
    ${limitLabel ? item('layers','Limits', limitLabel) : ''}
    ${item('tag','Offer value', escapeHtml(formatOfferValue(c)))}
  </div>${c.logo ? `<div class="rp-strip-img">${renderReportLogoImg(c, 190, 84)}</div>` : ''}</div>`;
}

function rpKpiCard(c, m, ctx){
  if(m.isRatio){
    const v = cumulativeConversion(c, m.id);
    return `<div class="rp-kpi"><div class="rp-kpi-top"><span class="rp-kpi-ico">${metricIcon(m)}</span><span class="rp-kpi-name">${escapeHtml(m.name)}${rpHelp()}</span></div>
      <div class="rp-kpi-val">${v===null ? '—' : v+'%'}</div><div class="rp-kpi-sub">Current conversion</div></div>`;
  }
  const cum = cumFor(c, m.id);
  const target = c.targets && c.targets[m.id];
  let pill = '', sub = 'Total to date', bar = '';
  if(target){
    const pct = Math.round(cum/target*1000)/10;
    const st = ctx.recorded>0 ? (forecastRagForMetric(c, m.id) || 'neutral') : 'neutral';
    pill = `<span class="rp-pill ${st}" title="Share of the estimate reached so far">${pct}%</span>`;
    sub = `${fmtMetricValue(m, target)} estimate`;
    bar = `<div class="rp-bar"><div class="rp-bar-fill ${st}" style="width:${Math.min(100, Math.max(0, pct))}%;"></div></div>`;
  }
  return `<div class="rp-kpi"><div class="rp-kpi-top"><span class="rp-kpi-ico">${metricIcon(m)}</span><span class="rp-kpi-name">${escapeHtml(m.name)}${rpHelp()}</span>${pill}</div>
    <div class="rp-kpi-val">${fmtMetricValue(m, cum)}</div><div class="rp-kpi-sub">${sub}</div>${bar}</div>`;
}

// Whole-journey view: every step of the funnel that is on the report, with the share that moved on.
function rpFunnel(c, visibleMetrics){
  const stages = visibleMetrics.filter(m=>FUNNEL_IDS.includes(m.id)).map(m=>({m, v:cumFor(c, m.id)}));
  if(stages.length < 2) return '';
  const max = Math.max(...stages.map(s=>s.v), 1);
  const rows = stages.map((s,i)=>{
    const w = s.v>0 ? Math.max(2, Math.round(s.v/max*100)) : 0;
    const prev = i>0 ? stages[i-1].v : 0;
    const step = (i>0 && prev>0 && s.v<=prev) ? `<div class="rp-fn-step">↓ ${ratio(s.v, prev)}%</div>` : '';
    return `${step}<div class="rp-fn-row"><span class="rp-fn-ico">${metricIcon(s.m)}</span><span class="rp-fn-name">${escapeHtml(s.m.name)}${rpHelp()}</span><div class="rp-fn-track"><div class="rp-fn-fill" style="width:${w}%;"></div></div><span class="rp-fn-val">${fmtMetricValue(s.m, s.v)}</span></div>`;
  }).join('');
  const redval = visibleMetrics.find(m=>m.id==='redval');
  const valueLine = redval ? `<div class="rp-fn-total">${rpIcon('pound',16)} Value redeemed to date: <strong>${fmtMetricValue(redval, cumFor(c,'redval'))}</strong></div>` : '';
  return `<div class="rp-panel"><div class="rp-panel-title">${rpIcon('filter',20)} Campaign Funnel</div>
    <div class="rp-panel-sub">Totals to date at each step. Arrows show the share that moved on from the step above.</div>${rows}${valueLine}</div>`;
}

function rpForecast(c, visibleMetrics, ctx){
  const items = visibleMetrics.filter(m=>!m.isRatio && c.targets && c.targets[m.id]);
  let body;
  if(!items.length){
    body = `<div class="rp-empty">No estimates have been set, so there is no forecast to show.</div>`;
  } else {
    body = items.map(m=>{
      const target = c.targets[m.id];
      const f = forecastFor(c, m, ctx.recorded, ctx.totalWeeks);
      if(f===null){
        return `<div class="rp-fc-row"><div class="rp-fc-name">${escapeHtml(m.name)}${rpHelp()}</div><div class="rp-fc-mid"><div class="rp-fc-text">Forecast — / Estimate ${fmtMetricValue(m, target)}</div><div class="rp-bar"><div class="rp-bar-fill neutral" style="width:0%;"></div></div></div><span class="rp-pill neutral">—</span></div>`;
      }
      const pct = Math.round(f/target*1000)/10;
      const st = forecastRagForMetric(c, m.id) || 'neutral';
      return `<div class="rp-fc-row"><div class="rp-fc-name">${escapeHtml(m.name)}${rpHelp()}</div><div class="rp-fc-mid"><div class="rp-fc-text">Forecast <strong>${fmtMetricValue(m, Math.round(f))}</strong> / Estimate ${fmtMetricValue(m, target)}</div><div class="rp-bar"><div class="rp-bar-fill ${st}" style="width:${Math.min(100, Math.max(0, pct))}%;"></div></div></div><span class="rp-pill ${st}">${pct}% of estimate</span></div>`;
    }).join('') + `<div class="rp-legend"><span><i class="key-swatch green"></i>On Track</span><span><i class="key-swatch amber"></i>Needs Attention</span><span><i class="key-swatch red"></i>Behind Estimate</span></div>`;
  }
  return `<div class="rp-panel"><div class="rp-panel-title">${rpIcon('target',20)} Forecast to End vs Estimate${rpHelp()}</div>
    <div class="rp-panel-sub">Where the campaign is likely to finish if it carries on at its average weekly pace so far.</div>${body}</div>`;
}
function rpInsights(notes){
  return `<div class="rp-insights"><div class="rp-ins-ico">${rpIcon('bulb',22)}</div><div><div class="rp-ins-title">Campaign Insights &amp; Next Steps</div><div class="rp-ins-text">${notes ? escapeHtml(notes) : 'No notes added for the latest week.'}</div></div></div>`;
}

// ---- Weekly Performance ----
function rpSelectWeeks(weekDates){
  const n = weekDates.length;
  if(weeklyPeriod==='latest4') return weekDates.slice(-4);
  if(weeklyPeriod==='prev4') return n>4 ? weekDates.slice(Math.max(0, n-8), n-4) : weekDates;
  if(weeklyPeriod==='custom' && n>0){
    const from = Math.min(Math.max(1, weeklyFrom), n);
    const to = Math.min(Math.max(weeklyTo>0 ? weeklyTo : n, from), n);
    return weekDates.slice(from-1, to);
  }
  return weekDates;
}
function rpPeriodControls(c, weekDates){
  const n = weekDates.length;
  const opt = (v,l)=>`<option value="${v}" ${weeklyPeriod===v?'selected':''}>${l}</option>`;
  let custom = '';
  if(weeklyPeriod==='custom' && n>0){
    const from = Math.min(Math.max(1, weeklyFrom), n), to = Math.min(Math.max(weeklyTo>0 ? weeklyTo : n, from), n);
    const wopts = (sel)=>weekDates.map((wd,i)=>`<option value="${i+1}" ${sel===i+1?'selected':''}>W${calcWeekNum(c.startDate, wd)} · ${fmtShortDay(wd)}</option>`).join('');
    custom = `<span class="rp-period-lab">From</span><select id="rp-from" class="rp-select">${wopts(from)}</select><span class="rp-period-lab">to</span><select id="rp-to" class="rp-select">${wopts(to)}</select>`;
  }
  return `<div class="rp-period"><span class="rp-period-lab">Reporting period</span>
    <select id="rp-period" class="rp-select">${opt('all','All weeks')}${opt('latest4','Latest 4 weeks')}${opt('prev4','Previous 4 weeks')}${opt('custom','Custom period…')}</select>${custom}</div>`;
}
function rpWeeklyTable(c, visibleMetrics, weeks, sticky){
  const runMeta = [];
  for(let i=0; i<visibleMetrics.length;){
    const g = metricGroup(visibleMetrics[i]);
    let j = i; while(j<visibleMetrics.length && metricGroup(visibleMetrics[j])===g) j++;
    for(let k=i; k<j; k++) runMeta[k] = {group:g, first:k===i, count:j-i};
    i = j;
  }
  const head = weeks.map(wd=>`<th class="rp-wk"><div>Week ${calcWeekNum(c.startDate, wd)}</div><div class="rp-wk-date">${fmtDate(wd)}</div></th>`).join('');
  const rows = visibleMetrics.map((m, idx)=>{
    const gm = runMeta[idx];
    const cells = weeks.map(wd=>{
      const me = (c.weeklyData[wd].metrics||[]).find(x=>x.id===m.id);
      return `<td>${me ? fmtMetricValue(m, me.actual) : '—'}</td>`;
    }).join('');
    let total;
    if(m.isRatio){ const v = cumulativeConversion(c, m.id); total = v===null ? '—' : v+'%'; }
    else { const est = c.targets && c.targets[m.id]; total = fmtMetricValue(m, cumFor(c, m.id)) + (est ? ` <span class="rp-of">of ${fmtMetricValue(m, est)}</span>` : ''); }
    const side = gm.first ? `<td class="grp-side grp-side-${gm.group}" rowspan="${gm.count}"><span class="rp-grp-label">${rpIcon(GROUP_DEFS[gm.group].icon, 20)}<span>${GROUP_DEFS[gm.group].label}</span></span></td>` : '';
    return `<tr class="grp-${gm.group}${gm.first?' grp-start':''}">${side}<td class="metric-name rp-metric-cell"><span class="rp-mname">${escapeHtml(m.name)}${rpHelp()}</span></td>${cells}<td class="total-col rp-total-cell">${total}</td></tr>`;
  }).join('');
  return `<table class="rp-table ${sticky?'rp-stick':''}"><thead><tr><th class="rp-side-th"></th><th class="rp-metric-th">Metric</th>${head}<th class="rp-total-th">Total</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function renderReport(){
  const c = campaigns.find(x=>x.id===currentCampaignId);
  if(!c){ currentView='dashboard'; return renderDashboard(); }
  const pkg = PACKAGES[c.package];
  const weekDates = Object.keys(c.weeklyData).sort();
  const visibleMetrics = effectiveMetrics(c).filter(m=>c.optionalMetrics[m.id]!==false);
  const totalWeeks = calcTotalWeeks(c.startDate, c.endDate);
  const recorded = weekDates.length;
  const ctx = {recorded, totalWeeks};
  rpKeyOn = c.reportShowKey!==false;

  const ragIds = getRagMetricIds(c.package);
  const primaryTargetId = ragIds.slice().reverse().find(id => c.targets && c.targets[id]);
  const limitLabel = primaryTargetId ? fmtMetricValue(pkg.metrics.find(x=>x.id===primaryTargetId), c.targets[primaryTargetId]) : '';
  const latestNotes = recorded ? String(c.weeklyData[weekDates[recorded-1]].notes||'').trim() : '';

  // ---- Overview tab
  const panels = [rpFunnel(c, visibleMetrics), rpForecast(c, visibleMetrics, ctx)].filter(Boolean);
  const overview = `<div class="rp-shell" id="report-overview-shell">
    ${rpHeader('Campaign Performance')}
    <div class="rp-body">
      ${rpPdfNav('overview')}
      ${rpInfoCard(c, totalWeeks, limitLabel)}
      ${rpTabs('overview')}
      <div class="rp-caption">Performance to date</div>
      <div class="rp-kpis">${pickKpis(c, visibleMetrics).map(m=>rpKpiCard(c, m, ctx)).join('')}</div>
      <div class="rp-two ${panels.length<2?'single':''}">${panels.join('')}</div>
      ${rpInsights(latestNotes)}
    </div>
  </div>`;

  // ---- Weekly Performance tab (every recorded week; scrolls sideways, Metric and Total stay put)
  const shown = rpSelectWeeks(weekDates);
  const weekly = `<div class="rp-shell" id="report-weekly-shell">
    ${rpHeader(c.name, `Weekly breakdown · ${recorded} week${recorded===1?'':'s'} recorded`)}
    <div class="rp-body">
      ${rpTabs('weekly')}
      ${rpInfoStrip(c, totalWeeks, limitLabel)}
      <div class="rp-wk-head"><div class="rp-wk-title">${rpIcon('table',20)} Weekly Performance</div>${rpPeriodControls(c, weekDates)}</div>
      <div class="rp-scroll">${rpWeeklyTable(c, visibleMetrics, shown, true)}</div>
      <div class="rp-note">${recorded ? 'Totals always cover the whole campaign, whichever weeks are shown. Percentage totals are worked out from the campaign totals.' : 'No weeks have been recorded yet.'}</div>
    </div>
  </div>`;

  // ---- PDF-only pages: every week, split across as many pages as needed so nothing is cut off
  const pages = Math.max(1, Math.ceil(recorded/8));
  const per = Math.max(1, Math.ceil(recorded/pages));
  const chunks = Array.from({length:pages}, (_,i)=>weekDates.slice(i*per, (i+1)*per));
  const exportPages = chunks.map((wks, i)=>{
    const sub = pages>1 && wks.length ? `Weekly breakdown · weeks ${calcWeekNum(c.startDate, wks[0])}–${calcWeekNum(c.startDate, wks[wks.length-1])} (page ${i+1} of ${pages})` : `Weekly breakdown · ${recorded} week${recorded===1?'':'s'} recorded`;
    return `<div class="rp-shell rp-wkpage" id="rp-wkpage-${i}">${rpHeader(c.name, sub)}<div class="rp-body">${rpPdfNav('weekly')}${rpInfoStrip(c, totalWeeks, limitLabel)}<div class="rp-wk-head"><div class="rp-wk-title">${rpIcon('table',20)} Weekly Performance</div></div><div class="rp-scroll">${rpWeeklyTable(c, visibleMetrics, wks, false)}</div></div></div>`;
  }).join('');

  return `<div class="wrap rp-wide">
    <button class="rp-exit-fs" data-action="report-exit-fullscreen">✕ Exit full screen</button>
    <div class="top-meta"><div><h1>Report / Export</h1><div class="subtle">${escapeHtml(c.name)}</div></div>
      <button class="btn ghost" data-nav="weekly">← Back to Weekly Entry</button></div>
    <div class="toolbar">
      <label class="check-pill" style="margin-right:auto;"><input type="checkbox" data-action="toggle-report-key" ${c.reportShowKey!==false?'checked':''}> Include key page</label>
      <button class="btn secondary" data-action="report-fullscreen">⛶ Full screen</button>
      <button class="btn secondary" data-action="export-pdf">⬇ Download PDF</button>
      <button class="btn secondary" data-action="export-excel">⬇ Download Excel</button>
    </div>
    <div class="rp-root" id="report-root" data-tab="${reportTab}">
      ${overview}
      ${weekly}
      <div class="rp-export-pages" id="rp-export-pages">${exportPages}</div>
    </div>
    ${c.reportShowKey!==false ? `<div class="key-page-label">Key page · last page of the PDF</div>${renderReportKey(c, visibleMetrics, recorded)}` : ''}
  </div>`;
}

// One-line, client-facing definition for each standard metric, shown on the report's key page.
// Metrics you add yourself use the description box in setup instead.
const METRIC_DEFS = {
  visits:    'The number of different people who visited the campaign page. Each person is counted once, however many times they return.',
  issued:    'Rewards given out to shoppers.',
  act:       'Rewards shoppers have activated, which makes them ready to use in store.',
  pending:   'Rewards issued but not yet activated (Issued minus Activated).',
  red:       'Rewards used at the till.',
  redval:    'The total £ value of the rewards redeemed.',
  itr:       'Of the rewards issued, the percentage that were redeemed.',
  atr:       'Of the rewards activated, the percentage that were redeemed.',
  rew_iss:   'Rewards given out to shoppers.',
  rew_act:   'Rewards shoppers have activated, which makes them ready to use in store.',
  rew_pend:  'Rewards issued but not yet activated (Issued minus Activated).',
  rew_red:   'Rewards used at the till.',
  app_views: 'The number of times the offer was viewed in the Blue Light Card app.',
  app_codes: 'The number of offer codes given to members through the app.',
};
function metricDescription(m){ return m.custom ? (m.description||'').trim() : (METRIC_DEFS[m.id]||''); }

// Which stage of the journey each standard metric belongs to. Neighbouring rows in the same stage sit
// under one group card on the Weekly Performance table. Metrics you add yourself go under "Other".
const METRIC_GROUPS = {
  app_views:'engagement', app_codes:'engagement', visits:'engagement', issued:'engagement', rew_iss:'engagement',
  act:'activation', rew_act:'activation', pending:'activation', rew_pend:'activation',
  red:'redemption', rew_red:'redemption', redval:'redemption', itr:'redemption', atr:'redemption',
};
const GROUP_DEFS = { engagement:{label:'Engagement', icon:'eye'}, activation:{label:'Activation', icon:'zap'}, redemption:{label:'Redemption', icon:'basket'}, other:{label:'Other', icon:'chart'} };
function metricGroup(m){ return m.custom ? 'other' : (METRIC_GROUPS[m.id] || 'other'); }

// Page 2 of the report. It is built from the same list, in the same order, as the table on page 1
// (visibleMetrics), so it only ever explains what is actually on the report.
function renderReportKey(c, visibleMetrics, recorded){
  const defRows = visibleMetrics.map(m=>{
    const d = metricDescription(m);
    return d ? `<tr><td>${escapeHtml(m.name)}</td><td>${escapeHtml(d)}</td></tr>` : '';
  }).join('');
  const hasTarget = m => !!(c.targets && c.targets[m.id]);
  const anyForecast = recorded>0 && visibleMetrics.some(m=>!m.isRatio && hasTarget(m));
  const statusHtml = anyForecast ? `<div class="key-title" style="margin-top:18px;">Forecast colours</div><dl>
      <dt><span class="key-swatch green"></span>On Track</dt><dd>The forecast is over 75% of estimate, up to 115%.</dd>
      <dt><span class="key-swatch amber"></span>Needs Attention</dt><dd>The forecast is over 50% and up to 75% of estimate, or more than 115% (well ahead of plan, so worth a check).</dd>
      <dt><span class="key-swatch red"></span>Behind Estimate</dt><dd>The forecast is 50% of estimate or less.</dd>
    </dl>` : '';
  return `<div class="rp-shell" id="report-key-page">
    ${rpHeader(c.name, 'Key to the report')}
    ${rpPdfNav('key','rp-pdfnav-key')}
    <div class="key-body ${defRows?'':'single'}">
      ${defRows ? `<div><div class="key-title">What each measure means</div><table class="key-table"><tbody>${defRows}</tbody></table></div>` : ''}
      <div class="key-read"><div class="key-title">Forecast to End</div><p class="key-p">Where the campaign is likely to finish if it carries on at its average weekly pace so far, compared with the estimate.</p>${statusHtml}</div>
    </div>
  </div>`;
}
function formatOfferValue(c){
  if(c.offerType==='fixed' && c.offerValue) return `£${c.offerValue}`;
  if(c.offerType==='pct' && c.offerValue) return `${c.offerValue}% off`;
  return 'No fixed value';
}
// Renders the campaign logo with EXPLICIT width/height (not just CSS) so it keeps its true
// aspect ratio when html2canvas snapshots the page for PDF export — percentage/object-fit
// sizing alone can get stretched by html2canvas.
function renderReportLogoImg(c, maxW, maxH){
  const MAX_W = maxW || 204, MAX_H = maxH || 134;
  if(c.logoW && c.logoH){
    const scale = Math.min(MAX_W/c.logoW, MAX_H/c.logoH, 1);
    const w = Math.round(c.logoW*scale), h = Math.round(c.logoH*scale);
    return `<img class="report-logo-img" src="${c.logo}" width="${w}" height="${h}">`;
  }
  // Dimensions not captured yet (e.g. a campaign saved before this fix) — fall back to
  // CSS sizing for now, and quietly measure + persist so it's exact from here on.
  ensureLogoDimensions(c);
  return `<img class="report-logo-img report-logo-img-fallback" src="${c.logo}">`;
}
function ensureLogoDimensions(c){
  if(c.logoW && c.logoH || !c.logo || c._measuringLogo) return;
  c._measuringLogo = true;
  const img = new Image();
  img.onload = () => {
    c.logoW = img.naturalWidth; c.logoH = img.naturalHeight; c._measuringLogo = false;
    persistCampaigns();
    if(currentView==='report') render();
  };
  img.src = c.logo;
}

// ================= HISTORY (chart-only trend view) =================
function renderHistory(){
  const c = campaigns.find(x=>x.id===currentCampaignId);
  if(!c){ currentView='dashboard'; return renderDashboard(); }
  const weekDates = Object.keys(c.weeklyData).sort();
  return `<div class="wrap">
    <div class="top-meta"><div><h1>History</h1><div class="subtle">${escapeHtml(c.name)} · week-by-week performance vs estimate</div></div>
      <button class="btn ghost" data-nav="weekly">← Back to Weekly Entry</button></div>
    ${weekDates.length
      ? `<div class="hist-card-grid">${buildHistoryCards(c, weekDates)}</div>`
      : `<div class="banner teal">No weeks saved yet — save a week to start building this view.</div>`}
  </div>`;
}
// Per-metric weekly-RAG history cards: latest % of weekly estimate, a wk-on-wk delta, and a
// segmented bar coloured by each week's RAG status against its weekly estimate.
function buildHistoryCards(c, weekDates){
  const pkg = PACKAGES[c.package];
  const totalWeeks = calcTotalWeeks(c.startDate, c.endDate);
  const metrics = effectiveMetrics(c).filter(m=>c.optionalMetrics[m.id]!==false);
  if(!metrics.length) return `<div class="banner teal" style="grid-column:1/-1;">No metrics to show yet.</div>`;

  return metrics.map(m=>{
    const hasTarget = !m.isRatio && c.targets && c.targets[m.id];

    // Raw actuals for every week, used either way (as the %-basis or as the headline value itself).
    const actuals = weekDates.map(wd=>{
      const me = (c.weeklyData[wd].metrics||[]).find(x=>x.id===m.id);
      return me ? Number(me.actual)||0 : 0;
    });

    let headline, subLabel, delta, segments;

    if(hasTarget){
      // Tracked metric: % of weekly estimate, coloured by RAG status per week.
      const weeklyTarget = c.targets[m.id]/totalWeeks;
      const weekPcts = actuals.map(a => weeklyTarget ? Math.round((a/weeklyTarget)*100) : 0);
      headline = `${weekPcts[weekPcts.length-1]}%`;
      subLabel = '% of weekly estimate';
      const prevPct = weekPcts.length>1 ? weekPcts[weekPcts.length-2] : null;
      delta = prevPct!==null ? {value: weekPcts[weekPcts.length-1]-prevPct, unit:'pp'} : null;
      segments = actuals.map(a => `<div class="hist-segment ${ragStatus(a, weeklyTarget) || 'neutral'}" style="height:100%;"></div>`).join('');
    } else if(m.isRatio){
      // Ratio metric: the actual value already is a %, so use it directly — no target to colour against.
      headline = `${fmtNum(actuals[actuals.length-1])}%`;
      subLabel = 'weekly value';
      const prev = actuals.length>1 ? actuals[actuals.length-2] : null;
      delta = prev!==null ? {value: Math.round((actuals[actuals.length-1]-prev)*10)/10, unit:'pp'} : null;
      const maxVal = Math.max(1, ...actuals);
      segments = actuals.map(a => `<div class="hist-segment brand" style="height:${Math.max(10, Math.round((a/maxVal)*100))}%;"></div>`).join('');
    } else {
      // No estimate set: show the raw weekly actuals as a simple magnitude sparkline.
      headline = fmtMetricValue(m, actuals[actuals.length-1]);
      subLabel = 'weekly actual (no estimate set)';
      const prev = actuals.length>1 ? actuals[actuals.length-2] : null;
      delta = prev!==null ? {value: actuals[actuals.length-1]-prev, unit:''} : null;
      const maxVal = Math.max(1, ...actuals);
      segments = actuals.map(a => `<div class="hist-segment brand" style="height:${Math.max(10, Math.round((a/maxVal)*100))}%;"></div>`).join('');
    }

    const weekLabels = weekDates.map(wd=>`<div class="hist-week-label">${wd}</div>`).join('');
    const deltaHtml = delta ? ` <span class="hist-delta ${delta.value>=0?'up':'down'}">${delta.value>=0?'▲':'▼'} ${fmtNum(Math.abs(delta.value))}${delta.unit}</span>` : '';

    return `<div class="hist-card">
      <div class="hist-card-top">
        <div class="hist-name">${m.name}</div>
        <div class="hist-pct">${headline}</div>
      </div>
      <div class="hist-sub">${subLabel}${deltaHtml}</div>
      <div class="hist-bar">${segments}</div>
      <div class="hist-week-labels">${weekLabels}</div>
    </div>`;
  }).join('');
}

function buildReportPlainData(c){
  const pkg = PACKAGES[c.package];
  const weekDates = Object.keys(c.weeklyData).sort();
  const visibleMetrics = effectiveMetrics(c).filter(m=>c.optionalMetrics[m.id]!==false);
  return {pkg, weekDates, visibleMetrics};
}

// Core pipeline stages per package, used for the week-by-week chart on the report.
function pipelineStagesFor(pkgKey){
  if(pkgKey==='basic') return [{id:'act',label:'Activated',color:SAVI_BLUE},{id:'red',label:'Redeemed',color:SAVI_LIGHT_GREEN}];
  if(pkgKey==='intermediate') return [{id:'issued',label:'Issued',color:SAVI_GREEN},{id:'act',label:'Activated',color:SAVI_BLUE},{id:'red',label:'Redeemed',color:SAVI_LIGHT_GREEN}];
  return [{id:'rew_iss',label:'Rewards Issued',color:SAVI_GREEN},{id:'rew_act',label:'Rewards Activated',color:SAVI_BLUE},{id:'rew_red',label:'Rewards Redeemed',color:SAVI_LIGHT_GREEN}];
}
function buildWeeklyChartSVG(c, weekDates){
  const pkg = PACKAGES[c.package];
  const stages = pipelineStagesFor(c.package).filter(s=>c.optionalMetrics[s.id]!==false);
  if(!stages.length || !weekDates.length) return '';
  const series = stages.map(s=>({
    ...s,
    values: weekDates.map(wd=>{
      const me = (c.weeklyData[wd].metrics||[]).find(x=>x.id===s.id);
      return me ? Number(me.actual)||0 : 0;
    })
  }));

  const W=640, H=260, padL=8, padR=8, padT=10, padB=28;
  const plotW = W-padL-padR, plotH = H-padT-padB;
  const maxVal = Math.max(1, ...series.flatMap(s=>s.values));
  // Single points sit centred; with 2+ weeks they're evenly spaced across the plot width.
  const xFor = wi => weekDates.length>1 ? padL + (wi/(weekDates.length-1))*plotW : padL + plotW/2;
  const yFor = val => padT + plotH - (val/maxVal)*plotH;

  let lines = '', dots = '';
  series.forEach(s=>{
    const pts = s.values.map((v,wi)=>`${xFor(wi).toFixed(1)},${yFor(v).toFixed(1)}`).join(' ');
    lines += `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"></polyline>`;
    s.values.forEach((v,wi)=>{
      dots += `<circle cx="${xFor(wi).toFixed(1)}" cy="${yFor(v).toFixed(1)}" r="3.4" fill="${s.color}"></circle>`;
    });
  });
  let labels = '';
  weekDates.forEach((wd,wi)=>{
    labels += `<text x="${xFor(wi).toFixed(1)}" y="${H-8}" font-size="11" fill="#8b9997" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">Wk ${c.weeklyData[wd].weekNum}</text>`;
  });
  const baseline = `<line x1="${padL}" y1="${padT+plotH}" x2="${W-padR}" y2="${padT+plotH}" stroke="#dde2df" stroke-width="1"></line>`;

  const legend = series.map(s=>`<span class="wc-legend-item"><span class="wc-swatch" style="background:${s.color};"></span>${s.label}</span>`).join('');

  return `<div class="week-chart">
    <div class="wc-legend">${legend}</div>
    <svg viewBox="0 0 ${W} ${H}" class="week-chart-svg" preserveAspectRatio="xMidYMid meet">${baseline}${lines}${dots}${labels}</svg>
  </div>`;
}

async function exportPDF(){
  const c = campaigns.find(x=>x.id===currentCampaignId);
  if(!c) return;
  const overviewEl = document.getElementById('report-overview-shell');
  if(!overviewEl || !window.html2canvas || !window.jspdf){ showToast('PDF library not available'); return; }
  showToast('Preparing PDF…');
  // Pages, in order: Overview, then every week (split across as many pages as needed), then the key.
  const elements = [overviewEl, ...document.querySelectorAll('#rp-export-pages .rp-wkpage')];
  const keyEl = document.getElementById('report-key-page');
  if(keyEl) elements.push(keyEl);
  // The tab you are looking at hides the other one, so the capture copy shows everything.
  // Where each tab / "?" button sits inside the page it is drawn on (measured in the capture copy, which is
  // exactly what gets photographed), so a clickable area can be laid over it in the PDF.
  const linkMap = {}, baseW = {};
  const snap = (el)=> window.html2canvas(el, {scale:2, backgroundColor:'#ffffff', useCORS:true,
    onclone:(cloned)=>{
      const r = cloned.getElementById('report-root'); if(r) r.classList.add('rp-export');
      if(cloned.body) cloned.body.classList.add('rp-exporting');
      const t = cloned.getElementById(el.id);
      if(t){
        const b = t.getBoundingClientRect();
        baseW[el.id] = b.width;
        linkMap[el.id] = [...t.querySelectorAll('[data-pdf-link]')].map(n=>{ const q = n.getBoundingClientRect();
          return {x:q.left-b.left, y:q.top-b.top, w:q.width, h:q.height, to:n.getAttribute('data-pdf-link')}; });
      }
    }});
  const nWeekly = document.querySelectorAll('#rp-export-pages .rp-wkpage').length;
  const pageFor = { overview:1, weekly:2, key: keyEl ? 2 + nWeekly : null };

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({orientation:'landscape', unit:'pt', format:'a4'});
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  const margin = 24;
  const usableW = pageW - margin*2;
  const usableH = pageH - margin*2;
  let first = true;
  try{
    for(const el of elements){
      const canvas = await snap(el);
      if(!first) doc.addPage();
      first = false;
      // One page each, never sliced: fit to the page width, or shrink to fit the height.
      let w = usableW, h = (canvas.height * w) / canvas.width;
      if(h > usableH){ h = usableH; w = (canvas.width * h) / canvas.height; }
      const x0 = margin + (usableW - w)/2;
      doc.addImage(canvas.toDataURL('image/png'), 'PNG', x0, margin, w, h);
      // Clickable areas over the tabs and ? buttons (a little larger than the button itself, so they are easy to hit).
      const f = baseW[el.id] ? w / baseW[el.id] : 0, pad = 4;
      if(f) (linkMap[el.id]||[]).forEach(L=>{
        const pg = pageFor[L.to];
        if(pg) doc.link(x0 + (L.x - pad)*f, margin + (L.y - pad)*f, (L.w + pad*2)*f, (L.h + pad*2)*f, {pageNumber: pg});
      });
    }
  }catch(e){ showToast('Could not generate PDF'); return; }
  doc.save(`${c.name.replace(/[^a-z0-9]+/gi,'_')}_Campaign_Performance_Report.pdf`);
  showToast('PDF downloaded');
}

// ---------- Excel styling helpers ----------
// Column widths and number formats are core, well-supported XLSX features. Bold/coloured
// header cells are a nice-to-have on top — most spreadsheet apps render them fine, but it
// depends on exactly which build of the export library is available at runtime, so treat
// them as a bonus rather than something to rely on.
const XLSX_HEADER_STYLE = { font:{bold:true, color:{rgb:'FFFFFF'}}, fill:{fgColor:{rgb:'224B50'}} };
const XLSX_LABEL_STYLE = { font:{bold:true} };
const XLSX_CURRENCY_FMT = '"£"#,##0.00';
const XLSX_PCT_FMT = '0.0"%"';
function xlsxSetCols(ws, widths){ ws['!cols'] = widths.map(w=>({wch:w})); }
function xlsxStyleCell(ws, r, c, style){
  const addr = XLSX.utils.encode_cell({r,c});
  if(!ws[addr]) return;
  ws[addr].s = Object.assign({}, ws[addr].s, style);
}
function xlsxStyleRow(ws, r, numCols, style){
  for(let c=0;c<numCols;c++) xlsxStyleCell(ws, r, c, style);
}
function xlsxSetFormat(ws, r, c, fmt){
  const addr = XLSX.utils.encode_cell({r,c});
  if(ws[addr] && typeof ws[addr].v === 'number') ws[addr].z = fmt;
}

function exportExcel(){
  const c = campaigns.find(x=>x.id===currentCampaignId);
  if(!c || !window.XLSX){ showToast('Excel library not available'); return; }
  const pkg = PACKAGES[c.package];
  const wb = XLSX.utils.book_new();
  const metricsList = effectiveMetrics(c);

  // Sheet 1: Campaign summary and all metrics
  const summary = [
    ['Campaign', c.name],['Client', c.client],['Dynamics Ref', c.dynamics],
    ['Package', pkg.label],['Region', regionLabel(c.region)],
    ['Start Date', c.startDate],['End Date', c.endDate],
    ['Total Weeks', calcTotalWeeks(c.startDate,c.endDate)],
    ['Objective', c.objective],[],
    ['Metric Name','Entry Type','Overall Estimate']
  ];
  const metricHeaderRow = summary.length - 1;
  metricsList.forEach(m=> summary.push([m.name, m.entry==='auto'?'Calculated':m.entry==='auto-or-manual'?'Auto or manual':'Manual', c.targets[m.id] ?? '']));
  const wsSummary = XLSX.utils.aoa_to_sheet(summary);
  xlsxSetCols(wsSummary, [24, 20, 16]);
  for(let r=0;r<metricHeaderRow-1;r++) xlsxStyleCell(wsSummary, r, 0, XLSX_LABEL_STYLE);
  xlsxStyleRow(wsSummary, metricHeaderRow, 3, XLSX_HEADER_STYLE);
  metricsList.forEach((m,i)=>{ if(m.isCurrency) xlsxSetFormat(wsSummary, metricHeaderRow+1+i, 2, XLSX_CURRENCY_FMT); });
  XLSX.utils.book_append_sheet(wb, wsSummary, 'Summary');

  // Sheet 2: Weekly data by week
  const weekDates = Object.keys(c.weeklyData).sort();
  const weekHeader = ['Metric', ...weekDates.map(wd=>'Wk '+c.weeklyData[wd].weekNum+' ('+wd+')')];
  const weekRows = [weekHeader];
  metricsList.forEach(m=>{
    const row = [m.name];
    weekDates.forEach(wd=>{
      const me = (c.weeklyData[wd].metrics||[]).find(x=>x.id===m.id);
      row.push(me ? me.actual : '');
    });
    weekRows.push(row);
  });
  const wsWeekly = XLSX.utils.aoa_to_sheet(weekRows);
  xlsxSetCols(wsWeekly, [26, ...weekDates.map(()=>14)]);
  xlsxStyleRow(wsWeekly, 0, weekHeader.length, XLSX_HEADER_STYLE);
  metricsList.forEach((m,i)=>{
    weekDates.forEach((wd,wi)=>{
      if(m.isCurrency) xlsxSetFormat(wsWeekly, i+1, wi+1, XLSX_CURRENCY_FMT);
      else if(m.isRatio) xlsxSetFormat(wsWeekly, i+1, wi+1, XLSX_PCT_FMT);
    });
  });
  XLSX.utils.book_append_sheet(wb, wsWeekly, 'Weekly Data');

  // Sheet 3: Overall targets vs actuals
  const totalWeeks = calcTotalWeeks(c.startDate,c.endDate);
  const tHeader = ['Metric','Overall Estimate','Weekly Estimate','Cumulative Actual','Forecast to Completion'];
  const tRows = [tHeader];
  const recorded = weeksRecorded(c);
  metricsList.forEach(m=>{
    const target = c.targets[m.id]||'';
    const weekly = target ? target/totalWeeks : '';
    const cumul = calcCumulativeFromHistory(c, m.id, '9999-99-99', 0);
    let forecast = '';
    if(recorded>0 && target && !m.isRatio){
      const avg = cumul/recorded;
      forecast = cumul + avg*(totalWeeks-recorded);
    }
    tRows.push([m.name, target, weekly, m.isRatio?'n/a':cumul, forecast]);
  });
  const wsTargets = XLSX.utils.aoa_to_sheet(tRows);
  xlsxSetCols(wsTargets, [26, 16, 16, 18, 20]);
  xlsxStyleRow(wsTargets, 0, tHeader.length, XLSX_HEADER_STYLE);
  metricsList.forEach((m,i)=>{
    if(!m.isCurrency) return;
    const r = i+1;
    [1,2,3,4].forEach(col=>xlsxSetFormat(wsTargets, r, col, XLSX_CURRENCY_FMT));
  });
  XLSX.utils.book_append_sheet(wb, wsTargets, 'Estimates vs Actuals');

  XLSX.writeFile(wb, `${c.name.replace(/[^a-z0-9]+/gi,'_')}_Campaign_Performance_Report.xlsx`);
  showToast('Excel file downloaded');
}

// ---------- Event handling ----------
function attachHandlers(){
  const app = document.getElementById('app');

  app.querySelectorAll('[data-nav]').forEach(el=>el.addEventListener('click', ()=>{
    currentView = el.getAttribute('data-nav');
    render();
  }));

  app.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click', async ()=>{
    currentCampaignId = el.getAttribute('data-open');
    currentWeekDate = null;
    await enterWeeklyView(currentCampaignId);
  }));

  // Campaign tabs (Overview / Enter Week / History / Report) on every campaign screen
  app.querySelectorAll('[data-ctab]').forEach(el=>el.addEventListener('click', async ()=>{
    const t = el.getAttribute('data-ctab');
    if(t==='weekly'){
      if(currentView==='weekly') return;
      await enterWeeklyView(currentCampaignId);
      return;
    }
    if(currentView==='weekly'){
      // keep anything typed but not yet saved, so it's still there when you come back
      await saveDraft(currentCampaignId, {weekDate:currentWeekDate, values:weekInputs, retailerValues:retailerInputs, notes:weekNotes});
    }
    currentView = t;
    render();
  }));

  app.querySelectorAll('[data-view-overview]').forEach(el=>el.addEventListener('click', ()=>{
    currentCampaignId = el.getAttribute('data-view-overview');
    currentView = 'overview';
    render();
  }));

  app.querySelectorAll('[data-select-campaign]').forEach(el=>el.addEventListener('click', async ()=>{
    currentCampaignId = el.getAttribute('data-select-campaign');
    currentWeekDate = null;
    await enterWeeklyView(currentCampaignId);
  }));

  app.querySelectorAll('[data-shortcut]').forEach(el=>el.addEventListener('click', async ()=>{
    const which = el.getAttribute('data-shortcut');
    if(!currentCampaignId && campaigns.length) currentCampaignId = campaigns[0].id;
    if(!currentCampaignId) return; // nothing to show yet
    if(which==='weekly'){ await enterWeeklyView(currentCampaignId); }
    else if(which==='history'){ currentView = 'history'; render(); }
    else { currentView = 'report'; render(); }
  }));

  app.querySelectorAll('[data-action="new-campaign"]').forEach(el=>el.addEventListener('click', ()=>{
    setupDraft = blankCampaign();
    currentCampaignId = null;
    dateRangePickerOpen = false; calendarViewMonth = null;
    currentView='setup'; render();
  }));

  // Campaign Overview: archive / delete
  const ovArchive = app.querySelector('[data-action="overview-archive"]');
  if(ovArchive) ovArchive.addEventListener('click', async ()=>{
    const target = campaigns.find(x=>x.id===currentCampaignId);
    if(!target) return;
    target.archived = !target.archived;
    await persistCampaigns();
    render();
    showToast(target.archived ? 'Campaign archived' : 'Campaign unarchived');
  });
  const ovDelete = app.querySelector('[data-action="overview-delete"]');
  if(ovDelete) ovDelete.addEventListener('click', ()=>{
    const target = campaigns.find(x=>x.id===currentCampaignId);
    if(!target) return;
    const id = target.id;
    confirmModal = {
      title:'Delete this campaign?',
      body:`"${escapeHtml(target.name||'This campaign')}" and all of its weekly data will be permanently removed. This can't be undone.`,
      confirmLabel:'Delete',
      onConfirm: async ()=>{
        campaigns = campaigns.filter(x=>x.id!==id);
        currentCampaignId = null;
        await persistCampaigns();
        confirmModal = null; currentView = 'dashboard'; render();
        showToast('Campaign deleted');
      }
    };
    render();
  });

  // Dashboard quick edit
  app.querySelectorAll('[data-quick-edit]').forEach(el=>el.addEventListener('click', (ev)=>{
    ev.stopPropagation();
    const c = campaigns.find(x=>x.id===el.getAttribute('data-quick-edit'));
    if(!c) return;
    quickEdit = {id:c.id, cdOwner:c.cdOwner||'', stage:stageOf(c), startDate:c.startDate||'', endDate:c.endDate||''};
    render();
  }));
  if(quickEdit){
    [['qe-owner','cdOwner'],['qe-stage','stage'],['qe-start','startDate'],['qe-end','endDate']].forEach(([id,key])=>{
      const el = app.querySelector('#'+id);
      if(!el) return;
      const sync = ()=>{ quickEdit[key] = el.value; };
      el.addEventListener('input', sync); el.addEventListener('change', sync);
    });
  }
  const qeCancel = app.querySelector('[data-action="qe-cancel"]');
  if(qeCancel) qeCancel.addEventListener('click', ()=>{ quickEdit = null; render(); });
  const qeSave = app.querySelector('[data-action="qe-save"]');
  if(qeSave) qeSave.addEventListener('click', async ()=>{
    const c = campaigns.find(x=>x.id===quickEdit.id);
    if(!c){ quickEdit = null; render(); return; }
    if(!quickEdit.startDate || !quickEdit.endDate){ showToast('Both dates are needed'); return; }
    if(new Date(quickEdit.endDate) <= new Date(quickEdit.startDate)){ showToast('End date must be after start date'); return; }
    const datesChanged = c.startDate !== quickEdit.startDate || c.endDate !== quickEdit.endDate;
    c.cdOwner = quickEdit.cdOwner;
    c.workflowStage = quickEdit.stage;
    c.startDate = quickEdit.startDate; c.endDate = quickEdit.endDate;
    if(datesChanged) Object.keys(c.weeklyData||{}).forEach(wd=>{ c.weeklyData[wd].weekNum = calcWeekNum(c.startDate, wd); });
    await persistCampaigns();
    quickEdit = null; render();
    showToast('Campaign updated');
  });

  app.querySelectorAll('[data-quick-clone]').forEach(el=>el.addEventListener('click', (ev)=>{
    ev.stopPropagation();
    const id = el.getAttribute('data-quick-clone');
    const original = campaigns.find(x=>x.id===id);
    if(!original) return;
    const copy = JSON.parse(JSON.stringify(original));
    copy.id = null;
    copy.name = (copy.name||'Untitled campaign') + ' (Clone)';
    copy.startDate = ''; copy.endDate = ''; // new dates needed before it can be saved
    copy.weeklyData = {};
    copy.archived = false;
    copy.createdAt = null;
    copy.handoverText = '';
    setupDraft = copy;
    dateRangePickerOpen = false; calendarViewMonth = null;
    currentCampaignId = null;
    currentView = 'setup';
    render();
    showToast('Cloned — review the details and set new dates before saving');
  }));

  const dashSearchEl = app.querySelector('#dash-search');
  if(dashSearchEl) dashSearchEl.addEventListener('input', ()=>{ dashboardSearch = dashSearchEl.value; render(); });
  app.querySelectorAll('[data-dash-filter]').forEach(el=>el.addEventListener('click', ()=>{
    dashboardStatusFilter = el.getAttribute('data-dash-filter');
    render();
  }));
  const cdOwnerFilterEl = app.querySelector('#dash-cdowner-filter');
  if(cdOwnerFilterEl) cdOwnerFilterEl.addEventListener('change', ()=>{
    dashboardCdOwnerFilter = cdOwnerFilterEl.value;
    render();
  });

  const exportBtn = app.querySelector('[data-action="export-data"]');
  if(exportBtn) exportBtn.addEventListener('click', ()=>{
    const blob = new Blob([JSON.stringify(campaigns, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `savi-campaign-performance-backup-${todayISO()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    showToast('Backup downloaded');
  });
  const importBtn = app.querySelector('[data-action="import-data"]');
  const importInput = app.querySelector('#import-data-input');
  if(importBtn && importInput) importBtn.addEventListener('click', ()=> importInput.click());
  if(importInput) importInput.addEventListener('change', ()=>{
    const file = importInput.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = async ()=>{
      let incoming;
      try{ incoming = JSON.parse(reader.result); }
      catch(e){ showToast('That file doesn\'t look like a valid backup'); return; }
      if(!Array.isArray(incoming)){ showToast('That file doesn\'t look like a valid backup'); return; }
      const existingIds = new Set(campaigns.map(c=>c.id));
      const toAdd = incoming.filter(c=>c && c.id && !existingIds.has(c.id));
      if(!toAdd.length){ showToast('Nothing new to restore — those campaigns are already here'); return; }
      confirmModal = {
        title:'Restore campaigns?',
        body:`This will add ${toAdd.length} campaign${toAdd.length===1?'':'s'} from the backup that aren't already here. Existing campaigns won't be touched or overwritten.`,
        confirmLabel:'Restore',
        onConfirm: async ()=>{
          campaigns = campaigns.concat(toAdd);
          await persistCampaigns();
          confirmModal=null; render();
          showToast(`Restored ${toAdd.length} campaign${toAdd.length===1?'':'s'}`);
        }
      };
      render();
    };
    reader.readAsText(file);
    importInput.value = '';
  });

  const clearAllBtn = app.querySelector('[data-action="clear-all-data"]');
  if(clearAllBtn) clearAllBtn.addEventListener('click', ()=>{
    confirmModal = {
      title:'Clear all data?',
      body:`This will permanently delete all ${campaigns.length} campaign${campaigns.length===1?'':'s'} and every week of data in this browser. This can't be undone — make sure you've downloaded a backup first.`,
      confirmLabel:'Clear Everything',
      onConfirm: async ()=>{
        campaigns = [];
        currentCampaignId = null;
        await persistCampaigns();
        confirmModal=null; currentView='dashboard'; render();
        showToast('All data cleared');
      }
    };
    render();
  });

  const editBtn = app.querySelector('[data-action="edit-campaign"]');
  if(editBtn) editBtn.addEventListener('click', ()=>{
    const c = campaigns.find(x=>x.id===currentCampaignId);
    setupDraft = JSON.parse(JSON.stringify(c));
    dateRangePickerOpen = false; calendarViewMonth = null;
    currentView='setup'; render();
  });

  // Setup screen wiring
  if(currentView==='setup'){
    const pkg = PACKAGES[setupDraft.package];
    const byId = id=>app.querySelector('#'+id);
    const bindText = (id,field)=>{ const el=byId(id); if(el) el.addEventListener('input', ()=>{ setupDraft[field]=el.value; if(['startDate','endDate','package'].includes(field)) render(); }); };
    const pkgEl = byId('f-package');
    if(pkgEl) pkgEl.addEventListener('change', ()=>{ setupDraft.package=pkgEl.value; setupDraft.targets={}; setupDraft.optionalMetrics={}; setupDraft.metricOrder=null; render(); });
    bindText('f-dynamics','dynamics'); bindText('f-client','client'); bindText('f-name','name'); bindText('f-objective','objective');
    const clientInputEl = byId('f-client'), clientHintEl = byId('client-hint');
    if(clientInputEl && clientHintEl) clientInputEl.addEventListener('input', ()=>{ clientHintEl.textContent = clientHintText(clientInputEl.value); });
    const cdOwnerEl = byId('f-cdowner');
    if(cdOwnerEl) cdOwnerEl.addEventListener('change', ()=>{ setupDraft.cdOwner = cdOwnerEl.value; });

    // Date range picker
    const drpTrigger = app.querySelector('[data-action="toggle-date-picker"]');
    if(drpTrigger) drpTrigger.addEventListener('click', ()=>{
      dateRangePickerOpen = !dateRangePickerOpen;
      if(dateRangePickerOpen) calendarViewMonth = setupDraft.startDate ? toMonday(setupDraft.startDate).slice(0,7)+'-01' : todayISO().slice(0,7)+'-01';
      render();
    });
    app.querySelectorAll('[data-cal-nav]').forEach(el=>el.addEventListener('click', ()=>{
      const dir = Number(el.getAttribute('data-cal-nav'));
      const d = new Date((calendarViewMonth||todayISO().slice(0,7)+'-01')+'T00:00:00');
      d.setMonth(d.getMonth()+dir);
      calendarViewMonth = ymd(d).slice(0,7)+'-01';
      render();
    }));
    app.querySelectorAll('[data-pick-date]').forEach(el=>el.addEventListener('click', ()=>{
      const date = el.getAttribute('data-pick-date');
      if(!setupDraft.startDate){
        setupDraft.startDate = date;
      } else if(!setupDraft.endDate){
        if(date < setupDraft.startDate){ setupDraft.endDate = setupDraft.startDate; setupDraft.startDate = date; }
        else { setupDraft.endDate = date; }
      } else {
        // Both dates are already set — treat a further click as adjusting whichever edge it's
        // nearer to, so picking a date in another month moves the end (or start) instead of
        // wiping the range and starting over. Use "Clear" to reset to a fresh range.
        if(date < setupDraft.startDate){ setupDraft.startDate = date; }
        else { setupDraft.endDate = date; }
      }
      render();
    }));
    const drpClear = app.querySelector('[data-action="clear-date-picker"]');
    if(drpClear) drpClear.addEventListener('click', ()=>{ setupDraft.startDate=''; setupDraft.endDate=''; render(); });
    const drpCancel = app.querySelector('[data-action="close-date-picker"]');
    if(drpCancel) drpCancel.addEventListener('click', ()=>{ dateRangePickerOpen = false; render(); });
    const drpApply = app.querySelector('[data-action="apply-date-picker"]');
    if(drpApply) drpApply.addEventListener('click', ()=>{ dateRangePickerOpen = false; render(); });

    // Custom metrics: drag-to-reorder rows in the targets table
    let draggedMetricRow = null;
    app.querySelectorAll('[data-drag-metric]').forEach(tr=>{
      tr.addEventListener('dragstart', (ev)=>{
        draggedMetricRow = tr.getAttribute('data-drag-metric');
        tr.classList.add('dragging');
        if(ev.dataTransfer){ ev.dataTransfer.effectAllowed = 'move'; ev.dataTransfer.setData('text/plain', draggedMetricRow); }
      });
      tr.addEventListener('dragend', ()=>{
        tr.classList.remove('dragging');
        app.querySelectorAll('.drag-over').forEach(el=>el.classList.remove('drag-over'));
      });
      tr.addEventListener('dragover', (ev)=>{ ev.preventDefault(); tr.classList.add('drag-over'); });
      tr.addEventListener('dragleave', ()=>{ tr.classList.remove('drag-over'); });
      tr.addEventListener('drop', (ev)=>{
        ev.preventDefault();
        tr.classList.remove('drag-over');
        const targetId = tr.getAttribute('data-drag-metric');
        if(!draggedMetricRow || draggedMetricRow===targetId) return;
        ensureMetricOrder(setupDraft);
        const order = setupDraft.metricOrder;
        const fromIdx = order.indexOf(draggedMetricRow);
        if(fromIdx<0) return;
        order.splice(fromIdx,1);
        const toIdx = order.indexOf(targetId);
        order.splice(toIdx, 0, draggedMetricRow);
        draggedMetricRow = null;
        render();
      });
    });
    app.querySelectorAll('[data-cm-delete]').forEach(el=>el.addEventListener('click', ()=>{
      const id = el.getAttribute('data-cm-delete');
      setupDraft.customMetrics = (setupDraft.customMetrics||[]).filter(cm=>cm.id!==id);
      if(setupDraft.metricOrder) setupDraft.metricOrder = setupDraft.metricOrder.filter(x=>x!==id);
      delete setupDraft.targets[id];
      delete setupDraft.optionalMetrics[id];
      render();
    }));
    app.querySelectorAll('[data-cm-desc]').forEach(el=>el.addEventListener('input', ()=>{
      const cm = (setupDraft.customMetrics||[]).find(x=>x.id===el.getAttribute('data-cm-desc'));
      if(cm) cm.description = el.value;
    }));
    const addMetricBtn = app.querySelector('[data-action="add-custom-metric"]');
    if(addMetricBtn) addMetricBtn.addEventListener('click', ()=>{
      const nameEl = byId('f-new-metric-name');
      const currencyEl = byId('f-new-metric-currency');
      const name = (nameEl.value||'').trim();
      if(!name){ showToast('Give the metric a name first'); return; }
      const id = 'custom_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
      setupDraft.customMetrics = setupDraft.customMetrics || [];
      setupDraft.customMetrics.push({ id, name, isCurrency: !!currencyEl.checked, description: ((byId('f-new-metric-desc')||{}).value||'').trim() });
      ensureMetricOrder(setupDraft);
      if(!setupDraft.metricOrder.includes(id)) setupDraft.metricOrder.push(id);
      render();
    });

    const offerTypeEl = byId('f-offertype');
    if(offerTypeEl) offerTypeEl.addEventListener('change', ()=>{ setupDraft.offerType=offerTypeEl.value; render(); });
    const offerValEl = byId('f-offerval');
    if(offerValEl) offerValEl.addEventListener('input', ()=>{ setupDraft.offerValue = offerValEl.value; });

    const gam = byId('f-gamification'); if(gam) gam.addEventListener('change', ()=>{ setupDraft.gamification = gam.checked; });

    app.querySelectorAll('[data-retailer]').forEach(el=>el.addEventListener('change', ()=>{
      const rid = el.getAttribute('data-retailer');
      if(el.checked){ if(!setupDraft.retailers.includes(rid)) setupDraft.retailers.push(rid); }
      else { setupDraft.retailers = setupDraft.retailers.filter(x=>x!==rid); }
    }));
    const ukEl = byId('f-region-uk'), roiEl = byId('f-region-roi');
    const updateRegion = ()=>{
      const uk = ukEl.checked, roi = roiEl.checked;
      setupDraft.region = (uk&&roi) ? 'uk_roi' : roi ? 'roi' : 'uk';
    };
    if(ukEl) ukEl.addEventListener('change', updateRegion);
    if(roiEl) roiEl.addEventListener('change', updateRegion);

    const logoDrop = byId('f-logo-drop'), logoInput = byId('f-logo');
    const handleLogoFile = (file) => {
      if(!file) return;
      if(!file.type || !file.type.startsWith('image/')){ showToast('Please use an image file (PNG, JPG or SVG)'); return; }
      if(file.size > 5*1024*1024){ showToast('Image must be under 5MB'); return; }
      const reader = new FileReader();
      reader.onload = ()=>{
        setupDraft.logo = reader.result;
        // Capture the image's real pixel dimensions so the report can set explicit width/height
        // on the <img> — relying on CSS object-fit alone can get stretched when html2canvas
        // captures the page for PDF export.
        const img = new Image();
        img.onload = () => { setupDraft.logoW = img.naturalWidth; setupDraft.logoH = img.naturalHeight; render(); };
        img.src = reader.result;
        render();
      };
      reader.readAsDataURL(file);
    };
    if(logoDrop) logoDrop.addEventListener('click', ()=> logoInput.click());
    if(logoInput) logoInput.addEventListener('change', ()=> handleLogoFile(logoInput.files[0]));
    if(logoDrop){
      ['dragenter','dragover'].forEach(evt=> logoDrop.addEventListener(evt, (ev)=>{
        ev.preventDefault(); ev.stopPropagation();
        logoDrop.classList.add('drag-active');
      }));
      ['dragleave','dragend'].forEach(evt=> logoDrop.addEventListener(evt, (ev)=>{
        ev.preventDefault(); ev.stopPropagation();
        logoDrop.classList.remove('drag-active');
      }));
      logoDrop.addEventListener('drop', (ev)=>{
        ev.preventDefault(); ev.stopPropagation();
        logoDrop.classList.remove('drag-active');
        const file = ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files[0];
        handleLogoFile(file);
      });
    }

    app.querySelectorAll('[data-optional]').forEach(el=>el.addEventListener('change', ()=>{
      setupDraft.optionalMetrics[el.getAttribute('data-optional')] = el.checked;
    }));
    app.querySelectorAll('[data-target]').forEach(el=>el.addEventListener('input', ()=>{
      const mid = el.getAttribute('data-target');
      setupDraft.targets[mid] = el.value ? Number(el.value) : undefined;
      // live-update weekly estimate column without full re-render (keep cursor)
      const totalWeeks = calcTotalWeeks(setupDraft.startDate, setupDraft.endDate);
      const mdef = effectiveMetrics(setupDraft).find(x=>x.id===mid);
      const row = el.closest('tr');
      const wkCell = row.querySelector('td:last-child');
      if(el.value && totalWeeks) wkCell.innerHTML = `<span class="auto-field">${fmtMetricValue(mdef, el.value/totalWeeks)}/wk</span>`;
      else wkCell.innerHTML = `<span class="muted">—</span>`;
    }));

    const saveBtn = app.querySelector('[data-action="save-campaign"]');
    if(saveBtn) saveBtn.addEventListener('click', onSaveCampaign);
    const archBtn = app.querySelector('[data-action="archive-campaign"]');
    if(archBtn) archBtn.addEventListener('click', async ()=>{
      const target = campaigns.find(x=>x.id===setupDraft.id);
      if(!target) return;
      target.archived = !target.archived;
      setupDraft.archived = target.archived;
      await persistCampaigns();
      render();
      showToast(target.archived ? 'Campaign archived' : 'Campaign unarchived');
    });
    const delBtn = app.querySelector('[data-action="delete-campaign"]');
    if(delBtn) delBtn.addEventListener('click', ()=>{
      confirmModal = {
        title:'Delete this campaign?',
        body:`"${setupDraft.name}" and all of its weekly data will be permanently removed. This can't be undone.`,
        confirmLabel:'Delete',
        onConfirm: async ()=>{
          campaigns = campaigns.filter(x=>x.id!==setupDraft.id);
          await persistCampaigns();
          confirmModal=null; currentView='dashboard'; currentCampaignId=null; render();
          showToast('Campaign deleted');
        }
      };
      render();
    });
  }

  // Paste handover
  if(currentView==='handover'){
    const ta = app.querySelector('#handover-text');
    if(ta) ta.addEventListener('input', ()=>{ handoverText = ta.value; });
    const parseBtn = app.querySelector('[data-action="handover-parse"]');
    if(parseBtn) parseBtn.addEventListener('click', ()=>{
      if(ta) handoverText = ta.value;
      if(!handoverText.trim()){ showToast('Paste the handover details first'); return; }
      handoverParsed = parseHandover(handoverText);
      render();
    });
    const clearBtn = app.querySelector('[data-action="handover-clear"]');
    if(clearBtn) clearBtn.addEventListener('click', ()=>{ handoverText = ''; handoverParsed = null; render(); });
    const toSetupBtn = app.querySelector('[data-action="handover-to-setup"]');
    if(toSetupBtn) toSetupBtn.addEventListener('click', ()=>{
      if(!handoverParsed) return;
      const draft = blankCampaign();
      const f = handoverParsed.fields;
      Object.keys(f).forEach(k=>{ const v = f[k]; if(Array.isArray(v) ? v.length : v) draft[k] = v; });
      draft.handoverText = handoverText;
      draft.client = canonicalClient(draft.client);
      setupDraft = draft;
      handoverText = ''; handoverParsed = null;
      dateRangePickerOpen = false; calendarViewMonth = null;
      currentCampaignId = null; currentView = 'setup';
      render();
      showToast('Pre-filled from the handover — check it and complete the rest');
    });
  }

  // Board: drag a card between workflow-stage columns
  if(currentView==='board'){
    let draggedCardId = null;
    app.querySelectorAll('[data-board-card]').forEach(card=>{
      card.addEventListener('dragstart', (ev)=>{
        draggedCardId = card.getAttribute('data-board-card');
        card.classList.add('dragging');
        if(ev.dataTransfer){ ev.dataTransfer.effectAllowed = 'move'; ev.dataTransfer.setData('text/plain', draggedCardId); }
      });
      card.addEventListener('dragend', ()=>{
        card.classList.remove('dragging');
        app.querySelectorAll('.board-col-body.drag-over').forEach(el=>el.classList.remove('drag-over'));
      });
    });
    // Checklist checkboxes on each card — stop the click bubbling up to the card's
    // open/drag handlers, so ticking a box doesn't navigate away or start a drag.
    app.querySelectorAll('[data-checklist-toggle]').forEach(el=>{
      el.addEventListener('click', (ev)=> ev.stopPropagation());
      el.addEventListener('change', async (ev)=>{
        ev.stopPropagation();
        const [campId, itemId] = el.getAttribute('data-checklist-toggle').split(':');
        const camp = campaigns.find(x=>x.id===campId);
        const item = camp && (camp.checklist||[]).find(i=>i.id===itemId);
        if(item){ item.checked = el.checked; await persistCampaigns(); }
        render();
      });
    });

    app.querySelectorAll('[data-board-dropzone]').forEach(zone=>{
      zone.addEventListener('dragover', (ev)=>{ ev.preventDefault(); zone.classList.add('drag-over'); });
      zone.addEventListener('dragleave', ()=>{ zone.classList.remove('drag-over'); });
      zone.addEventListener('drop', async (ev)=>{
        ev.preventDefault();
        zone.classList.remove('drag-over');
        const stageId = zone.getAttribute('data-board-dropzone');
        if(!draggedCardId) return;
        const target = campaigns.find(x=>x.id===draggedCardId);
        if(target && target.workflowStage !== stageId){
          target.workflowStage = stageId;
          await persistCampaigns();
        }
        draggedCardId = null;
        render();
      });
    });
  }

  // Weekly entry wiring
  if(currentView==='weekly'){
    const weekDateEl = app.querySelector('#f-weekdate');
    if(weekDateEl) weekDateEl.addEventListener('change', async ()=>{
      const c = campaigns.find(x=>x.id===currentCampaignId);
      const firstWeekMon = toMonday(c.startDate);
      const totalWeeks = calcTotalWeeks(c.startDate, c.endDate);
      const lastWeekMon = addDays(firstWeekMon, (totalWeeks-1)*7);
      let v = weekDateEl.value;
      if(!v){ weekDateEl.value = currentWeekDate; return; }
      if(!isMonday(v)) v = toMonday(v);
      // Clamp to the nearest in-range Monday that's part of this campaign's configured weeks —
      // dates outside the campaign's setup can't be entered.
      if(v < firstWeekMon) v = firstWeekMon;
      if(v > lastWeekMon) v = lastWeekMon;
      weekDateEl.value = v;
      await switchWeek(v);
    });
    app.querySelectorAll('[data-metric]').forEach(el=>el.addEventListener('input', ()=>{
      weekInputs[el.getAttribute('data-metric')] = el.value;
      refreshWeeklyLiveFields();
    }));
    app.querySelectorAll('[data-retailer-field]').forEach(el=>el.addEventListener('input', ()=>{
      const [rid,field] = el.getAttribute('data-retailer-field').split(':');
      retailerInputs[rid] = retailerInputs[rid]||{};
      retailerInputs[rid][field] = el.value;
    }));
    const notesEl = app.querySelector('#f-weeknotes');
    if(notesEl) notesEl.addEventListener('input', ()=>{ weekNotes = notesEl.value; });
    const saveWeekBtn = app.querySelector('[data-action="save-week"]');
    if(saveWeekBtn) saveWeekBtn.addEventListener('click', onSaveWeek);
  }

  // Report wiring
  // Report: full screen (presenting) mode. The whole page goes full screen and the app chrome is hidden, so the
  // report fills the display; the page itself stays put when you switch tabs.
  const fsBtn = app.querySelector('[data-action="report-fullscreen"]');
  if(fsBtn) fsBtn.addEventListener('click', ()=>{
    const el = document.documentElement, req = el.requestFullscreen || el.webkitRequestFullscreen;
    if(!req){ showToast('Full screen isn’t available in this browser'); return; }
    Promise.resolve(req.call(el)).catch(()=>showToast('Full screen was blocked by the browser'));
  });
  const fsExit = app.querySelector('[data-action="report-exit-fullscreen"]');
  if(fsExit) fsExit.addEventListener('click', ()=>{ const ex = document.exitFullscreen || document.webkitExitFullscreen; if(ex) ex.call(document); });
  // Report tabs + reporting period
  app.querySelectorAll('[data-rptab]').forEach(el=>el.addEventListener('click', ()=>{ reportTab = el.getAttribute('data-rptab'); render(); }));
  const periodSel = app.querySelector('#rp-period');
  if(periodSel) periodSel.addEventListener('change', ()=>{ weeklyPeriod = periodSel.value; render(); });
  const fromSel = app.querySelector('#rp-from'), toSel = app.querySelector('#rp-to');
  if(fromSel) fromSel.addEventListener('change', ()=>{ weeklyFrom = Number(fromSel.value); render(); });
  if(toSel) toSel.addEventListener('change', ()=>{ weeklyTo = Number(toSel.value); render(); });
  const keyToggle = app.querySelector('[data-action="toggle-report-key"]');
  if(keyToggle) keyToggle.addEventListener('change', async ()=>{
    const c = campaigns.find(x=>x.id===currentCampaignId);
    if(!c) return;
    c.reportShowKey = keyToggle.checked;
    await persistCampaigns();
    render();
  });
  const pdfBtn = app.querySelector('[data-action="export-pdf"]');
  if(pdfBtn) pdfBtn.addEventListener('click', exportPDF);
  const xlsBtn = app.querySelector('[data-action="export-excel"]');
  if(xlsBtn) xlsBtn.addEventListener('click', exportExcel);

  // Modal
  const modalCancel = app.querySelector('[data-action="modal-cancel"]');
  if(modalCancel) modalCancel.addEventListener('click', ()=>{ confirmModal=null; render(); });
  const modalConfirm = app.querySelector('[data-action="modal-confirm"]');
  if(modalConfirm) modalConfirm.addEventListener('click', ()=>{ if(confirmModal && confirmModal.onConfirm) confirmModal.onConfirm(); });
}

// Live-recompute auto fields + cumulative without a full re-render (keeps focus/cursor while typing)
function refreshWeeklyLiveFields(){
  const c = campaigns.find(x=>x.id===currentCampaignId);
  if(!c) return;
  const auto = recalcAutoFields(c.package, weekInputs, c.offerType, c.offerValue, c.customMetrics);
  const pkg = PACKAGES[c.package];
  const totalWeeks = calcTotalWeeks(c.startDate,c.endDate);
  const table = document.querySelectorAll('table.data-table')[0];
  if(!table) return;
  effectiveMetrics(c).filter(m=>c.optionalMetrics[m.id]!==false).forEach((m,idx)=>{
    const row = table.querySelectorAll('tbody tr')[idx];
    if(!row) return;
    const isAuto = m.entry==='auto';
    const isAutoManual = m.entry==='auto-or-manual';
    const willAuto = isAuto || (isAutoManual && c.offerType==='fixed' && c.offerValue);
    if(willAuto){
      const cell = row.querySelector('.auto-field');
      if(cell) cell.textContent = fmtMetricValue(m, auto[m.id]);
    }
    const cumulCell = row.querySelector('td:nth-last-child(2)');
    if(cumulCell && !m.isRatio){
      const liveVal = willAuto ? auto[m.id] : (weekInputs[m.id]||0);
      cumulCell.textContent = fmtMetricValue(m, calcCumulativeFromHistory(c, m.id, currentWeekDate, liveVal));
    }
    // RAG cell live update
    const ragIds = getRagMetricIds(c.package);
    const ragCell = row.querySelector('.rag-cell');
    if(ragCell && ragIds.includes(m.id)){
      const target = c.targets ? c.targets[m.id] : null;
      const weeklyTarget = target ? target/totalWeeks : null;
      const rag = ragStatus(willAuto?auto[m.id]:weekInputs[m.id], weeklyTarget);
      ragCell.innerHTML = rag ? `<span class="rag-badge ${rag}">${ragLabel(rag)}</span>` : '<span class="muted">—</span>';
    }
  });
}

function defaultWeekDateFor(campaign){
  // Default to the earliest week (from campaign start) that has no saved data yet,
  // so a missed week is surfaced automatically instead of being skipped over.
  const startMon = toMonday(campaign.startDate);
  const endMon = toMonday(campaign.endDate);
  const totalWeeks = calcTotalWeeks(campaign.startDate, campaign.endDate);
  for(let i=0;i<totalWeeks;i++){
    const d = new Date(startMon+'T00:00:00');
    d.setDate(d.getDate()+i*7);
    const wd = ymd(d);
    if(wd > endMon) break;
    if(!campaign.weeklyData || !campaign.weeklyData[wd]) return wd;
  }
  // Every week so far has data — fall back to the most recently saved week (or the
  // campaign's first week if nothing has been saved at all).
  const saved = Object.keys(campaign.weeklyData||{}).sort();
  return saved.length ? saved[saved.length-1] : startMon;
}
async function enterWeeklyView(campaignId){
  const c = campaigns.find(x=>x.id===campaignId);
  const draft = await loadDraft(campaignId);
  if(draft && draft.weekDate){
    currentWeekDate = draft.weekDate;
    weekInputs = draft.values || {};
    retailerInputs = draft.retailerValues || {};
    weekNotes = draft.notes || '';
  } else {
    currentWeekDate = c ? defaultWeekDateFor(c) : toMonday(todayISO());
    await loadWeekIfSaved(campaignId, currentWeekDate);
  }
  currentView='weekly';
  render();
}

async function loadWeekIfSaved(campaignId, weekDate){
  const c = campaigns.find(x=>x.id===campaignId);
  const saved = c && c.weeklyData[weekDate];
  if(saved){
    weekInputs = {};
    (saved.metrics||[]).forEach(m=>{ weekInputs[m.id] = m.actual; });
    retailerInputs = saved.retailerBreakdown || {};
    weekNotes = saved.notes || '';
  } else {
    weekInputs = {}; retailerInputs = {}; weekNotes = '';
  }
}

async function switchWeek(newDate){
  // persist current in-progress values as a draft before switching
  await saveDraft(currentCampaignId, {weekDate:newDate, values:weekInputs, retailerValues:retailerInputs, notes:weekNotes});
  currentWeekDate = newDate;
  await loadWeekIfSaved(currentCampaignId, newDate);
  render();
}

async function onSaveWeek(){
  const c = campaigns.find(x=>x.id===currentCampaignId);
  if(!c) return;
  const pkg = PACKAGES[c.package];
  const auto = recalcAutoFields(c.package, weekInputs, c.offerType, c.offerValue, c.customMetrics);
  const totalWeeks = calcTotalWeeks(c.startDate, c.endDate);
  const weekNum = calcWeekNum(c.startDate, currentWeekDate);

  const metrics = effectiveMetrics(c).map(m=>{
    const isAuto = m.entry==='auto';
    const isAutoManual = m.entry==='auto-or-manual';
    const willAuto = isAuto || (isAutoManual && c.offerType==='fixed' && c.offerValue);
    const actual = willAuto ? auto[m.id] : Number(weekInputs[m.id]||0);
    const cumul = calcCumulativeFromHistory(c, m.id, currentWeekDate, actual);
    const overall = c.targets[m.id] || null;
    const weeklyTarget = overall ? overall/totalWeeks : null;
    return { id:m.id, actual, cumul, weeklyTarget, overall, isRatio: !!m.isRatio };
  });

  c.weeklyData[currentWeekDate] = {
    campaignId: c.id, weekDate: currentWeekDate, weekNum,
    notes: weekNotes, metrics, savedAt: new Date().toISOString(),
    retailerBreakdown: JSON.parse(JSON.stringify(retailerInputs)),
  };
  await persistCampaigns();
  await clearDraft(c.id);

  // Build RAG summary for the analysis screen
  const ragIds = getRagMetricIds(c.package);
  lastSavedRag = metrics.filter(m=>ragIds.includes(m.id)).map(m=>{
    const status = ragStatus(m.actual, m.weeklyTarget);
    const pct = m.weeklyTarget ? Math.round(m.actual/m.weeklyTarget*1000)/10 : null;
    return { id:m.id, name: pkg.metrics.find(x=>x.id===m.id).name, actual:m.actual, weeklyTarget:m.weeklyTarget, status, pct };
  });

  showToast('Week saved');
  render();
  // show a RAG summary inline (append after save), plus route to Analysis if needed
  showRagSummaryPanel();
}

function showRagSummaryPanel(){
  const app = document.getElementById('app');
  const wrap = app.querySelector('.wrap');
  if(!wrap || !lastSavedRag) return;
  const hasIssue = lastSavedRag.some(r=>r.status && r.status!=='green');
  // RAG status is now shown inline in the Weekly Figures table's RAG column above —
  // this just surfaces the follow-on actions once a week with amber/red has been saved.
  const panel = document.createElement('div');
  panel.innerHTML = `<div class="form-actions"><div></div><div class="right">
      ${hasIssue ? `<button class="btn secondary" data-nav="analysis">Run Analysis</button>` : ''}
      <button class="btn secondary" data-nav="report">View Report</button>
    </div></div>`;
  wrap.appendChild(panel);
  panel.querySelectorAll('[data-nav]').forEach(el=>el.addEventListener('click', ()=>{ currentView = el.getAttribute('data-nav'); render(); }));
}

async function onSaveCampaign(){
  setupDraft.client = canonicalClient(setupDraft.client); // 'tesco ' -> 'Tesco' when Tesco is already in the list
  if(!setupDraft.client || !setupDraft.name || !setupDraft.startDate || !setupDraft.endDate || !setupDraft.objective){
    showToast('Please fill in all required fields'); return;
  }
  if(new Date(setupDraft.endDate) <= new Date(setupDraft.startDate)){
    showToast('End date must be after start date'); return;
  }
  if(!setupDraft.id){
    setupDraft.id = uuid();
    setupDraft.createdAt = Date.now();
    campaigns.push(setupDraft);
  } else {
    const idx = campaigns.findIndex(x=>x.id===setupDraft.id);
    campaigns[idx] = setupDraft;
  }
  await persistCampaigns();
  currentCampaignId = setupDraft.id;
  showToast('Campaign saved');
  await enterWeeklyView(currentCampaignId);
}

// ---------- Boot ----------
(async function init(){
  document.getElementById('app').innerHTML = `<div class="wrap"><div class="subtle" style="padding:40px 0;">Loading campaigns…</div></div>`;
  await loadCampaigns();
  render();
})();
</script>
